name: Forecast Maps Index (index.json aggregato su fm2-rendered)

# MeteoRisk forecast-maps-index — INDEX-BUILDER, SCRITTORE UNICO degli `index.json`.
#
# PERCHE' ESISTE (architettura a 6 branch dati, split dei workflow per fornitore):
#   I workflow per-fornitore (`forecast-maps-dwdicon.yml`, `forecast-maps-dwd.yml`,
#   `forecast-maps-ecmwf.yml`, `forecast-maps-ncep.yml`,
#   `forecast-maps-meteofrance.yml`) pubblicano i WebP pre-renderizzati sui PROPRI
#   path disgiunti di `fm2-rendered` (`data/fm2-rendered/<regione>/<dominio>/**`), ma
#   NESSUNO di essi scrive gli `index.json` aggregati. Motivo (LOST-UPDATE):
#   il client HTML legge UN SOLO `data/fm2-rendered/<regione>/index.json` per regione
#   (HTML riga 12088) e da quell'indice scopre TUTTI i domini visibili in quella
#   regione. Se ognuno dei 5 workflow riscrivesse l'indice limitandolo ai propri
#   domini, gli altri domini SPARIREBBERO dal client a ogni push (l'ultimo scrittore
#   vince e cancella il lavoro degli altri). Con cinque scrittori concorrenti su un
#   unico file il lost-update sarebbe la norma, non l'eccezione.
#   SOLUZIONE: UN SOLO scrittore, questo workflow. Legge i 5 branch dati
#   (i manifest engine `data/fm2/<dominio>/latest.json` da ciascun branch fornitore)
#   e i WebP aggregati da `fm2-rendered`, esegue `render_fm_webp.py --index-only` con
#   la lista COMPLETA dei 7 domini e pubblica `data/fm2-rendered/<regione>/index.json`
#   + `data/fm2-rendered/color_scales.json` su `fm2-rendered` (piu', da questa
#   versione, `data/fm2-rendered/<regione>/timeline.json` generato da
#   `scripts/forecast_v2/build_timeline_index.py`). Nessun altro workflow
#   tocca quei file.
#
# COESISTENZA COL MONOLITE (AZIONE RICHIESTA ALL'OPERATORE):
#   Il vecchio `forecast-maps-v2.yml` e' ANCORA PRESENTE e il suo cron (:10 UTC)
#   e' ancora attivo. Questa architettura a 6 branch lo SOSTITUISCE: i 5 workflow
#   per-fornitore scrivono i `.om` sui branch fornitore e i WebP su `fm2-rendered`,
#   mentre il monolite scrive tutto su `fm2-cache` (branch che il client, dopo la
#   1.2.4.12, usa solo come FALLBACK per i domini ignoti). Se il monolite continua
#   a girare: (a) duplica il lavoro dell'engine su `fm2-cache`, (b) NON aggiorna
#   `fm2-rendered`, (c) il suo `--index-only` scrive l'index aggregato su
#   `fm2-cache` (non su `fm2-rendered`) -> l'indice che il client legge NON viene
#   aggiornato da lui. Non c'e' corruzione incrociata (branch diversi), ma c'e'
#   spreco e confusione. DECISIONE CONSIGLIATA: disattivare/rimuovere il cron del
#   monolite e tenerlo solo per rollback manuale. NON e' stato toccato in questa
#   modifica (fuori scope dichiarato), quindi va deciso a parte.
#
# COME LEGGE I 5 BRANCH (checkout dei soli path necessari, non un merge):
#   `--index-only` (rebuild_index, render_fm_webp.py righe 785-895) legge dal
#   FILESYSTEM LOCALE, non dagli artifact: per OGNI dominio include una voce se e solo
#   se (a) il dominio e' nella lista `--domains` e (b) esiste
#   `data/fm2/<dominio>/latest.json` in `--in`. Basta quindi MATERIALIZZARE nel
#   working tree i `data/fm2/<dominio>/` di TUTTI e 5 i branch: qui si fa un
#   `git fetch --depth=1 origin <branch>` + `git checkout FETCH_HEAD -- data/fm2` per
#   ciascuno dei 5 branch, in sequenza. I path `data/fm2/<dominio>/` sono DISGIUNTI
#   per branch (l'allowlist di ogni engine lo garantisce), quindi i 5 checkout
#   COESISTONO senza sovrascriversi: dopo i 5 fetch il working tree ha i manifest di
#   tutti e 7 i domini. Da `fm2-rendered` NON si prendono i WebP: si materializzano
#   i SOLI manifest JSON (1.339 path `.json` con `mapfile` + UN solo `git checkout`),
#   perche' `rebuild_index --index-only` legge solo quelli; i `.webp` restano nel
#   branch. `fm2-rendered` e' anche il branch di SCRITTURA dell'indice. I metodi di
#   estrazione provati e SCARTATI, con i tempi misurati sui run reali, sono
#   documentati nello step "Recupera i manifest JSON da fm2-rendered".
#   Un branch assente o mai popolato NON e' un errore: `git ls-tree` lo rileva e il
#   checkout viene saltato (tolleranza, come nel resto della pipeline); il renderer
#   escludera' da solo i domini senza manifest con
#   "[index] <regione>/<dominio>: escluso: non presente in --in".
#
# TIMELINE (`data/fm2-rendered/<regione>/timeline.json`) — aggiunta insieme all'indice:
#   Oltre agli `index.json`, questo job e' anche lo scrittore UNICO del
#   `timeline.json` per regione, prodotto da
#   `scripts/forecast_v2/build_timeline_index.py`: per ogni `valid_time` vince la
#   run piu' recente che ha un frame RESO, cosi' il client legge UNA sequenza
#   cronologica sola invece di ricostruirla da 3 run per dominio. Il file cita
#   SOLO frame presenti nell'albero del branch (`--path-list` preso da
#   `git ls-tree -r --name-only`: nessun blob WebP scaricato), quindi un
#   manifest che dichiara un frame assente NON produce un 404 lato client: il
#   frame viene scartato e dichiarato in `dropped`. Il generatore e' ADDITIVO:
#   non legge ne' scrive `index.json`.
#   `--now` NON viene passato di proposito: `generated_at` e' l'ora reale UTC al
#   secondo (`utcnow_iso` in `build_timeline_index.py`), quindi cambia a ogni
#   run e il polling del client — che confronta `generated_at` — se ne accorge.
#   GUARDIA DI SCOPE: `ALLOW_RE` ammette `<regione>/{index,timeline}.json` e
#   `color_scales.json`; qualunque `.webp` (o qualunque altro path) fa fallire
#   il commit, come prima.
#   FALLIMENTO DEL GENERATORE (exit != 0): l'indice si pubblica COMUNQUE — le
#   mappe non devono dipendere da un file accessorio — e il fallimento diventa
#   VISIBILE con `::warning::` (log + step summary). `timeline_ok=false`
#   viaggia verso lo step di commit, che in quel caso NON stagea alcun
#   `timeline.json`: resta in piedi quello gia' sul branch, perche' non si
#   cancella un file buono solo perche' una rigenerazione e' andata male.
#   Il job resta verde: il segnale e' il warning, non un job rosso sulle mappe.
#
# TRIGGER: ogni merge fornitore invia `repository_dispatch` dopo aver pubblicato
# i WebP. Il GITHUB_TOKEN con contents:write puo' avviare questo evento senza PAT.
# Lo schedule resta come recupero periodico in caso di dispatch mancato.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ci-run, forecast-maps-published]
  schedule:
    # Recupero periodico in caso di dispatch mancato.
    - cron: "50 */6 * * *"

# CONCURRENCY PROPRIA: `cancel-in-progress: false` (mai interrompere a meta' una
# pubblicazione dell'indice: il push e' un singolo commit di pochi KB, ma la
# serializzazione evita due indici scritti a meta' della stessa regione). Gruppo
# DIVERSO da tutti i per-fornitore, cosi' l'index-builder non si mette in coda
# dietro un merge WebP (che puo' durare decine di minuti) ne' viceversa.
concurrency:
  group: forecast-maps-index-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-index:
    name: index-builder (7 domini, unico scrittore)
    runs-on: ubuntu-latest
    # Leggero: 5 checkout di manifest JSON (piccoli), un checkout di `data/fm2-rendered`
    # (i WebP sono CACHED LATO GIT, non ri-renderizzati: `--index-only` non usa
    # Pillow/numpy), la scrittura di 4 index.json + color_scales.json e UN push.
    #
    # 45' (era 30') — MISURATO il 2026-10-25 sui run REALI di questa pipeline, non
    # stimato (run 40148038238, composizione del tempo per step):
    #   manifest dai 5 branch fornitore ...  5m44s
    #   manifest JSON da fm2-rendered .....  7m23s
    #   rebuild --index-only ..............    <1s
    #   timeline ..........................    <1s
    #   commit (+ push) ................... 16m58s (ucciso dal tetto di 30')
    # Con il tetto a 30' il job veniva cancellato nel SOLO step di commit: 3 run su
    # 4 cancellate e `index.json` fermo a generated_at 2026-10-25T00:35:10Z (oltre
    # 1h30 senza pubblicazione). 45' coprono la somma misurata (~30') con ~15' di
    # margine e restano molto sotto il limite di 6h del job. Il push NON e' lasciato
    # libero di consumare il budget: nello step di commit ha un `timeout 600`
    # esplicito e un `::error::` parlante (vedi li').
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
          filter: blob:none
          # Solo il renderer (per `--index-only`) e il path di lavoro dell'indice.
          # `data/fm2-rendered` viene poi materializzato da `fm2-rendered`.
          sparse-checkout: |
            scripts/forecast_v2
          sparse-checkout-cone-mode: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/forecast_v2/requirements.txt

      # `--index-only` NON richiede numpy/Pillow/omfiles (rebuild_index e' puro
      # JSON/filesystem): nessun `pip install` di requirements.txt, che servirebbe
      # solo per il path di render pesante. Il renderer importa omfiles/numpy in
      # modo lazy (solo nel path di render), quindi l'index-only funziona con la
      # sola stdlib: e' un risparmio voluto, non una scorciatoia.
      - name: Recupera i manifest engine da TUTTI e 5 i branch fornitore
        run: |
          set -e
          # I 5 branch dati per-fornitore. Ognuno contribuisce SOLO i propri
          # `data/fm2/<dominio>/` (path disgiunti: i checkout coesistono).
          BRANCHES="fm2-dwdicon fm2-dwd fm2-ecmwf fm2-ncep fm2-meteofrance"
          git sparse-checkout disable >/dev/null 2>&1 || true
          for b in $BRANCHES; do
            if ! git fetch --no-tags --depth=1 origin "$b" 2>/dev/null; then
              echo "[fetch] $b: branch assente (mai popolato): salto."
              continue
            fi
            # Guardia `git ls-tree`: il path puo' non esistere nell'albero.
            if git ls-tree --name-only FETCH_HEAD -- "data/fm2" 2>/dev/null | grep -q .; then
              echo "[fetch] $b: data/fm2 presente: checkout dei manifest."
              git checkout FETCH_HEAD -- "data/fm2" 2>/dev/null || echo "[fetch] $b: checkout non riuscito (tollerato)."
            else
              echo "[fetch] $b: nessun data/fm2 (branch vuoto): salto."
            fi
          done
          echo "[fetch] manifest engine presenti:"
          find data/fm2 -maxdepth 2 -name latest.json 2>/dev/null | sort || true

      - name: Recupera i manifest JSON da fm2-rendered (NON i WebP)
        run: |
          set -e
          git sparse-checkout disable >/dev/null 2>&1 || true
          if ! git fetch --no-tags --depth=1 origin fm2-rendered 2>/dev/null; then
            echo "[fetch] fm2-rendered: branch assente (prima pubblicazione): niente WebP."
            exit 0
          fi
          if git ls-tree --name-only FETCH_HEAD -- "data/fm2-rendered" 2>/dev/null | grep -q .; then
            # 1.2.4.13: il checkout integrale di `data/fm2-rendered` scaricava TUTTI i
            # blob WebP (albero da 8,37 GB / 45.771 blob, misurato il 2026-10-25) e il
            # job index-builder superava il timeout di 30'. Ma `rebuild_index
            # --index-only` legge SOLO i manifest `<var>/latest.json`: i .webp non gli
            # servono. Il commit usa un indice TEMPORANEO popolato dal tree del branch
            # (`git read-tree "$BASE"`), quindi i WebP non sono MAI staged e non
            # possono essere rimossi: si materializzano solo i JSON (1.339 manifest).
            #
            # STORIA MISURATA DELL'ESTRAZIONE — numeri dai LOG DEI RUN REALI, non da
            # test locali:
            #   (a) `git checkout` PER FILE (96 prima, 1.339 dopo): 6m20s-7m57s
            #       (run del 24/10/2026); 1.339 processi git. SCARTATO.
            #   (b) `git checkout` IN BATCH, UNA sola invocazione con tutti i path:
            #       step 5m09s (run 40132178240: 21:02:37 -> 21:07:42, 305 s), quasi
            #       tutto lazy-fetch dei blob. E' IL METODO IN USO.
            #   (c) `git archive --format=tar` + `tar -x`: provato in 1.2.4.20 e
            #       SCARTATO PERCHE' REGRESSIONE. Step 20m55s (run 40139883579:
            #       22:51:51 -> 23:12:43 = 20m52s nella sola estrazione), cioe' 4x il
            #       metodo (b). Il test locale sintetico che lo aveva fatto scegliere
            #       (3 round trip promisor contro 291, 9,94 s contro 26,14 s) NON si
            #       e' trasferito al runner. La causa esatta NON e' stata isolata: qui
            #       si riporta il fatto misurato, non l'ipotesi.
            echo "[fetch] fm2-rendered: presente -> checkout dei SOLI manifest JSON."
            mapfile -t JSON_PATHS < <(git ls-tree -r --name-only FETCH_HEAD -- "data/fm2-rendered" | grep -E '\.json$' || true)
            if [ "${#JSON_PATHS[@]}" -gt 0 ]; then
              echo "[fetch] fm2-rendered: ${#JSON_PATHS[@]} manifest JSON in UN SOLO checkout (metodo b)."
              # 1.339 path da ~90 byte = ~120 KB di argomenti: ampiamente sotto
              # ARG_MAX, nessun `xargs` necessario.
              if git checkout FETCH_HEAD -- "${JSON_PATHS[@]}"; then
                echo "[fetch] checkout in batch: estrazione completata."
              else
                # FALLBACK 1 — NON MISURATO SU RUNNER: nei run del 24/10/2026 il
                # checkout in batch e' riuscito al primo tentativo, quindi questo ramo
                # non e' mai stato eseguito. Resta come rete di sicurezza perche' e' un
                # trasporto DIVERSO (lettura di oggetti `cat-file --batch`, un solo
                # processo) e non tocca l'indice del working tree.
                echo "[fetch] checkout in batch fallito: fallback 1 = cat-file --batch."
                # NB: il corpo dello heredoc e' indentato 10 spazi come il resto del
                # blocco perche' e' YAML a togliere l'indentazione comune; dopo il
                # dedent il codice Python parte da colonna 0.
                if python - "${JSON_PATHS[@]}" <<'PY'
          import os, subprocess, sys

          # Estrae dal tree di FETCH_HEAD i soli path passati, con UNA invocazione di
          # `git cat-file --batch` (un solo processo; nessun checkout, quindi l'indice
          # del working tree non viene toccato e nessun WebP viene materializzato).
          paths = sys.argv[1:]
          ls = subprocess.run(["git", "ls-tree", "-r", "FETCH_HEAD", "--"] + paths,
                              capture_output=True, check=True).stdout
          sha_by_path = {}
          for line in ls.splitlines():
              meta, path = line.split(b"\t", 1)
              sha_by_path[path.decode("utf-8", "surrogateescape")] = meta.split()[2].decode()
          shas = [sha_by_path[p] for p in paths if p in sha_by_path]
          if not shas:
              raise SystemExit("[fetch] cat-file: nessun blob da estrarre")
          proc = subprocess.run(["git", "cat-file", "--batch"],
                                input=("\n".join(shas) + "\n").encode(), capture_output=True)
          if proc.returncode != 0:
              raise SystemExit("[fetch] cat-file --batch rc=%d" % proc.returncode)
          buf, pos, by_sha = proc.stdout, 0, {}
          while pos < len(buf):
              nl = buf.index(b"\n", pos)
              hdr = buf[pos:nl].decode().split()
              pos = nl + 1
              if len(hdr) < 3:
                  raise SystemExit("[fetch] cat-file: oggetto assente: " + " ".join(hdr))
              size = int(hdr[2])
              by_sha[hdr[0]] = buf[pos:pos + size]
              pos += size + 1
          scritti = 0
          for path in paths:
              data = by_sha.get(sha_by_path.get(path))
              if data is None:
                  continue
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, "wb") as fh:
                  fh.write(data)
              scritti += 1
          print("[fetch] cat-file --batch: %d/%d blob scritti" % (scritti, len(paths)))
          raise SystemExit(0 if scritti == len(paths) else 1)
          PY
                then
                  echo "[fetch] cat-file --batch: estrazione completata."
                else
                  # FALLBACK 2 = checkout per-file (il vecchio metodo (a)): lento ma
                  # tollerante, un path alla volta. Un fallimento per singolo path non
                  # interrompe: lo rileva la verifica qui sotto, che e' il gate vero.
                  echo "[fetch] cat-file --batch fallito: fallback 2 = checkout per-file (tollerato)."
                  for p in "${JSON_PATHS[@]}"; do
                    git checkout FETCH_HEAD -- "$p" 2>/dev/null \
                      || echo "[fetch]   $p: checkout non riuscito (tollerato)."
                  done
                fi
              fi
            fi
            # VERIFICA (obbligatoria): ogni manifest atteso deve esistere e avere il
            # blob IDENTICO a quello dell'albero. `git hash-object --no-filters`
            # ricalcola l'OID dai byte su disco senza applicare filtri (indipendente
            # da .gitattributes e core.autocrlf), quindi confronta davvero il
            # contenuto. Nessun `.webp` deve comparire.
            # COSTO: UN solo processo `git hash-object --no-filters --stdin-paths` su
            # TUTTI i path + UN `awk` per il confronto, invece di UN PROCESSO GIT PER
            # FILE (1.339 `git hash-object`, uno per manifest, nella versione
            # precedente). Il gate dei path mancanti e' un `[ -f ]` (builtin): il
            # ciclo di preparazione non spawna processi.
            VERIFY_WORK="$(mktemp -d)"
            git ls-tree -r FETCH_HEAD -- "data/fm2-rendered" | grep -E '\.json$' > "$VERIFY_WORK/tree.txt" || true
            VERIFY_N="$(wc -l < "$VERIFY_WORK/tree.txt")"
            : > "$VERIFY_WORK/paths.txt"
            : > "$VERIFY_WORK/expected.txt"
            : > "$VERIFY_WORK/bad.txt"
            VERIFY_BAD=0
            while IFS=$'\t' read -r meta path; do
              if [ -n "$path" ]; then
                if [ -f "$path" ]; then
                  printf '%s\n' "$path" >> "$VERIFY_WORK/paths.txt"
                  printf '%s\t%s\n' "${meta##* }" "$path" >> "$VERIFY_WORK/expected.txt"
                else
                  echo "::error::[verify] manifest MANCANTE: $path"
                  VERIFY_BAD=$((VERIFY_BAD + 1))
                fi
              fi
            done < "$VERIFY_WORK/tree.txt"
            VERIFY_DIFF=0
            if [ -s "$VERIFY_WORK/paths.txt" ]; then
              git hash-object --no-filters --stdin-paths < "$VERIFY_WORK/paths.txt" > "$VERIFY_WORK/actual.txt"
              # `expected.txt` = `<sha atteso>\t<path>`, `actual.txt` = uno sha per
              # riga nello STESSO ordine dell'input. Un solo `awk` con due file:
              # `NR == FNR` identifica il primo. Esce 2 se i conteggi non combaciano
              # (estrazione parziale), 0 altrimenti, e stampa i path diversi.
              if ! awk -F'\t' '
                NR == FNR { exp_sha[FNR] = $1; exp_path[FNR] = $2; n = FNR; next }
                { act_sha[FNR] = $1; m = FNR }
                END {
                  if (m != n) {
                    printf "[verify] hash-object: %d righe contro %d path\n", m, n
                    exit 2
                  }
                  for (i = 1; i <= n; i++) {
                    if (exp_sha[i] != act_sha[i]) print exp_path[i]
                  }
                }' "$VERIFY_WORK/expected.txt" "$VERIFY_WORK/actual.txt" > "$VERIFY_WORK/bad.txt"; then
                echo "::error::[verify] git hash-object --stdin-paths: numero di righe diverso dal numero di path (estrazione parziale)."
                rm -rf "$VERIFY_WORK"
                exit 1
              fi
              VERIFY_DIFF="$(wc -l < "$VERIFY_WORK/bad.txt")"
            fi
            WEBP_MAT="$(find data/fm2-rendered -name '*.webp' 2>/dev/null | wc -l)"
            if [ "$VERIFY_BAD" -ne 0 ] || [ "$VERIFY_DIFF" -ne 0 ]; then
              while read -r bad_path; do
                echo "::error::[verify] manifest DIVERSO dal blob dell'albero: $bad_path"
              done < "$VERIFY_WORK/bad.txt"
              echo "::error::[verify] $((VERIFY_BAD + VERIFY_DIFF)) manifest JSON non verificati su $VERIFY_N (mancanti: $VERIFY_BAD, diversi: $VERIFY_DIFF)."
              rm -rf "$VERIFY_WORK"
              exit 1
            fi
            rm -rf "$VERIFY_WORK"
            echo "[verify] manifest JSON: $VERIFY_N/$VERIFY_N identici all'albero; WebP materializzati: $WEBP_MAT."
            echo "[verify] verifica eseguita con 2 processi git (ls-tree + hash-object --stdin-paths), non $VERIFY_N."
            echo "[fetch] manifest JSON materializzati: $(find data/fm2-rendered -name '*.json' 2>/dev/null | wc -l)"
          else
            echo "[fetch] fm2-rendered: nessun data/fm2-rendered: salto."
          fi

      - name: Rebuild index.json per regione (--index-only, 7 domini)
        id: index
        run: |
          # Lista COMPLETA dei 7 domini: l'UNICO punto in cui e' scritta. Il
          # renderer include un dominio solo se (a) e' in --domains e (b) esiste
          # `data/fm2/<dominio>/latest.json`. I domini assenti vengono esclusi da
          # soli (log "[index] ...: escluso: non presente in --in"), senza errore.
          # Se NESSUN dominio valido risultasse, il renderer esce 1 e l'indice NON
          # viene scritto: nessuna pubblicazione fuorviante.
          if [ ! -d data/fm2 ]; then
            echo "[WARN] Nessun manifest engine materializzato: nessun dominio indicizzabile."
          fi
          python scripts/forecast_v2/render_fm_webp.py \
            --in data/fm2 \
            --out data/fm2-rendered \
            --index-only \
            --domains "dwd_icon,dwd_icon_eu,dwd_icon_d2,ecmwf_ifs025,ncep_gfs025,ncep_gfs013,meteofrance_arpege_world025"

      # ── timeline.json: indice UNICO dei run conservati (merge per valid_time) ──
      # Gira DOPO `--index-only` (i manifest `<regione>/<dominio>/runs/<run_id>/
      # <variabile>/latest.json` sono gia' nel working tree) e PRIMA del commit.
      # Scrive in una directory TEMPORANEA (`--out-root`) e copia in
      # `data/fm2-rendered/<regione>/` solo quando TUTTE le regioni sono andate
      # a buon fine: se qualcosa fallisce il working tree non e' stato toccato,
      # quindi nessuna timeline PARZIALE puo' finire nel commit.
      # Esce SEMPRE 0: il fallimento e' un `::warning::` (vedi intestazione del
      # file), non un job rosso che fermerebbe la pubblicazione delle mappe.
      - name: Build timeline.json per regione (merge run, --path-list)
        id: timeline
        if: success()
        run: |
          set -u
          TMP_OUT="$(mktemp -d)"
          FOUND=""
          # Una regione entra solo se ha almeno un `<dominio>/runs/`: passare a
          # `--regions` una regione assente farebbe uscire lo script con 2
          # ("argomenti non validi"), che qui non e' un errore ma una regione
          # semplicemente vuota.
          for r in italia europa north domain; do
            region_dir="data/fm2-rendered/$r"
            [ -d "$region_dir" ] || continue
            for candidate in "$region_dir"/*/runs; do
              if [ -d "$candidate" ]; then FOUND="$FOUND $r"; break; fi
            done
          done
          FOUND="${FOUND# }"
          if [ -z "$FOUND" ]; then
            echo "::warning::timeline: nessuna regione con <dominio>/runs/ sotto data/fm2-rendered: nessun timeline.json generato, index.json pubblicato comunque."
            echo "timeline_ok=false" >> "$GITHUB_OUTPUT"
            rm -rf "$TMP_OUT"
            exit 0
          fi
          echo "[timeline] regioni con run WebP: $FOUND"
          status=0
          for r in $FOUND; do
            # Inventario dell'ALBERO (non del disco): `--path-list` verifica i
            # frame citati dai manifest senza scaricare un solo blob WebP.
            raw="$TMP_OUT/tree_$r.txt"
            listing="$TMP_OUT/paths_$r.txt"
            if ! git ls-tree -r --name-only FETCH_HEAD -- "data/fm2-rendered/$r/" > "$raw"; then
              echo "::warning::timeline: inventario git ls-tree fallito per $r."
              status=2
              break
            fi
            if [ ! -s "$raw" ]; then
              echo "::warning::timeline: inventario VUOTO per $r (fm2-rendered non materializzato?): timeline non aggiornata."
              status=2
              break
            fi
            sed "s|^data/fm2-rendered/$r/||" "$raw" > "$listing"
            echo "[timeline] $r: $(wc -l < "$listing") path nell'albero del branch."
            python scripts/forecast_v2/build_timeline_index.py \
              --root data/fm2-rendered \
              --out-root "$TMP_OUT" \
              --regions "$r" \
              --path-list "$listing"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::warning::timeline: build_timeline_index.py rc=$rc su $r."
              status=$rc
              break
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "::warning::timeline NON aggiornata (rc=$status): index.json viene pubblicato, timeline.json NO (resta quello gia' sul branch, se c'e')."
            echo "timeline_ok=false" >> "$GITHUB_OUTPUT"
            rm -rf "$TMP_OUT"
            exit 0
          fi
          for r in $FOUND; do
            if [ -f "$TMP_OUT/$r/timeline.json" ]; then
              cp "$TMP_OUT/$r/timeline.json" "data/fm2-rendered/$r/timeline.json"
              echo "[timeline] $r: timeline.json scritto ($(wc -c < "data/fm2-rendered/$r/timeline.json") byte)."
            else
              echo "[timeline] $r: nessuna run valida -> nessun timeline.json (un eventuale file gia' sul branch resta invariato)."
            fi
          done
          echo "timeline_ok=true" >> "$GITHUB_OUTPUT"
          rm -rf "$TMP_OUT"

      - name: Summary
        if: always()
        env:
          TIMELINE_OK: ${{ steps.timeline.outputs.timeline_ok }}
        run: |
          {
            echo "## MeteoRisk — Forecast Maps Index (index.json aggregato)"
            echo ""
            for r in italia europa north domain; do
              if [ -f "data/fm2-rendered/$r/index.json" ]; then
                python -c "import json; d=json.load(open('data/fm2-rendered/$r/index.json')); doms=d.get('domains',{}); print('$r — themes:', ','.join(d.get('themes',[])), '— domini:', len(doms), '->', ', '.join(sorted(doms)))"
              else
                echo "$r — index.json NON scritto (nessun dominio valido per la regione)."
              fi
            done
            echo ""
            # Esito della timeline: `timeline_ok` e' l'output dello step che ha
            # eseguito `build_timeline_index.py` (stringa vuota = step saltato).
            if [ "${TIMELINE_OK:-}" = "true" ]; then
              echo "Timeline: aggiornata."
            else
              echo "Timeline: NON aggiornata in questa run (step 'Build timeline.json per regione' fallito o saltato: vedi i ::warning:: nel log). I timeline.json gia' sul branch NON sono stati toccati e index.json e' pubblicato comunque."
            fi
            for r in italia europa north domain; do
              if [ -f "data/fm2-rendered/$r/timeline.json" ]; then
                python -c "import json; d=json.load(open('data/fm2-rendered/$r/timeline.json')); s=d.get('summary',{}); print('  $r - generated_at:', d.get('generated_at'), '- domini:', s.get('domains'), '- run:', s.get('runs'), '- gruppi:', s.get('groups'), '- frame:', s.get('timeline_frames'))"
              else
                echo "  $r - timeline.json assente."
              fi
            done
            echo ""
            echo "Manifest engine visti (fonte: 5 branch fornitore):"
            find data/fm2 -maxdepth 2 -name latest.json 2>/dev/null | sort || true
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit index.json + color_scales.json + timeline.json su fm2-rendered (only if changed)
        if: success()
        run: |
          git config user.name "meteorisk-bot"
          git config user.email "actions@users.noreply.github.com"
          git sparse-checkout disable >/dev/null 2>&1 || true
          # L'index-builder e' lo SCRITTORE UNICO di: <regione>/index.json per
          # italia/europa/north/domain, color_scales.json e <regione>/timeline.json.
          # Sono gli unici path che questo job puo' toccare. NON tocca MAI le
          # directory WebP `data/fm2-rendered/<regione>/<dominio>/**` (di
          # proprieta' dei 5 merge per-fornitore): path disgiunti.
          # `timeline.json` entra nell'allowlist SOLO come nome ESATTO sotto una
          # delle 4 regioni: `(index|timeline)\.json$` non puo' combaciare con un
          # `.webp` ne' con un JSON dentro `<regione>/<dominio>/`.
          ALLOW_RE='^data/fm2-rendered/(italia|europa|north|domain)/(index|timeline)\.json$|^data/fm2-rendered/color_scales\.json$'
          # Path di proprieta': sempre i 4 index.json + color_scales.json; i 4
          # timeline.json SOLO se il generatore e' andato a buon fine. Con
          # `timeline_ok != true` (fallimento o step saltato) i timeline.json non
          # vengono ne' staged ne' rimossi: resta in piedi quello del branch.
          OWNED="data/fm2-rendered/italia/index.json data/fm2-rendered/europa/index.json data/fm2-rendered/north/index.json data/fm2-rendered/domain/index.json data/fm2-rendered/color_scales.json"
          TIMELINE_OK="${{ steps.timeline.outputs.timeline_ok }}"
          if [ "$TIMELINE_OK" = "true" ]; then
            OWNED="$OWNED data/fm2-rendered/italia/timeline.json data/fm2-rendered/europa/timeline.json data/fm2-rendered/north/timeline.json data/fm2-rendered/domain/timeline.json"
            MSG="chore(fm2): rebuild index.json aggregato (7 domini) + color_scales + timeline"
          else
            MSG="chore(fm2): rebuild index.json aggregato (7 domini) + color_scales (timeline invariata)"
            echo "[INFO] timeline_ok=${TIMELINE_OK:-vuoto}: nessun timeline.json entra in questo commit."
          fi
          # ── STRUMENTAZIONE (2026-10-25) ────────────────────────────────────────
          # Ogni fase di questo step stampa ora UTC di inizio/fine e durata, cosi' il
          # prossimo run dice DOVE si blocca invece di lasciarlo dedurre. Contesto: il
          # commit step e' l'unica fase che sfonda il budget (16m58s nel run
          # 40148038238, ucciso dal tetto di 30') e nel run 40150515799 il fetch e'
          # risultato COMPLETATO alle 01:42:58, seguito da 12' di silenzio totale.
          echo "[commit] $(date -u +%H:%M:%S) step di commit avviato (job a 45', push con tetto 600s)."
          for i in 1 2 3 4 5; do
            # ── FETCH CONDIZIONALE ───────────────────────────────────────────────
            # PERCHE': `fm2-rendered` e' un albero da 118.587 file / ~8,4 GB e il suo
            # `git fetch --depth=1` e' la voce piu' cara di questo step. Ma lo step
            # "Recupera i manifest JSON da fm2-rendered", piu' sopra nello stesso job,
            # ha GIA' fatto lo stesso fetch: se il tip remoto non si e' mosso,
            # `FETCH_HEAD` e' gia' il commit giusto e il fetch e' RIDONDANTE.
            # `git ls-remote` costa pochi KB (nessun oggetto scaricato: il server
            # annuncia solo i ref) e dice subito se il branch si e' mosso; il fetch
            # si paga SOLO quando serve davvero.
            # NB: dal tentativo 2 in poi, dopo una race sul lease, il tip remoto e'
            # diverso per costruzione -> il fetch viene rifatto: la semantica del
            # retry non cambia.
            T_F_0=$(date -u +%s)
            REMOTE="$(git ls-remote origin refs/heads/fm2-rendered 2>/dev/null | cut -f1 || true)"
            LOCAL_TIP="$(git rev-parse --verify --quiet FETCH_HEAD 2>/dev/null || true)"
            if [ -n "$REMOTE" ] && [ "$REMOTE" = "$LOCAL_TIP" ]; then
              echo "[commit] $(date -u +%H:%M:%S) fetch SALTATO: tip remoto == FETCH_HEAD ($REMOTE); ls-remote in $(( $(date -u +%s) - T_F_0 ))s."
            else
              echo "[commit] $(date -u +%H:%M:%S) fetch necessario: remoto=${REMOTE:-<assente>} locale=${LOCAL_TIP:-<assente>} (ls-remote in $(( $(date -u +%s) - T_F_0 ))s)."
              git fetch --no-tags --depth=1 origin fm2-rendered || true
              echo "[commit] $(date -u +%H:%M:%S) fetch terminato, durata totale $(( $(date -u +%s) - T_F_0 ))s."
            fi
            if git rev-parse --verify --quiet FETCH_HEAD >/dev/null 2>&1; then
              BASE="$(git rev-parse FETCH_HEAD^{tree})"
              PARENT="$(git rev-parse FETCH_HEAD)"
            else
              echo "[INFO] fm2-rendered non esiste ancora: questo e' il primo commit del branch."
              BASE="$(git hash-object -t tree /dev/null)"
              PARENT=""
            fi
            IDX="$(mktemp -u)"; rm -f "$IDX"
            T_RT_0=$(date -u +%s)
            GIT_INDEX_FILE="$IDX" git read-tree "$BASE"
            echo "[commit] $(date -u +%H:%M:%S) read-tree completato in $(( $(date -u +%s) - T_RT_0 ))s (tree $BASE)."
            # (1) stage-out dei SOLI path di proprieta' dell'index-builder che
            #     esistono nell'indice del branch (index.json/timeline.json delle 4
            #     regioni + color_scales.json): verranno ri-aggiunti dal working
            #     tree.
            #     ⚠️ NON si tocca nulla sotto <regione>/<dominio>/ (WebP).
            for p in $OWNED; do
              if GIT_INDEX_FILE="$IDX" git ls-files -- "$p" | grep -q .; then
                GIT_INDEX_FILE="$IDX" git update-index --force-remove -- "$p"
              fi
            done
            # (2) ri-aggiungi dal working tree i SOLI path che esistono davvero
            #     (una regione senza domini validi non ha scritto l'index).
            add_paths=""
            for p in $OWNED; do
              [ -e "$p" ] && add_paths="$add_paths $p"
            done
            if [ -n "$add_paths" ]; then
              # shellcheck disable=SC2086
              GIT_INDEX_FILE="$IDX" git add -A -- $add_paths
            fi
            T_WT_0=$(date -u +%s)
            # `--missing-ok` NON e' un cosmetico: SENZA, `git write-tree` verifica
            # che OGNI oggetto citato dall'indice esista nel database locale. Su un
            # partial clone (`filter: blob:none`) i 118.587 blob NON ci sono, quindi
            # per ognuno parte un promisor fetch che il filtro non puo' soddisfare.
            # MISURATO il 2026-10-25, tre prove indipendenti:
            #   - run reale 40146235225: fetch del commit step 00:35:12, guardia di
            #     scope alle 00:48:37 -> 13m25s spesi fra read-tree/write-tree/add;
            #   - clone identico (blob:none, depth=1): read-tree 0,19s, poi write-tree
            #     bloccato >9' con un `git fetch origin --stdin --filter=blob:none`
            #     figlio (osservato con Get-CimInstance);
            #   - stesso clone con `GIT_NO_LAZY_FETCH=1`: "fatal: could not fetch
            #     9b349352... from promisor remote" (9b349352 e' un BLOB, verificato
            #     con GET /git/blobs).
            # Con il flag: 0,11s, e l'albero prodotto e' IDENTICO (39c46da5... = BASE
            # a indice invariato). Il controllo saltato e' ridondante: le entry
            # vengono da `git read-tree` dell'albero del branch (oggetti che il
            # remote ha gia') piu' i path locali appena aggiunti da `git add`.
            TREE="$(GIT_INDEX_FILE="$IDX" git write-tree --missing-ok)"
            echo "[commit] $(date -u +%H:%M:%S) write-tree completato in $(( $(date -u +%s) - T_WT_0 ))s (tree $TREE)."
            rm -f "$IDX"
            # NO-OP: nessun path cambiato => nessun churn, ZERO file nel commit.
            # ⚠️ Con la timeline `generated_at` viene dall'ora reale (nessun
            # `--now`), quindi in pratica il file cambia a ogni run e il branch
            # riceve un commit per run; il NO-OP resta il comportamento corretto
            # quando il file rigenerato e' byte-identico a quello del branch
            # (stesso secondo, oppure `--now` fisso in prova manuale). Non esiste
            # alcun `git commit --allow-empty`: se il tree coincide, si esce 0
            # con 0 file modificati.
            if [ "$TREE" = "$BASE" ]; then
              echo "[INFO] Nessuna modifica (0 file): index.json, color_scales.json e timeline.json invariati (NO-OP)."
              exit 0
            fi
            # (3) GUARDIA DI SCOPE: il commit dell'index-builder deve toccare SOLO
            #     <regione>/index.json, <regione>/timeline.json e
            #     color_scales.json. Un solo path fuori allowlist (es. un WebP di
            #     un dominio) => ABORTISCI.
            git diff-tree -r --no-commit-id --name-only "$BASE" "$TREE" > /tmp/fm2_idx_scope.txt
            CHANGED="$(wc -l < /tmp/fm2_idx_scope.txt)"
            BAD_SCOPE="$(grep -E -v "$ALLOW_RE" /tmp/fm2_idx_scope.txt || true)"
            if [ -n "$BAD_SCOPE" ]; then
              echo "::error::GUARDIA DI SCOPE VIOLATA (index-builder): path fuori allowlist:"
              printf '%s\n' "$BAD_SCOPE"
              exit 1
            fi
            echo "[guardia] scope OK: $CHANGED path toccati (index.json + color_scales.json + timeline.json)"
            # COMMIT ORPHAN (nessun parent) + LEASE: la storia del branch dati
            # resta profonda UN commit, e il push riesce SOLO se il tip remoto e'
            # ancora $PARENT. Se il branch non esiste ($PARENT vuoto) il lease
            # pretende che il ref NON esista (forma "refs/heads/<branch>:" senza
            # valore). Mai `--force` nudo: una sovrascrittura concorrente DEVE
            # fallire invece di cancellare in silenzio.
            T_CT_0=$(date -u +%s)
            NEW="$(git commit-tree "$TREE" -m "$MSG")"
            echo "[commit] $(date -u +%H:%M:%S) commit-tree completato in $(( $(date -u +%s) - T_CT_0 ))s: $NEW (parent ${PARENT:-<nessuno: commit orphan>})."
            # ── PUSH: trace SEMPRE su file + tetto ESPLICITO di 600s ─────────────
            # Trace su FILE, mai riversato nel log dello step: `GIT_CURL_VERBOSE`
            # stamperebbe l'header `Authorization` (base64 delle credenziali), quindi
            # si usano `GIT_TRACE` (comandi git eseguiti: pack-objects, send-pack,
            # eventuale fetch promisor) e `GIT_TRACE_PACKET` (pkt-line del protocollo:
            # want/have/acck), che non contengono credenziali. Del file si stampano
            # solo le ultime righe, che per un push appeso sono esattamente il punto
            # in cui si e' fermato.
            # `timeout 600` (10') e' il tetto: se scade, il push viene ucciso
            # (`--kill-after=30s` per non lasciare processi zombie) e lo step FALLISCE
            # SUBITO con un `::error::` parlante, invece di restare appeso e bruciare
            # i 45' del job (misurato: 16m58s in un solo tentativo, run 40148038238;
            # run 40150515799 con 12' di silenzio dopo il fetch). Un timeout NON viene
            # ritentato: non e' una race sul lease, e 5 tentativi da 600s
            # sfonderebbero comunque il budget del job.
            TRACE_LOG="${RUNNER_TEMP:-/tmp}/git-push-fm2-rendered-$i.log"
            T_P_0=$(date -u +%s)
            echo "[commit] $(date -u +%H:%M:%S) push inizio (tentativo $i/5), trace -> $TRACE_LOG"
            set +e
            GIT_TRACE=1 GIT_TRACE_PACKET=1 timeout --kill-after=30s 600 \
              git push --force-with-lease="refs/heads/fm2-rendered:$PARENT" origin "$NEW:refs/heads/fm2-rendered" \
              > "$TRACE_LOG" 2>&1
            PUSH_RC=$?
            set -e
            PUSH_S=$(( $(date -u +%s) - T_P_0 ))
            echo "[commit] $(date -u +%H:%M:%S) push terminato rc=$PUSH_RC in ${PUSH_S}s; trace: $(wc -l < "$TRACE_LOG" 2>/dev/null || echo 0) righe."
            echo "[commit] trace (ultime 60 righe):"
            tail -n 60 "$TRACE_LOG" 2>/dev/null || true
            echo "[commit] git count-objects -v (dimensione locale dopo il push):"
            git count-objects -v 2>/dev/null || true
            if [ "$PUSH_RC" -eq 0 ]; then
              echo "[INFO] Push dell'indice su fm2-rendered riuscito (tentativo $i/5, ${PUSH_S}s)."
              exit 0
            fi
            if [ "$PUSH_RC" -eq 124 ] || [ "$PUSH_RC" -eq 137 ]; then
              echo "::error::push oltre 600s: processo ucciso da timeout (tentativo $i/5, ${PUSH_S}s). Le ultime righe del trace sopra dicono dove si e' fermato; file completo: $TRACE_LOG"
              exit 1
            fi
            echo "[WARN] Push su fm2-rendered rifiutato (rc=$PUSH_RC, race sul branch) - tentativo $i/5"
            sleep $((i*3))
          done
          echo "[ERROR] Push dell'indice su fm2-rendered non riuscito dopo 5 tentativi."
          exit 1
