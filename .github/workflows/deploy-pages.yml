name: Deploy Pages (manuale / consolidamento)

# DEploy Pages MANUALE/CONSOLIDAMENTO. Il workflow che viveva SOLO sul remoto
# era rotto: copiava mri-light-1.2.3.1.html (inesistente) e non includeva
# radar/phenomena/satellite nell'artefatto. Questo file ricostruisce _site in
# modo GENUINO replicando il deploy inline di radar-engine.yml e di
# update-weather-data.yml (stesso ordine, stesse guardie e stessi path):
#   - cp "$APP_FILE" _site/index.html   (APP_FILE letto da VERSION)
#   - cp sw.js _site/sw.js   (1.2.4.15: Service Worker, servito come /sw.js)
#   - data/latest, data/geography, data/radar (con restore dell'archivio
#     rolling radar-history), data/phenomena e satellite (con restore della
#     finestra satellite-cache).
# NON copiamo data/fm2 ne' data/fm2-rendered: il client li legge da
# raw.githubusercontent.com (FM_CACHE_BASE / FM_RENDERED_BASE); copiarli
# gonfiava l'artefatto a ~8,6 GB e faceva fallire/cancellare il deploy
# (limite Pages).
# Senza questi restore un deploy manuale DROPPEREBBE da Pages i dati che
# vivono solo sui branch dedicati (radar-history / satellite-cache).
# Trigger: solo workflow_dispatch (manuale) + repository_dispatch (esterno,
# tipo ci-run come gli altri motori): nessuna cron, nessun download: questo
# workflow NON tocca i motori dati, ripubblica soltanto lo stato attuale.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ci-run]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    # timeout 10 -> 30: il checkout del repo (main con ~8,6 GB di dati in git)
    # prende ~6 min, + ~1 min di build + upload/deploy Pages; con 10 minuti il
    # deploy veniva cancellato. L'artefatto _site resta ~37 MB perche' NON
    # copiamo data/fm2 ne' data/fm2-rendered (letti dal client via raw).
    timeout-minutes: 30
    # Stesso group "pages-deploy-2" usato da radar-engine A LIVELLO DI JOB: i
    # deploy dei workflow che pubblicano su Pages si serializzano tra loro
    # (cancel-in-progress: false -> le run in coda proseguono).
    concurrency:
      group: pages-deploy-2
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 1.3.0.8 / daily-series-cache: la serie giornaliera vive SOLO sul branch
      # orphan stations-daily (NON su main: ~2,9 GB/giorno di blob in piu' nella
      # storia). La scarichiamo qui, PRIMA del build, via raw/API; il file resta
      # nel working tree e lo step di build qui sotto lo copia in
      # _site/data/stations/daily_series.json con il consueto
      # `cp -R data/stations _site/data/stations` (stesso URL di sempre per il
      # client). Se il branch non esiste: nessun file, il client resta sul
      # fallback LOCALE etichettato. Nessun fail del deploy.
      - name: Recupera daily_series.json dal branch stations-daily (non su main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p data/stations
          ok=0
          curl -fsSL --max-time 90 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/stations-daily/data/stations/daily_series.json" \
            -o data/stations/daily_series.json && ok=1
          if [ "$ok" -ne 1 ]; then
            curl -fsSL --max-time 90 -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/data/stations/daily_series.json?ref=stations-daily" \
              -o data/stations/daily_series.json && ok=1
          fi
          if [ "$ok" -ne 1 ]; then
            if git fetch --depth 1 origin "+stations-daily:refs/heads/stations-daily-base" 2>/dev/null && \
               git show "stations-daily-base:data/stations/daily_series.json" > data/stations/daily_series.json 2>/dev/null; then
              ok=1
            fi
          fi
          if [ "$ok" -eq 1 ] && [ -s data/stations/daily_series.json ]; then
            echo "[INFO] daily_series.json recuperato da stations-daily: $(wc -c < data/stations/daily_series.json) byte."
          else
            rm -f data/stations/daily_series.json
            echo "[WARN] daily_series.json non disponibile su stations-daily: fallback locale etichettato."
          fi

      # ======================================================================
      # 1.3.0.48 - GATE DI SINTASSI JS PRIMA DEL DEPLOY (igiene CI).
      # MISURATO prima di questo gate: test_html_js_syntax.py NON era eseguito
      # da nessun workflow con deploy, quindi un apostrofo non escapato nel
      # changelog inline poteva rendere l'INTERO <script> un SyntaxError e
      # arrivare in produzione (difetto reale della 1.2.4.17, trovato a mano).
      # Il test compila OGNI blocco <script> inline di APP_FILE con `node
      # --check`. Va eseguito PRIMA del `cp "$APP_FILE" _site/index.html`.
      # NOTA: senza `node` nel PATH il test fa SKIP (dichiarato) e il gate
      # sarebbe vuoto -> setup-node sotto e' obbligatorio, non cosmetico.
      # ======================================================================
      - name: Setup Python (gate sintassi JS)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node (gate sintassi JS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Valida sintassi JS dell'HTML da pubblicare (fail = niente deploy)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -e
          python -m pip install --quiet pytest
          python -m pytest scripts/tests/test_html_js_syntax.py -q --capture=sys
          # 1.3.0.59 - gate esteso alla vista Simple (secondo HTML pubblicato).
          python -m pytest scripts/tests/test_simple_html_js_syntax.py -q --capture=sys
          echo "[INFO] Sintassi JS degli script inline di APP_FILE e di simple/index.html valida."

      # Build dell'artefatto replicando radar-engine.yml / update-weather-data.yml:
      # app + tutti i dati gia' pubblicati su main + restore dei branch dedicati.
      - name: Build sito statico Pages (app + data/latest + data/geography + data/radar + data/phenomena + satellite)
        run: |
          mkdir -p _site/data
          # 1.2.4.87 - niente nome scritto a mano: il run puo' aver fatto checkout
          # di un main in cui la release ha gia' rimosso quel nome (race). La fonte
          # e' APP_FILE in VERSION; se manca o il file non esiste, fail esplicito.
          APP_FILE="$(grep -m1 '^APP_FILE=' VERSION | cut -d= -f2)"
          if [ -z "$APP_FILE" ] || [ ! -f "$APP_FILE" ]; then echo "::error::APP_FILE non trovato in VERSION"; exit 1; fi
          cp "$APP_FILE" _site/index.html
          cp sw.js _site/sw.js                                      # 1.2.4.15: Service Worker (cache applicativa)
          cp manifest.webmanifest _site/manifest.webmanifest        # 1.2.4.77: PWA installabile
          cp offline.html _site/offline.html                        # 1.2.4.77: fallback offline
          # 1.3.0.59 - VISTA SIMPLE: unico file servito su /simple/ (oggi 404).
          mkdir -p _site/simple
          if [ -f simple/index.html ]; then cp simple/index.html _site/simple/index.html; fi
          mkdir -p _site/icons
          cp icons/icon-192.png _site/icons/icon-192.png            # 1.2.4.77: icone PWA
          cp icons/icon-512.png _site/icons/icon-512.png
          if [ -d data/latest ]; then cp -R data/latest _site/data/latest; fi
          if [ -d data/geography ]; then cp -R data/geography _site/data/geography; fi
          if [ -d data/climate ]; then cp -R data/climate _site/data/climate; fi
          if [ -d data/stations ]; then cp -R data/stations _site/data/stations; fi
          # 1.3.0.59 - bollettino di criticita' DPC letto dal layer omonimo della Simple.
          if [ -d data/hydro ]; then cp -R data/hydro _site/data/hydro; fi
          if git fetch --depth 1 origin "+radar-history:refs/heads/radar-history-base" 2>/dev/null && git restore --source radar-history-base --worktree -- data/radar/history 2>/dev/null; then
            echo "[INFO] Archivio rolling radar-history ripristinato per l'artifact."
          fi
          if [ -d data/radar ]; then cp -R data/radar _site/data/radar; fi
          if [ -d data/phenomena ]; then cp -R data/phenomena _site/data/phenomena; fi
          if git fetch --depth 1 origin "+satellite-cache:refs/heads/satellite-cache-base" 2>/dev/null && git restore --source satellite-cache-base --worktree -- satellite 2>/dev/null; then
            echo "[INFO] Finestra satellite/ ripristinata da satellite-cache per l'artifact."
          fi
          if [ -d satellite ]; then cp -R satellite _site/satellite; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy su GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
