name: Forecast Maps V2 - NOAA GFS 0.25 + GFS 0.117 (mappe .om + WebP, branch fm2-ncep)

# MeteoRisk forecast-maps-ncep - WORKFLOW PER-FORNITORE per NOAA GFS 0.25 + GFS 0.117.
#
# PERCHE' ESISTE (split del monolite `forecast-maps-v2.yml` in 5 workflow
# indipendenti, uno per fornitore, con 6 branch dati):
#   Nel workflow monolitico un dominio lento o fallito BLOCCAVA tutti gli altri:
#   `render-merge` aspettava l'engine di TUTTI i domini (pattern artifact `fm2-*`),
#   poi era l'UNICO scrittore di WebP+indice, quindi una run durava fino a ~3h55 e
#   il fallimento di un singolo dominio rendeva inutile il lavoro degli altri.
#   Lo split assegna a ogni FORNITORE il proprio workflow e i propri branch dati:
#   un fornitore lento o KO non tocca gli altri. Ognuno pubblica i frame .om sul
#   PROPRIO branch `fm2-ncep` e i WebP su `fm2-rendered` (path disgiunti).
#
# MATRICE DOMINI (2 dominio/i in QUESTO workflow):
#     - ncep_gfs025
#     - ncep_gfs013
#   `--domains ncep_gfs025,ncep_gfs013`, engine e render streaming nello stesso job. Un dominio della matrice puo' fallire
#   senza cancellare gli altri (fail-fast:false).
#
# BRANCH DATI:
#   - `fm2-ncep`   : frame .om + latest.json del fornitore (`data/fm2/<dominio>/**`).
#   - `fm2-rendered` : WebP pre-renderizzati (`data/fm2-rendered/<regione>/<dominio>/**`).
#     I 5 workflow per-fornitore CONDIVIDONO `fm2-rendered` ma scrivono SOLO le
#     directory dei PROPRI domini: path DISGIUNTI per dominio, quindi nessuna
#     collisione di contenuto. L'unico punto di contatto e' il REF del branch
#     (push rifiutato perche' un altro merge ha avanzato il tip): gestito dal retry
#     5x per-rifetch GIA' presente (il commit riparte dal tip fresco). Le concurrency
#     dei merge sono su gruppi diversi per fornitore, quindi merge di fornitori
#     diversi possono girare in parallelo senza serializzarsi a vicenda.
#
# !!! IL MERGE PER-FORNITORE NON SCRIVE GLI `index.json` - vedi il blocco nel job
#   `render-merge`. Lo scrittore UNICO dell'indice aggregato e'
#   `forecast-maps-index.yml`. Motivo: il client legge UN SOLO index.json per
#   regione (HTML riga 12088) e da li' scopre TUTTI i domini; cinque scrittori
#   concorrenti su quel file = lost-update garantito.
#
# NOTA CLIENT: `data/fm2` e `data/fm2-rendered` NON sono su `main`. Il client legge
#   i branch dati via FM_CACHE_BASE / FM_RENDERED_BASE + la mappa dominio->branch
#   (FM_DOMAIN_BRANCH_MAP): dwd_icon->fm2-dwdicon; dwd_icon_eu/dwd_icon_d2->fm2-dwd;
#   ecmwf_ifs025->fm2-ecmwf; ncep_gfs025/ncep_gfs013->fm2-ncep;
#   meteofrance_arpege_world025->fm2-meteofrance.

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: "Ignora il NO-OP guard e riscrive i frame anche se il manifest e' invariato"
        type: boolean
        default: false
  schedule:
    # TRIGGER NATIVO (cron GitHub, orario UTC) - RETE DI SICUREZZA.
    # Il trigger PRIMARIO sono i 2 job cron-job.org per provider (2 slot
    # per run, vedi scripts/cronjobs/cronjobs_config.json).
    # DUE SLOT PER RUN (regola P2) su cron-job.org, NON qui:
    #   03:55, 09:55, 15:55, 21:55 = parziale (+15' su primo step +3h40)
    #   05:52, 11:52, 17:52, 23:52 = completo (+13' su run completo +5h39)
    # GFS 0.25 + GFS 0.117: run nominali 00/06/12/18Z. Tempi MISURATI il
    # 2026-10-24 su gfs025 (gfs013 trattato uguale: nessuna misura separata).
    # Questo cron e' SOLO la rete di sicurezza: +5h52 (chiusura coda) + 57',
    # sfasato di 57' dagli slot cron-job.org.
    - cron: "49 0,6,12,18 * * *"
  repository_dispatch:
    types: [ci-run]

# CONCURRENCY A LIVELLO WORKFLOW - GRUPPO PROPRIO del fornitore (prefisso
# `forecast-maps-ncep-`): non si mette in coda dietro gli altri 4 per-fornitore
# ne' dietro l'index-builder. I lock PER-JOB (pipeline engine+render per-dominio,
# per-dominio, merge per-fornitore) restano e serializzano il lavoro fine.
# `cancel-in-progress: false`: cancellare a meta' lascerebbe la serie di push
# incrementale parziale (il run successivo la ricompleta, ma nessuna fretta).
concurrency:
  group: forecast-maps-ncep-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  engine:
    # ENGINE: scarica/costruisce i frame .om di NOAA GFS 0.25 + GFS 0.117 e li committa su
    # `fm2-ncep` in `data/fm2/<dominio>/**`.
    runs-on: ubuntu-latest
    # Timeout 360': i domini GLOBALI (~209 frame) a 60' venivano CANCELLATI senza
    # finire. A cache calda (restore-keys fm2-frames-<dominio>-) il run e' molto
    # piu' corto: il valore e' una rete di sicurezza, non il tempo atteso.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        domain:
          - ncep_gfs025
          - ncep_gfs013
    concurrency:
      queue: max
      # Group PER-DOMINIO con prefisso PROPRIO del fornitore.
      group: forecast-maps-ncep-${{ matrix.domain }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/forecast_v2
            data/fm2/${{ matrix.domain }}
          sparse-checkout-cone-mode: true

      - name: Recupera i dati da fm2-ncep
        run: |
          set -e
          git fetch --no-tags --depth=1 origin fm2-ncep || { echo "fm2-ncep non esiste ancora: prima esecuzione"; exit 0; }
          # FIX 21/10/2026 — ripristino REALE dei frame dal branch dati.
          # Con `filter: blob:none` i blob del branch NON sono in locale e il
          # checkout dei frame moriva con "unable to read sha1 file": i dati
          # precedenti non venivano ripristinati (il motore ripartiva da zero e
          # la guardia NO-OP non poteva scattare). Qui si forza il lazy-fetch del
          # promisor per i SOLI blob del dominio, poi il checkout funziona.
          SHAS="$(git ls-tree -r FETCH_HEAD -- "data/fm2/${{ matrix.domain }}" | awk '{print $3}')"
          if [ -n "$SHAS" ]; then
            printf '%s\n' "$SHAS" | git cat-file --batch > /dev/null 2>&1 || true
          fi
          git checkout FETCH_HEAD -- "data/fm2/${{ matrix.domain }}" || echo "nessun dato precedente per data/fm2/${{ matrix.domain }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/forecast_v2/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r scripts/forecast_v2/requirements.txt

      - name: Cache frame Open-Meteo (.om)
        uses: actions/cache@v4
        with:
          path: .cache_fm2_frames
          key: fm2-frames-${{ matrix.domain }}-${{ github.run_number }}
          restore-keys: |
            fm2-frames-${{ matrix.domain }}-

      - name: Engine + render in parallelo (frame-by-frame)
        id: run_engine
        run: |
          set +e
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_update }}" = "true" ]; then
            FORCE="--force"
          fi
          PROGRESS="$RUNNER_TEMP/fm2-progress-${{ matrix.domain }}.json"
          python scripts/forecast_v2/forecast_v2_engine.py \
            --domains ${{ matrix.domain }} \
            --valid-frames 0 \
            --out data/fm2 \
            --frames-cache .cache_fm2_frames \
            --progress-manifest "$PROGRESS" \
            --allow-partial-run \
            --partial-min-frames 3 \
            $FORCE &
          ENGINE_PID=$!
          python scripts/forecast_v2/render_fm_webp.py \
            --in data/fm2 \
            --out data/fm2-rendered \
            --domains ${{ matrix.domain }} \
            --watch-manifest "$PROGRESS" \
            --limit-frames 0 \
            --method 4 &
          RENDER_PID=$!
          if wait "$ENGINE_PID"; then ENGINE_STATUS=0; else ENGINE_STATUS=$?; fi
          if [ "$ENGINE_STATUS" -ne 0 ]; then
            echo "[ERROR] Engine terminato con codice $ENGINE_STATUS; arresto il consumer render."
            kill "$RENDER_PID" 2>/dev/null || true
            wait "$RENDER_PID" 2>/dev/null || true
            exit "$ENGINE_STATUS"
          fi
          if wait "$RENDER_PID"; then RENDER_STATUS=0; else RENDER_STATUS=$?; fi
          if [ "$RENDER_STATUS" -ne 0 ]; then
            echo "[ERROR] Render streaming terminato con codice $RENDER_STATUS."
            exit "$RENDER_STATUS"
          fi
          if python -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get('noop') else 1)" "$PROGRESS" 2>/dev/null; then
            echo "[INFO] Dominio ${{ matrix.domain }} in NO-OP: verifico che i WebP del run siano su fm2-rendered."
            # ------------------------------------------------------------------
            # P6 - SELF-HEALING DEGLI SHARD ORFANI
            #
            # PROBLEMA (misurato, non ipotetico): se `render-merge` fallisce, lo
            # shard WebP resta in un artifact che nessuno riprende. Il run
            # successivo trova il dominio in NO-OP (`changed=false`), quindi non
            # carica alcun artifact, e quei WebP non arrivano MAI al client
            # finche' non cambia `reference_time`. Tre incidenti reali:
            # dwd_icon_d2 fermo a 09Z invece di 15Z, ncep_gfs025 a 00Z invece di
            # 06Z, ncep_gfs013 a 00Z invece di 12Z (dwd run 17: 131,7 min per 0
            # immagini).
            #
            # REGOLA: se per il run corrente i WebP attesi NON sono su
            # `fm2-rendered`, il NO-OP e' falso: si ri-renderizza e si
            # ripubblica. Se ci sono, il NO-OP resta (nessun riprocessamento a
            # ogni run: niente loop).
            #
            # METODO (economico, misurato il 2026-10-25 su fm2-rendered: 118.587
            # path, 1.445 oggetti): `git fetch --depth=1 --filter=blob:none`
            # scarica SOLO gli alberi (pack 2,55 MiB, ~3,6 s) e `git ls-tree -r`
            # (76 ms) elenca i path del run. Nessun blob WebP viene scaricato.
            # Alternativa scartata: HEAD su URL raw del manifest - verifica solo
            # l'esistenza di UNA variabile, non la copertura dei frame.
            #
            # RUN PARZIALE (`--allow-partial-run`): i frame "attesi" sono quelli
            # EFFETTIVAMENTE pubblicati (`latest.json:frames[]`), MAI
            # `valid_times` ne' `partial.n_expected`: un run parziale pubblica
            # meno frame per costruzione e un confronto sull'orizzonte completo
            # riprocesserebbe per sempre.
            # ------------------------------------------------------------------
            HEAL_DIR="$RUNNER_TEMP/fm2-heal-${{ matrix.domain }}"
            rm -rf "$HEAL_DIR"
            mkdir -p "$HEAL_DIR"
            HEAL_FETCH="ok"
            if ! git fetch --no-tags --depth=1 --filter=blob:none origin fm2-rendered 2> "$HEAL_DIR/fetch.log"; then
              if git ls-remote --heads origin fm2-rendered 2>/dev/null | grep -q "refs/heads/fm2-rendered"; then
                HEAL_FETCH="error"
              else
                HEAL_FETCH="missing-branch"
              fi
              sed 's/^/[heal][fetch]   /' "$HEAL_DIR/fetch.log" 2>/dev/null | tail -n 5 || true
            fi
            echo "[heal] fm2-rendered: fetch=$HEAL_FETCH tip=$(git rev-parse --short FETCH_HEAD 2>/dev/null || echo -)"
            HEAL_STATUS=0
            python - "${{ matrix.domain }}" "$HEAL_DIR" "$HEAL_FETCH" <<'PY' || HEAL_STATUS=$?
          import json
          import os
          import subprocess
          import sys

          DOMAIN, HEAL_DIR, FETCH_STATUS = sys.argv[1], sys.argv[2], sys.argv[3]
          sys.path.insert(0, os.path.join("scripts", "forecast_v2"))


          def put(name, value):
              with open(os.path.join(HEAL_DIR, name), "w", encoding="utf-8") as fh:
                  fh.write(str(value) + "\n")


          def finish(code, run_id, kind, detail):
              put("run_id", run_id or "")
              put("kind", kind)
              put("detail", detail)
              label = {0: "OK", 10: "HEAL", 20: "UNVERIFIABLE"}.get(code, "?")
              print("[heal] %s run=%s %s" % (label, run_id or "-", detail))
              raise SystemExit(code)


          if FETCH_STATUS == "error":
              finish(20, "", "unverifiable", "fetch di fm2-rendered fallito (rete/credenziali)")

          try:
              with open(os.path.join("data", "fm2", DOMAIN, "latest.json"), "r",
                        encoding="utf-8-sig") as fh:
                  manifest = json.load(fh)
          except Exception as exc:
              finish(20, "", "unverifiable", "latest.json illeggibile (%s)" % exc)

          try:
              import render_fm_webp as R
          except Exception as exc:
              finish(20, "", "unverifiable", "import di render_fm_webp fallito (%s)" % exc)

          run_id = R._run_id(manifest.get("reference_time"))
          frames = [f for f in (manifest.get("frames") or []) if f.get("valid_time")]
          partial_info = manifest.get("partial") or {}
          if not frames:
              finish(20, run_id, "unverifiable", "manifest senza frame pubblicati")
          bbox, grid = manifest.get("bbox"), manifest.get("grid")
          if not isinstance(bbox, dict) or not isinstance(grid, dict):
              finish(20, run_id, "unverifiable", "manifest senza bbox/grid")

          is_global = R._is_global_bbox(bbox)
          regions = {}
          for name, region_bbox in R.REGIONS.items():
              if name == R.DOMAIN_REGION and R.DOMAIN_REGION_SKIP_GLOBAL and is_global:
                  continue
              if name == R.NORTH_REGION and R.NORTH_REGION_SKIP_NON_GLOBAL and not is_global:
                  continue
              resolved = R.resolve_region_bbox(region_bbox, bbox)
              if R.region_crop(bbox, grid, resolved) is None:
                  continue
              regions[name] = resolved
          if not regions:
              finish(20, run_id, "unverifiable", "nessuna regione interseca il dominio")

          print("[heal] run=%s frame_pubblicati=%d regioni_attese=%s partial=%s"
                % (run_id, len(frames), ",".join(sorted(regions)),
                   "on(%d/%s)" % (len(frames), partial_info.get("n_expected"))
                   if partial_info.get("enabled") else "off"))

          if FETCH_STATUS == "missing-branch":
              finish(10, run_id, "absent", "branch fm2-rendered assente: nessun WebP pubblicato")

          # NB: `git ls-tree` NON espande il glob in MEZZO al pathspec (verificato:
          # "data/fm2-rendered/*/<dominio>/runs/<run_id>" restituisce 0 righe,
          # mentre il path esplicito ne restituisce 1). Si passano quindi le
          # regioni ATTESE come pathspec distinti, tutti in UNA sola invocazione.
          specs = ["data/fm2-rendered/%s/%s/runs/%s" % (name, DOMAIN, run_id)
                   for name in sorted(regions)]
          try:
              proc = subprocess.run(["git", "ls-tree", "-r", "--name-only",
                                     "FETCH_HEAD", "--"] + specs,
                                    stdout=subprocess.PIPE,
                                    stderr=subprocess.PIPE, text=True)
          except OSError as exc:
              finish(20, run_id, "unverifiable", "git non eseguibile (%s)" % exc)
          if proc.returncode != 0:
              finish(20, run_id, "unverifiable",
                     "git ls-tree fallito (%s)" % proc.stderr.strip()[:200])

          published = {}
          for path in proc.stdout.splitlines():
              parts = path.split("/")
              if len(parts) != 8 or parts[4] != "runs" or parts[5] != run_id:
                  continue
              if not parts[7].endswith(".webp"):
                  continue
              published.setdefault(parts[2], set()).add(parts[7][:-5])

          expected = {R.valid_time_to_filename(f["valid_time"]) for f in frames}
          absent = [r for r in sorted(regions) if not published.get(r)]
          incomplete = {}
          for name in sorted(regions):
              if name in absent:
                  continue
              missing = expected - published[name]
              if missing:
                  incomplete[name] = missing

          for name in sorted(regions):
              have = len(published.get(name, ()))
              print("[heal]   regione=%-7s frame_visti=%d attesi=%d %s"
                    % (name, have, len(expected),
                       "ASSENTE" if name in absent else
                       ("INCOMPLETO (-%d frame)" % len(incomplete[name])
                        if name in incomplete else "ok")))

          if absent or incomplete:
              detail = []
              if absent:
                  detail.append("regioni senza WebP: %s" % ",".join(absent))
              for name in sorted(incomplete):
                  detail.append("frame mancanti in %s: %d/%d (es. %s)"
                                % (name, len(incomplete[name]), len(expected),
                                   min(incomplete[name])))
              finish(10, run_id, "incomplete" if not absent else "absent", "; ".join(detail))

          finish(0, run_id, "ok", "tutte le %d regioni attese hanno i %d frame pubblicati"
                 % (len(regions), len(expected)))
          PY
            HEAL_RUN_ID="$(cat "$HEAL_DIR/run_id" 2>/dev/null || true)"
            HEAL_KIND="$(cat "$HEAL_DIR/kind" 2>/dev/null || echo unknown)"
            if [ "$HEAL_STATUS" -eq 10 ]; then
              case "$HEAL_KIND" in
                absent)  echo "::notice::[HEAL] WebP del run $HEAL_RUN_ID assenti su fm2-rendered: riprocesso invece del NO-OP." ;;
                *)       echo "::notice::[HEAL] WebP del run $HEAL_RUN_ID incompleti su fm2-rendered: riprocesso invece del NO-OP." ;;
              esac
              # Ri-render dallo shard .om GIA' presente (restaurato da fm2-dwd):
              # senza `--watch-manifest`, che in NO-OP esce subito senza scrivere
              # nulla e lascerebbe l'artifact vuoto.
              python scripts/forecast_v2/render_fm_webp.py \
                --in data/fm2 \
                --out data/fm2-rendered \
                --domains ${{ matrix.domain }} \
                --limit-frames 0 \
                --method 4
              HEAL_RENDER_STATUS=$?
              if [ "$HEAL_RENDER_STATUS" -ne 0 ]; then
                echo "::error::[HEAL] Render di recupero fallito (codice $HEAL_RENDER_STATUS): lo shard del run $HEAL_RUN_ID resta non pubblicato."
                exit "$HEAL_RENDER_STATUS"
              fi
              HEAL_WEBP="$(find data/fm2-rendered -path "*/${{ matrix.domain }}/runs/$HEAL_RUN_ID/*" -name '*.webp' 2>/dev/null | wc -l)"
              echo "[heal] WebP rigenerati per il run $HEAL_RUN_ID: $HEAL_WEBP file."
              if [ "$HEAL_WEBP" -eq 0 ]; then
                echo "::error::[HEAL] Nessun WebP rigenerato per il run $HEAL_RUN_ID: shard non pubblicabile."
                exit 1
              fi
              echo "changed=true" >> "$GITHUB_OUTPUT"
            elif [ "$HEAL_STATUS" -eq 0 ]; then
              echo "[INFO] WebP del run $HEAL_RUN_ID gia' su fm2-rendered: NO-OP confermato."
            else
              echo "::warning::[HEAL] Stato dei WebP del run non verificabile (fetch=$HEAL_FETCH): NO-OP mantenuto, nessun riprocessamento."
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Summary
        if: always()
        run: |
          {
            echo "## MeteoRisk - Forecast Maps V2 (ncep / engine)"
            echo ""
            echo "Dominio: \`${{ matrix.domain }}\`"
            echo ""
            if [ -f data/fm2/${{ matrix.domain }}/latest.json ]; then
              python -c "import json; d=json.load(open('data/fm2/${{ matrix.domain }}/latest.json')); f=d.get('frames',[]); print('reference_time:', d.get('reference_time')); print('frame:', len(f), '- valid_times:', len(d.get('valid_times', []))); print('byte totali:', sum(x.get('bytes',0) for x in f)); print('dominio:', d.get('domain')); print('warning:', len(d.get('warnings', []))); print('pruned:', d.get('pruned'))"
            else
              echo "latest.json non disponibile per il dominio '${{ matrix.domain }}' (run fallita prima del motore?)."
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload render shard fm2r-${{ matrix.domain }}
        if: success() && steps.run_engine.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fm2r-${{ matrix.domain }}
          path: |
            data/fm2-rendered/italia/${{ matrix.domain }}
            data/fm2-rendered/europa/${{ matrix.domain }}
            data/fm2-rendered/north/${{ matrix.domain }}
            data/fm2-rendered/domain/${{ matrix.domain }}
          if-no-files-found: warn
          retention-days: 1
      - name: Commit cache aggiornata su fm2-ncep (only if changed)
        if: success()
        run: |
          git config user.name "meteorisk-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ ! -d "data/fm2/${{ matrix.domain }}" ]; then
            echo "[INFO] Nessun output per il dominio '${{ matrix.domain }}': niente da committare."
            exit 0
          fi
          MSG="chore(fm2): aggiornamento cache dominio ${{ matrix.domain }} (.om per-domain crop)"
          for i in 1 2 3 4 5; do
            git fetch --no-tags --depth=1 origin fm2-ncep || true
            if git rev-parse --verify --quiet FETCH_HEAD >/dev/null 2>&1; then
              BASE="$(git rev-parse FETCH_HEAD^{tree})"
              PARENT="$(git rev-parse FETCH_HEAD)"
            else
              echo "[INFO] fm2-ncep non esiste ancora: questo e' il primo commit del branch."
              BASE="$(git hash-object -t tree /dev/null)"
              PARENT=""
            fi
            IDX="$(mktemp -u)"
            rm -f "$IDX"
            # (1) base = tree del branch dati (NON l'indice di `main`)
            GIT_INDEX_FILE="$IDX" git read-tree "$BASE"
            # (2) METODO MINIMALE (verificato su git reale): NON si usa l'allowlist
            #     per complemento `:(exclude)data/fm2/**`, che butterebbe via
            #     dall'indice i path che il working tree non ha ripristinato e li
            #     registrerebbe come CANCELLAZIONI. Si rimuove dall'indice SOLO il
            #     path del dominio corrente, che il working tree e' autorevole a
            #     ri-aggiungere.
            if [ -d data/fm2 ]; then
              GIT_INDEX_FILE="$IDX" git ls-files -- "data/fm2/${{ matrix.domain }}" \
                | while IFS= read -r p; do
                    GIT_INDEX_FILE="$IDX" git update-index --force-remove -- "$p"
                  done
            fi
            # (3) aggiorna SOLO il dominio corrente dal working tree
            GIT_INDEX_FILE="$IDX" git add -A -- "data/fm2/${{ matrix.domain }}"
            TREE="$(GIT_INDEX_FILE="$IDX" git write-tree)"
            rm -f "$IDX"
            # (3-bis) GUARDIA DI SCOPE: il commit engine deve toccare SOLO
            #     data/fm2/${{ matrix.domain }}/**. Un path fuori allowlist => ABORTISCI.
            git diff-tree -r --no-commit-id --name-only "$BASE" "$TREE" > /tmp/fm2_eng_scope.txt
            BAD_SCOPE="$(grep -E -v '^data/fm2/${{ matrix.domain }}/' /tmp/fm2_eng_scope.txt || true)"
            if [ -n "$BAD_SCOPE" ]; then
              echo "::error::GUARDIA DI SCOPE VIOLATA (engine ncep): path fuori allowlist:"
              printf '%s\n' "$BAD_SCOPE"
              exit 1
            fi
            # NO-OP: albero identico al tip => nessun churn.
            if [ "$TREE" = "$BASE" ]; then
              echo "[INFO] Nessuna modifica a data/fm2/${{ matrix.domain }} (NO-OP)."
              exit 0
            fi
            # COMMIT ORPHAN (nessun parent) + LEASE: la storia del branch dati
            # resta profonda UN commit, e il push riesce SOLO se il tip remoto e'
            # ancora $PARENT. Se il branch non esiste ($PARENT vuoto) il lease
            # pretende che il ref NON esista (forma "refs/heads/<branch>:" senza
            # valore). Mai `--force` nudo: una sovrascrittura concorrente DEVE
            # fallire invece di cancellare in silenzio.
            NEW="$(git commit-tree "$TREE" -m "$MSG")"
            if git push --force-with-lease="refs/heads/fm2-ncep:$PARENT" origin "$NEW:refs/heads/fm2-ncep"; then
              echo "[INFO] Push su fm2-ncep riuscito (tentativo $i/5)."
              exit 0
            fi
            echo "[WARN] Push su fm2-ncep rifiutato (race sul branch) - tentativo $i/5"
            sleep $((i*3))
          done
          echo "[ERROR] Push su fm2-ncep non riuscito dopo 5 tentativi."
          exit 1

  render-merge:
    # MERGE PER-FORNITORE: pubblica i WebP di NOAA GFS 0.25 + GFS 0.117 su `fm2-rendered` nelle
    # directory `data/fm2-rendered/<regione>/<dominio>/**` (path DISGIUNTI dagli
    # altri fornitori). NON scrive MAI gli `index.json`.
    #
    # !!! PERCHE' NON SCRIVE GLI index.json (LOST-UPDATE): il client legge UN SOLO
    #   `data/fm2-rendered/<regione>/index.json` per regione (HTML riga 12088) e da
    #   quell'indice scopre TUTTI i domini. Se questo job eseguisse
    #   `--index-only --domains ncep_gfs025,ncep_gfs013`, l'indice aggregato verrebbe riscritto con i
    #   SOLI domini del fornitore e gli altri SPARIREBBERO dal client. Cinque
    #   workflow = cinque scrittori concorrenti sullo stesso file = lost-update.
    #   SOLUZIONE: l'indice aggregato resta di proprieta' del solo
    #   `forecast-maps-index.yml` (scrittore unico). Questo job pubblica SOLO i
    #   WebP di NOAA GFS 0.25 + GFS 0.117: l'inclusione nell'indice avviene automaticamente al
    #   successivo `--index-only` dell'index-builder, che legge dal FILESYSTEM
    #   LOCALE dopo aver materializzato i WebP da `fm2-rendered`.
    name: render-merge ncep (webp su fm2-rendered, nessun index)
    needs: engine
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      queue: max
      # 1.2.4.15 - SERIALIZZAZIONE DEI MERGE SU `fm2-rendered`.
      # Causa provata (run ncep 39881544372): i 5 workflow per-fornitore
      # spingevano sullo STESSO branch `fm2-rendered` senza un lock condiviso
      # -> `! [rejected] ... (fetch first)` e WebP del run orfani
      # nell'artifact. Il gruppo e' UNICO per tutti e cinque (i nomi di
      # group sono globali al repo, non al workflow): i merge si mettono in
      # fila uno alla volta invece di collidere sul push.
      group: fm2-rendered-writer
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
          filter: blob:none
          sparse-checkout: |
            scripts/forecast_v2
            data/fm2-rendered
          sparse-checkout-cone-mode: true

      - name: Recupera lo stato di fm2-rendered (SENZA materializzare i WebP)
        run: |
          set -e
          git fetch --no-tags --depth=1 origin fm2-rendered || { echo "fm2-rendered non esiste ancora: prima esecuzione"; exit 0; }
          git sparse-checkout disable >/dev/null 2>&1 || true
          # 1.2.4.13: il checkout integrale di `data/fm2-rendered` scaricava
          # TUTTI i blob WebP del branch (240+ MiB e crescenti: 4.700+ oggetti)
          # e il job render-merge ci metteva 10-20 minuti PRIMA di iniziare a
          # lavorare. Ma il commit-step usa gia' un indice TEMPORANEO popolato
          # da `git read-tree "$BASE"` (il tree DEL BRANCH): i WebP degli altri
          # fornitori non servono nel working tree, non vengono mai staged e
          # non possono essere rimossi come cancellazioni.
          # Il working tree deve contenere SOLO lo shard autorevole del
          # provider (rm -rf + cp -a piu' avanti).
          # La sicurezza e' stata PROVATA con git reale: senza il checkout il
          # tree finale contiene i WebP nuovi del provider, rimuove i vecchi /
          # il subtree dark / le variabili droppate, lascia INTATTI i WebP degli
          # altri domini e gli index.json aggregati, e la guardia di scope
          # (ALLOW_RE) non rileva alcuna violazione.
          if git rev-parse --verify --quiet FETCH_HEAD >/dev/null 2>&1; then
            echo "[fetch] fm2-rendered: tip=$(git rev-parse --short FETCH_HEAD) (alberi solo, blob NON scaricati)"
            git ls-tree --name-only FETCH_HEAD -- "data/fm2-rendered" 2>/dev/null | head -n 5 | sed 's/^/[fetch]   /' || true
            echo "[fetch] nessun checkout: il working tree conterra' SOLO lo shard del provider."
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/forecast_v2/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r scripts/forecast_v2/requirements.txt

      - name: Download render shard artifact (fm2r-*)
        uses: actions/download-artifact@v4
        with:
          pattern: 'fm2r-*'
          path: /tmp/fm2r

      - name: Assemble shard NOAA GFS 0.25 + GFS 0.117 (sostituisci le directory dominio)
        id: shards
        run: |
          # Sostituisci data/fm2-rendered/<regione>/<dominio> con la versione
          # autorevole dello shard (rm PRIMA: le variabili droppate vanno pulite).
          # !!! SOLO i domini ncep_gfs025,ncep_gfs013: nessun'altra directory dominio viene toccata,
          # e NESSUN index.json viene scritto ne' rimosso (sono fuori dalle path
          # <regione>/<dominio> e restano di proprieta' dell'index-builder).
          got=0
          for region in italia europa north domain; do
            src=""
            # download-artifact con pattern fm2r-* estrae in /tmp/fm2r/<artifact-name>/:
            # prova i layout noti e, in fallback, cerca il dominio sotto /tmp/fm2r.
            for cand in "/tmp/fm2r/$region/ncep_gfs025" \
                        "/tmp/fm2r/fm2r-ncep_gfs025/$region/ncep_gfs025" \
                        "/tmp/fm2r/fm2r-ncep_gfs025-$region/ncep_gfs025" \
                        "/tmp/fm2r/ncep_gfs025/$region/ncep_gfs025"; do
              [ -d "$cand" ] && { src="$cand"; break; }
            done
            if [ -z "$src" ]; then
              found=$(find /tmp/fm2r -type d -name "ncep_gfs025" 2>/dev/null | grep "/$region/ncep_gfs025$" | head -n1 || true)
              [ -n "$found" ] && src="$found"
            fi
            if [ -n "$src" ] && [ -d "$src" ]; then
              rm -rf "data/fm2-rendered/$region/ncep_gfs025"
              mkdir -p "data/fm2-rendered/$region"
              cp -a "$src" "data/fm2-rendered/$region/ncep_gfs025"
              got=1
            fi
            src=""
            # download-artifact con pattern fm2r-* estrae in /tmp/fm2r/<artifact-name>/:
            # prova i layout noti e, in fallback, cerca il dominio sotto /tmp/fm2r.
            for cand in "/tmp/fm2r/$region/ncep_gfs013" \
                        "/tmp/fm2r/fm2r-ncep_gfs013/$region/ncep_gfs013" \
                        "/tmp/fm2r/fm2r-ncep_gfs013-$region/ncep_gfs013" \
                        "/tmp/fm2r/ncep_gfs013/$region/ncep_gfs013"; do
              [ -d "$cand" ] && { src="$cand"; break; }
            done
            if [ -z "$src" ]; then
              found=$(find /tmp/fm2r -type d -name "ncep_gfs013" 2>/dev/null | grep "/$region/ncep_gfs013$" | head -n1 || true)
              [ -n "$found" ] && src="$found"
            fi
            if [ -n "$src" ] && [ -d "$src" ]; then
              rm -rf "data/fm2-rendered/$region/ncep_gfs013"
              mkdir -p "data/fm2-rendered/$region"
              cp -a "$src" "data/fm2-rendered/$region/ncep_gfs013"
              got=1
            fi
          done
          if [ "$got" -eq 1 ]; then
            echo "domains=ncep_gfs025,ncep_gfs013" >> "$GITHUB_OUTPUT"
            echo "[shard] domini renderizzati: ncep_gfs025,ncep_gfs013"
          else
            echo "[WARN] shard ncep: nessuna regione presente, merge escluso"
            echo "domains=" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## MeteoRisk - Forecast Maps V2 (ncep / render-merge)"
            echo ""
            echo "Domini pubblicati: \`ncep_gfs025,ncep_gfs013\` (solo WebP; index aggregato NON toccato)"
            echo ""
            echo "WebP ncep in cache: $(find data/fm2-rendered -path '*ncep_gfs0**' -name '*.webp' 2>/dev/null | wc -l)"
            echo ""
            echo "NOTA: \`data/fm2-rendered/<regione>/index.json\` resta scritto dal solo"
            echo "index-builder (\`forecast-maps-index.yml\`): nessun lost-update fra scrittori."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit WebP ncep su fm2-rendered (push incrementale, only if changed)
        id: commit_webp
        if: success() && steps.shards.outputs.domains != ''
        run: |
          git config user.name "meteorisk-bot"
          git config user.email "actions@users.noreply.github.com"
          git sparse-checkout disable >/dev/null 2>&1 || true
          if [ ! -d "data/fm2-rendered" ]; then
            echo "[INFO] Nessun output renderizzato: niente da committare."
            exit 0
          fi
          # PUSH INCREMENTALE A SOGLIA (replicato dal monolite): i WebP del
          # fornitore possono superare da soli il limite di pack di GitHub
          # (2,00 GiB), quindi si partizionano i path CAMBIATI con i byte reali
          # sotto THRESHOLD=1,4 GiB. Ogni gruppo e' un push separato.
          MSG="chore(fm2): aggiornamento WebP ncep (regioni italia/europa/north/domain, light+dark)"
          THRESHOLD=$((1400 * 1024 * 1024))
          GQ="-c core.quotePath=false"
          # ALLOWLIST di scope del merge: SOLO i path WebP dei PROPRI domini.
          ALLOW_RE='^data/fm2-rendered/[^/]+/(ncep_gfs025|ncep_gfs013)/'
          # fix P5: questo ciclo RITENTA DAVVERO. Prima ogni percorso di errore
          # faceva `exit 1` al primo colpo (il ciclo non arrivava mai a i=2); ora
          # solo i rifiuti di push (concorrenza sul branch) tornano al `git fetch`,
          # mentre guardia di scope e tree inconsistente escono 1 subito.
          for i in 1 2 3 4 5; do
            PUSH_FAILED=0
            PUSH_FAILED_GROUP=""
            git fetch --no-tags --depth=1 origin fm2-rendered || true
            if git rev-parse --verify --quiet FETCH_HEAD >/dev/null 2>&1; then
              BASE="$(git rev-parse FETCH_HEAD^{tree})"
              PARENT="$(git rev-parse FETCH_HEAD)"
            else
              echo "[INFO] fm2-rendered non esiste ancora: questo e' il primo commit del branch."
              BASE="$(git hash-object -t tree /dev/null)"
              PARENT=""
            fi
            # ---- (1) costruisci il TREE TARGET su un indice isolato ----
            # !!! METODO MINIMALE (verificato su git reale): si rimuovono dall'indice
            # SOLO i path delle directory <regione>/<dominio> che il working tree
            # FORNISCE DAVVERO (autorevoli), poi le si ri-aggiunge con `git add -A`.
            # NON si usa il complemento `:(exclude)` (distruggerebbe gli altri
            # domini, gli index.json aggregati e il codice) e NON si rimuove in blocco
            # un'intera <regione>/<dominio> che il working tree non ha: quella resta
            # INTATTA (evita di registrare come cancellazione un WebP legittimo che
            # questo run non ha riprodotto, es. regione saltata).
            IDXT="$(mktemp -u)"; rm -f "$IDXT"
            GIT_INDEX_FILE="$IDXT" git read-tree "$BASE"
            for region in italia europa north domain; do
              d="data/fm2-rendered/$region/ncep_gfs025"
              if [ -d "$d/runs" ]; then
                for rd in "$d"/runs/*; do
                  [ -d "$rd" ] || continue
                  GIT_INDEX_FILE="$IDXT" git add -A -- "$rd"
                done
                GIT_INDEX_FILE="$IDXT" python scripts/forecast_v2/prune_fm2_run_index.py --index "$IDXT" --path "$d" --keep 3
              fi
              d="data/fm2-rendered/$region/ncep_gfs013"
              if [ -d "$d/runs" ]; then
                for rd in "$d"/runs/*; do
                  [ -d "$rd" ] || continue
                  GIT_INDEX_FILE="$IDXT" git add -A -- "$rd"
                done
                GIT_INDEX_FILE="$IDXT" python scripts/forecast_v2/prune_fm2_run_index.py --index "$IDXT" --path "$d" --keep 3
              fi
            done
            TREE="$(GIT_INDEX_FILE="$IDXT" git write-tree)"
            rm -f "$IDXT"
            # NO-OP: albero identico al tip => nessun churn.
            if [ "$TREE" = "$BASE" ]; then
              echo "[INFO] Nessuna modifica ai WebP ncep (NO-OP)."
              exit 0
            fi
            # ---- (1-bis) GUARDIA DI SCOPE (fail-fast, PRIMA di ogni push) ----
            # Il commit del merge deve toccare ESCLUSIVAMENTE i WebP dei propri
            # domini. Un solo path fuori allowlist => ABORTISCI (meglio un job rosso
            # che un branch distrutto).
            git diff-tree -r --no-commit-id --name-only "$BASE" "$TREE" > /tmp/fm2_scope.txt
            BAD_SCOPE="$(grep -E -v "$ALLOW_RE" /tmp/fm2_scope.txt || true)"
            if [ -n "$BAD_SCOPE" ]; then
              echo "::error::GUARDIA DI SCOPE VIOLATA (merge ncep): path fuori allowlist:"
              printf '%s\n' "$BAD_SCOPE"
              exit 1
            fi
            echo "[guardia] scope OK: $(wc -l < /tmp/fm2_scope.txt) path toccati (solo WebP ncep_gfs025,ncep_gfs013)"
            # ---- (2) lista dei path CAMBIATI con dimensione (per la soglia) ----
            git $GQ diff-tree -r --no-commit-id --name-status "$BASE" "$TREE" > /tmp/fm2_changed.txt
            : > /tmp/fm2_sizes.txt
            : > /tmp/fm2_dels.txt
            while IFS="$(printf '\t')" read -r st path; do
              [ -z "$path" ] && continue
              case "$st" in
                D) printf '%s\n' "$path" >> /tmp/fm2_dels.txt ;;
                *)
                  if [ -f "$path" ]; then
                    sz="$(stat -c %s -- "$path" 2>/dev/null || echo 0)"
                  else
                    sz=0
                  fi
                  printf '%s\t%s\n' "$sz" "$path" >> /tmp/fm2_sizes.txt
                  ;;
              esac
            done < /tmp/fm2_changed.txt
            # ---- (3) partizione a soglia (first-fit-decreasing) ----
            sort -t"$(printf '\t')" -k1,1nr /tmp/fm2_sizes.txt > /tmp/fm2_sizes_sorted.txt
            rm -rf /tmp/fm2_groups; mkdir -p /tmp/fm2_groups
            gidx=1; gbytes=0
            : > "/tmp/fm2_groups/g_${gidx}.txt"
            while IFS="$(printf '\t')" read -r sz path; do
              [ -z "$path" ] && continue
              if [ "$gbytes" -gt 0 ] && [ $((gbytes + sz)) -gt "$THRESHOLD" ]; then
                gidx=$((gidx + 1)); gbytes=0
                : > "/tmp/fm2_groups/g_${gidx}.txt"
              fi
              printf '%s\n' "$path" >> "/tmp/fm2_groups/g_${gidx}.txt"
              gbytes=$((gbytes + sz))
              if [ "$sz" -gt "$THRESHOLD" ]; then
                echo "[WARN] path singolo oltre soglia (resta da solo nel suo gruppo): $path ($sz B)"
              fi
            done < /tmp/fm2_sizes_sorted.txt
            if [ -s /tmp/fm2_dels.txt ]; then
              cat /tmp/fm2_dels.txt >> "/tmp/fm2_groups/g_${gidx}.txt"
            fi
            NGROUPS="$gidx"
            echo "[push] path cambiati: $(wc -l < /tmp/fm2_sizes.txt) A/M + $(wc -l < /tmp/fm2_dels.txt) D = $NGROUPS gruppi (soglia $THRESHOLD B)"
            # ---- (4) indice evolutivo: parte da BASE INTEGRO ----
            # NON si applica il complemento. L'indice evolutivo parte dall'INTERO
            # albero del tip e ogni gruppo vi applica `git add -A --pathspec-from-file`
            # con path ESCLUSIVAMENTE dei propri domini (derivano dal diff
            # BASE->TARGET): dopo l'ultimo gruppo il tree coincide con TARGET.
            IDX="$(mktemp -u)"; rm -f "$IDX"
            GIT_INDEX_FILE="$IDX" git read-tree "$BASE"
            # ---- (5) push gruppo per gruppo (N push, ognuno < THRESHOLD) ----
            RUN_PARENT="$PARENT"
            pushed_groups=0
            gi=1
            while [ "$gi" -le "$NGROUPS" ]; do
              GFILE="/tmp/fm2_groups/g_${gi}.txt"
              if [ ! -s "$GFILE" ]; then gi=$((gi + 1)); continue; fi
              GIT_INDEX_FILE="$IDX" git add -A --pathspec-from-file="$GFILE"
              GTREE="$(GIT_INDEX_FILE="$IDX" git write-tree)"
              echo "[push] gruppo $gi/$NGROUPS: $(wc -l < "$GFILE") path -> tree $GTREE"
              # COMMIT ORPHAN + LEASE (stessa regola dell'engine): storia = 1
              # commit; il lease pretende che il tip remoto sia ancora
              # RUN_PARENT (vuoto alla prima pubblicazione: ref inesistente).
              GNEW="$(git commit-tree "$GTREE" -m "$MSG [$gi/$NGROUPS]")"
              if git push --force-with-lease="refs/heads/fm2-rendered:$RUN_PARENT" origin "$GNEW:refs/heads/fm2-rendered"; then
                echo "[push] gruppo $gi/$NGROUPS pubblicato: $GNEW"
                RUN_PARENT="$GNEW"
                pushed_groups=$((pushed_groups + 1))
              else
                # RIFIUTO = CONCORRENZA, non errore fatale: si esce dal ciclo dei
                # GRUPPI, non da quello dei TENTATIVI. Il push fallito non ha
                # avanzato il branch (lease scaduto), quindi il tip remoto e'
                # cambiato sotto di noi: serve un fetch nuovo prima di riprovare.
                PUSH_FAILED=1
                PUSH_FAILED_GROUP="$gi"
                echo "[WARN] Push del gruppo $gi/$NGROUPS RIFIUTATO (tentativo $i/5):"
                echo "       scrittura concorrente su fm2-rendered (lease scaduto)."
                echo "       Serie parziale: i gruppi 1..$((gi-1)) sono pubblicati, dal"
                echo "       gruppo $gi in poi NO. Si ritenta dal fetch del tip fresco."
                rm -f "$IDX"
                break
              fi
              gi=$((gi + 1))
            done
            rm -f "$IDX"
            # ---- (5-bis) RITENTATIVO REALE (fix P5) ----
            # Il push di un gruppo e' stato rifiutato: si torna in cima al ciclo dei
            # tentativi. Li' si rifa' `git fetch`, si ricalcolano BASE/PARENT dal tip
            # NUOVO, si ricostruisce TREE e si ripartizionano i gruppi sul diff col
            # tip nuovo: i gruppi gia' pubblicati non compaiono piu' nel diff (il loro
            # contenuto e' nel tip), quindi si ripubblica dalla parte mancante in poi.
            # `sleep` crescente per lasciar sfogare la contesa.
            if [ "$PUSH_FAILED" -ne 0 ]; then
              echo "[WARN] Serie parziale al tentativo $i/5 (rifiuto al gruppo $PUSH_FAILED_GROUP/$NGROUPS)."
              echo "       Rifetch del tip, BASE/PARENT ricalcolati, gruppi ripartizionati."
              sleep $((i * 5))
              continue
            fi
            # ---- (6) VERIFICA: i gruppi DEVONO ricostruire esattamente TARGET ----
            if [ "$GTREE" != "$TREE" ]; then
              echo "[ERROR] Incoerenza: il tree finale dei gruppi ($GTREE) != TARGET ($TREE)."
              echo "        Nessun ulteriore push; il branch ha l'ultimo gruppo pubblicato."
              exit 1
            fi
            echo "[INFO] Push incrementale completato: $pushed_groups/$NGROUPS gruppi, tree finale == TARGET ($TREE), tentativo $i/5."
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "[ERROR] Push su fm2-rendered non riuscito dopo 5 tentativi (ultimo rifiuto al gruppo ${PUSH_FAILED_GROUP:-?}/${NGROUPS:-?})."
          exit 1

      - name: Aggiorna subito l'indice aggregato
        if: success() && steps.commit_webp.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
            -d '{"event_type":"forecast-maps-published"}'
