name: Forecast Maps V2 - DWD ICON Global (mappe .om + WebP, branch fm2-dwdicon)

# MeteoRisk forecast-maps-dwdicon - WORKFLOW PER-FORNITORE per DWD ICON Global.
#
# PERCHE' ESISTE (split del monolite `forecast-maps-v2.yml` in 5 workflow
# indipendenti, uno per fornitore, con 6 branch dati):
#   Nel workflow monolitico un dominio lento o fallito BLOCCAVA tutti gli altri:
#   `render-merge` aspettava l'engine di TUTTI i domini (pattern artifact `fm2-*`),
#   poi era l'UNICO scrittore di WebP+indice, quindi una run durava fino a ~3h55 e
#   il fallimento di un singolo dominio rendeva inutile il lavoro degli altri.
#   Lo split assegna a ogni FORNITORE il proprio workflow e i propri branch dati:
#   un fornitore lento o KO non tocca gli altri. Ognuno pubblica i frame .om sul
#   PROPRIO branch `fm2-dwdicon` e i WebP su `fm2-rendered` (path disgiunti).
#
# MATRICE DOMINI (1 dominio/i in QUESTO workflow):
#     - dwd_icon
#   `--domains dwd_icon`, engine e render streaming nello stesso job. Un dominio della matrice puo' fallire
#   senza cancellare gli altri (fail-fast:false).
#
# BRANCH DATI:
#   - `fm2-dwdicon`   : frame .om + latest.json del fornitore (`data/fm2/<dominio>/**`).
#   - `fm2-rendered` : WebP pre-renderizzati (`data/fm2-rendered/<regione>/<dominio>/**`).
#     I 5 workflow per-fornitore CONDIVIDONO `fm2-rendered` ma scrivono SOLO le
#     directory dei PROPRI domini: path DISGIUNTI per dominio, quindi nessuna
#     collisione di contenuto. L'unico punto di contatto e' il REF del branch
#     (push rifiutato perche' un altro merge ha avanzato il tip): gestito dal retry
#     8x per-rifetch CON JITTER nel passo `Commit WebP` (il commit riparte dal tip
#     fresco e ripubblica solo i gruppi mancanti). Dalla 1.2.4.23 NON esiste piu'
#     un lock globale sui merge: i 5 merge girano davvero in parallelo e la
#     contesa sul ref e' assorbita da lease + retry (prima erano tutti sullo
#     stesso gruppo `fm2-rendered-writer`, che saturava all'83%).
#
# !!! IL MERGE PER-FORNITORE NON SCRIVE GLI `index.json` - vedi il blocco nel job
#   `render-merge`. Lo scrittore UNICO dell'indice aggregato e'
#   `forecast-maps-index.yml`. Motivo: il client legge UN SOLO index.json per
#   regione (HTML riga 12088) e da li' scopre TUTTI i domini; cinque scrittori
#   concorrenti su quel file = lost-update garantito.
#
# NOTA CLIENT: `data/fm2` e `data/fm2-rendered` NON sono su `main`. Il client legge
#   i branch dati via FM_CACHE_BASE / FM_RENDERED_BASE + la mappa dominio->branch
#   (FM_DOMAIN_BRANCH_MAP): dwd_icon->fm2-dwdicon; dwd_icon_eu/dwd_icon_d2->fm2-dwd;
#   ecmwf_ifs025->fm2-ecmwf; ncep_gfs025/ncep_gfs013->fm2-ncep;
#   meteofrance_arpege_world025->fm2-meteofrance.

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: "Ignora il NO-OP guard e riscrive i frame anche se il manifest e' invariato"
        type: boolean
        default: false
  # 1.2.4.23 - `schedule:` NATIVO RIMOSSO (2026-10-25). Il trigger di questo
  # fornitore e' SOLO cron-job.org, con gli orari MISURATI in
  # `scripts/cronjobs/cronjobs_config.json` (2 slot per run: parziale + completo).
  #
  # PERCHE' (misura, non opinione): un run `dwdicon` con event `schedule` e'
  # partito alle 00:29:59Z, cioe' 151 minuti PRIMA dello slot configurato
  # (03:01), e ha occupato il gruppo `fm2-dwdicon` per 115+ minuti facendo
  # accodare gli slot veri delle 03:01 e 03:41. Il cron nativo di GitHub e'
  # documentato come in ritardo imprevedibile: quando parte in ANTICIPO rispetto
  # agli orari misurati produce un run fuori orario che blocca quelli buoni.
  # La misura e' su `dwdicon`, ma il meccanismo (scheduler nativo di GitHub,
  # orari non garantiti) e' identico per tutti e 5 i provider: qui il cron e'
  # rimosso per la stessa ragione.
  #
  # La "rete di sicurezza" che questo cron rappresentava e' stata SPOSTATA
  # sull'index-builder: `forecast-maps-index.yml` CONSERVA il proprio
  # `schedule:` ed e' lui il recupero periodico dell'indice aggregato. Qui la
  # rete non serviva: un colpo a vuoto costava comunque un run intero.
  #
  # REVERSIBILE in una riga: rimettere
  #   schedule:
  #     - cron: "38 4,10,16,22 * * *"
  # (la storia git di questo file ha il blocco commentato per esteso).
  repository_dispatch:
    types: [ci-run]

# CONCURRENCY A LIVELLO WORKFLOW - GRUPPO PROPRIO del fornitore (prefisso
# `forecast-maps-dwdicon-`): non si mette in coda dietro gli altri 4 per-fornitore
# ne' dietro l'index-builder. Restano i lock PER-JOB del solo `engine` (per
# dominio); il `render-merge` NON ha piu' lock dalla 1.2.4.23 (vedi il commento
# sul job): lease + retry 8x con jitter al posto della serializzazione.
# `cancel-in-progress: false`: cancellare a meta' lascerebbe la serie di push
# incrementale parziale (il run successivo la ricompleta, ma nessuna fretta).
concurrency:
  group: forecast-maps-dwdicon-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  engine:
    # ENGINE: scarica/costruisce i frame .om di DWD ICON Global e li committa su
    # `fm2-dwdicon` in `data/fm2/<dominio>/**`.
    runs-on: ubuntu-latest
    # Timeout 360': i domini GLOBALI (~209 frame) a 60' venivano CANCELLATI senza
    # finire. A cache calda (restore-keys fm2-frames-<dominio>-) il run e' molto
    # piu' corto: il valore e' una rete di sicurezza, non il tempo atteso.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        domain:
          - dwd_icon
    concurrency:
      queue: max
      # Group PER-DOMINIO con prefisso PROPRIO del fornitore.
      group: forecast-maps-dwdicon-${{ matrix.domain }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/forecast_v2
            data/fm2/${{ matrix.domain }}
          sparse-checkout-cone-mode: true

      - name: Recupera i dati da fm2-dwdicon
        run: |
          set -e
          git fetch --no-tags --depth=1 origin fm2-dwdicon || { echo "fm2-dwdicon non esiste ancora: prima esecuzione"; exit 0; }
          # FIX 21/10/2026 — ripristino REALE dei frame dal branch dati.
          # Con `filter: blob:none` i blob del branch NON sono in locale e il
          # checkout dei frame moriva con "unable to read sha1 file": i dati
          # precedenti non venivano ripristinati (il motore ripartiva da zero e
          # la guardia NO-OP non poteva scattare). Qui si forza il lazy-fetch del
          # promisor per i SOLI blob del dominio, poi il checkout funziona.
          SHAS="$(git ls-tree -r FETCH_HEAD -- "data/fm2/${{ matrix.domain }}" | awk '{print $3}')"
          if [ -n "$SHAS" ]; then
            printf '%s\n' "$SHAS" | git cat-file --batch > /dev/null 2>&1 || true
          fi
          git checkout FETCH_HEAD -- "data/fm2/${{ matrix.domain }}" || echo "nessun dato precedente per data/fm2/${{ matrix.domain }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/forecast_v2/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r scripts/forecast_v2/requirements.txt

      - name: Cache frame Open-Meteo (.om)
        uses: actions/cache@v4
        with:
          path: .cache_fm2_frames
          key: fm2-frames-${{ matrix.domain }}-${{ github.run_number }}
          restore-keys: |
            fm2-frames-${{ matrix.domain }}-

      - name: Engine + render in parallelo (frame-by-frame)
        id: run_engine
        run: |
          set +e
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_update }}" = "true" ]; then
            FORCE="--force"
          fi
          PROGRESS="$RUNNER_TEMP/fm2-progress-${{ matrix.domain }}.json"
          python scripts/forecast_v2/forecast_v2_engine.py \
            --domains ${{ matrix.domain }} \
            --valid-frames 0 \
            --out data/fm2 \
            --frames-cache .cache_fm2_frames \
            --progress-manifest "$PROGRESS" \
            --allow-partial-run \
            --partial-min-frames 3 \
            $FORCE &
          ENGINE_PID=$!
          # ------------------------------------------------------------------
          # RENDER INCREMENTALE - 1: elenco dei WebP GIA' PUBBLICATI (1.2.4.29)
          #
          # Il renderer accetta `--existing-list`: i (frame, variabile) gia' sul
          # branch per QUESTO run_id vengono SALTATI. E' la differenza fra il
          # primo slot (run parziale, ~24-30 frame) e il secondo (run completo):
          # senza elenco il secondo slot rifa' anche i frame gia' pubblicati.
          #
          # Il run_id non e' un input: e' `_run_id(reference_time)` e il
          # reference_time lo annuncia il motore nel `--progress-manifest`,
          # scritto PRIMA del primo frame. Si attende quel file (max 10 min,
          # 5 s per giro) invece di indovinarlo: se non compare si parte SENZA
          # elenco, cioe' col comportamento storico (render completo).
          #
          # `--filter=blob:none`: si scaricano SOLO gli alberi di fm2-rendered
          # (2,55 MiB e ~3,6 s misurati sul branch reale), nessun blob WebP.
          # Il glob in MEZZO al pathspec NON viene espanso da `git ls-tree`
          # (verificato: 0 righe contro 1 col path esplicito), quindi si passano
          # le regioni di `render_fm_webp.REGIONS` esplicite, tutte in UNA sola
          # invocazione.
          #
          # PALETTE: sullo shard non c'e' il `latest.json` per-variabile (non e'
          # nel checkout: servono scripts/forecast_v2 + data/fm2/<dominio>),
          # quindi la prova che i pixel pubblicati sono di QUESTA palette e'
          # `--existing-palette-sha` = sha256 di
          # `data/fm2-rendered/color_scales.json` SUL BRANCH (dove
          # `copy_color_scales` pubblica la copia esatta del file locale). Se il
          # file non e' sul branch si usa lo sha256 del file locale, che e' la
          # palette con cui si renderizza qui. Palette diversa => il renderer
          # NON riusa e rifa' tutto: e' il comportamento voluto.
          #
          # `--force` (force_update) NON usa l'elenco: e' la via per rigenerare
          # tutto e deve restare tale.
          # ------------------------------------------------------------------
          EXIST_FILE="$RUNNER_TEMP/fm2-existing-${{ matrix.domain }}.txt"
          INCR_ARGS=""
          if [ -n "$FORCE" ]; then
            echo "[incr] force_update: render completo, nessun elenco esistente."
          else
            : > "$EXIST_FILE"
            INCR_WAIT=0
            while [ ! -f "$PROGRESS" ] && [ "$INCR_WAIT" -lt 120 ]; do
              if ! kill -0 "$ENGINE_PID" 2>/dev/null; then
                echo "[incr] motore terminato prima di pubblicare il manifest."
                break
              fi
              sleep 5
              INCR_WAIT=$((INCR_WAIT + 1))
            done
            RUN_ID=""
            REF_TIME=""
            NOOP_FLAG=""
            if [ -f "$PROGRESS" ]; then
              NOOP_FLAG="$(python -c 'import json,sys; print("1" if (json.load(open(sys.argv[1], encoding="utf-8-sig")) or {}).get("noop") else "0")' "$PROGRESS" 2>/dev/null || true)"
              REF_TIME="$(python -c 'import json,sys; print((json.load(open(sys.argv[1], encoding="utf-8-sig")) or {}).get("reference_time") or "")' "$PROGRESS" 2>/dev/null || true)"
              if [ -n "$REF_TIME" ]; then
                RUN_ID="$(python -c 'import sys; sys.path.insert(0, "scripts/forecast_v2"); import render_fm_webp as R; print(R._run_id(sys.argv[1]))' "$REF_TIME" 2>/dev/null || true)"
              fi
            fi
            echo "[incr] manifest: attesa=${INCR_WAIT}x5s noop=${NOOP_FLAG:-?} reference_time=${REF_TIME:-?} run_id=${RUN_ID:-?}"
            if [ "$NOOP_FLAG" = "1" ]; then
              echo "[incr] motore in NO-OP: il renderer esce subito, nessun elenco da costruire."
            elif [ -n "$RUN_ID" ]; then
              INCR_FETCH="ok"
              if ! git fetch --no-tags --depth=1 --filter=blob:none origin fm2-rendered 2> "$RUNNER_TEMP/fm2-incr-fetch-${{ matrix.domain }}.log"; then
                if git ls-remote --heads origin fm2-rendered 2>/dev/null | grep -q "refs/heads/fm2-rendered"; then
                  INCR_FETCH="error"
                else
                  INCR_FETCH="missing-branch"
                fi
                sed 's/^/[incr][fetch] /' "$RUNNER_TEMP/fm2-incr-fetch-${{ matrix.domain }}.log" 2>/dev/null | tail -n 5 || true
              fi
              echo "[incr] fm2-rendered: fetch=$INCR_FETCH tip=$(git rev-parse --short FETCH_HEAD 2>/dev/null || echo -)"
              if [ "$INCR_FETCH" = "ok" ]; then
                SPECS=""
                for region in $(python -c 'import sys; sys.path.insert(0, "scripts/forecast_v2"); import render_fm_webp as R; print(" ".join(sorted(R.REGIONS)))'); do
                  SPECS="$SPECS data/fm2-rendered/$region/${{ matrix.domain }}/runs/$RUN_ID"
                done
                # Guardia: senza pathspec `git ls-tree` elencherebbe TUTTO il
                # branch (altre run, altri domini): qui si vuole solo questo run.
                if [ -n "$SPECS" ]; then
                  git ls-tree -r --name-only FETCH_HEAD -- $SPECS > "$EXIST_FILE" 2>/dev/null || : > "$EXIST_FILE"
                fi
                echo "[incr] path gia' pubblicati per il run $RUN_ID: $(wc -l < "$EXIST_FILE")"
                if [ -s "$EXIST_FILE" ]; then
                  if git cat-file -e "FETCH_HEAD:data/fm2-rendered/color_scales.json" 2>/dev/null; then
                    PALETTE_SHA="$(git show FETCH_HEAD:data/fm2-rendered/color_scales.json | sha256sum | cut -d' ' -f1)"
                    echo "[incr] palette dal branch: $PALETTE_SHA"
                  else
                    PALETTE_SHA="$(sha256sum scripts/forecast_v2/color_scales.json | cut -d' ' -f1)"
                    echo "[incr] color_scales.json NON e' sul branch: palette = sha256 del file locale."
                  fi
                  INCR_ARGS="--existing-list $EXIST_FILE --existing-palette-sha $PALETTE_SHA"
                fi
              fi
            fi
          fi
          echo "[incr] argomenti incrementali: ${INCR_ARGS:-(nessuno: render completo)}"
          python scripts/forecast_v2/render_fm_webp.py \
            --in data/fm2 \
            --out data/fm2-rendered \
            --domains ${{ matrix.domain }} \
            --watch-manifest "$PROGRESS" \
            --limit-frames 0 \
            --method 4 \
            $INCR_ARGS &
          RENDER_PID=$!
          if wait "$ENGINE_PID"; then ENGINE_STATUS=0; else ENGINE_STATUS=$?; fi
          if [ "$ENGINE_STATUS" -ne 0 ]; then
            echo "[ERROR] Engine terminato con codice $ENGINE_STATUS; arresto il consumer render."
            kill "$RENDER_PID" 2>/dev/null || true
            wait "$RENDER_PID" 2>/dev/null || true
            exit "$ENGINE_STATUS"
          fi
          if wait "$RENDER_PID"; then RENDER_STATUS=0; else RENDER_STATUS=$?; fi
          if [ "$RENDER_STATUS" -ne 0 ]; then
            echo "[ERROR] Render streaming terminato con codice $RENDER_STATUS."
            exit "$RENDER_STATUS"
          fi
          # ------------------------------------------------------------------
          # GATE DEL RENDER INCREMENTALE (up-to-date)
          #
          # Con `--existing-list` il renderer esce 0 ANCHE quando non ha scritto
          # nessun WebP: lo chiama "up-to-date" e significa che i pixel di
          # questo run_id sono gia' tutti sul branch. L'exit code quindi NON dice
          # se c'e' qualcosa da pubblicare.
          # La verita' e' il FILESYSTEM dello shard: `data/fm2-rendered` nasce
          # vuoto in questo job (non e' nel checkout) e contiene SOLO l'output di
          # questo run. `changed=false` evita di caricare uno shard senza
          # immagini, che il merge pubblicherebbe come "solo manifest" (e i
          # manifest riscritti in unione porterebbero bytes=null al posto dei
          # byte misurati).
          # ------------------------------------------------------------------
          WEBP_SHARD="$(find data/fm2-rendered -type f -name '*.webp' 2>/dev/null | wc -l)"
          echo "[incr] WebP nello shard: $WEBP_SHARD"
          if python -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get('noop') else 1)" "$PROGRESS" 2>/dev/null; then
            echo "[INFO] Dominio ${{ matrix.domain }} in NO-OP: verifico che i WebP del run siano su fm2-rendered."
            # ------------------------------------------------------------------
            # P6 - SELF-HEALING DEGLI SHARD ORFANI
            #
            # PROBLEMA (misurato, non ipotetico): se `render-merge` fallisce, lo
            # shard WebP resta in un artifact che nessuno riprende. Il run
            # successivo trova il dominio in NO-OP (`changed=false`), quindi non
            # carica alcun artifact, e quei WebP non arrivano MAI al client
            # finche' non cambia `reference_time`. Tre incidenti reali:
            # dwd_icon_d2 fermo a 09Z invece di 15Z, ncep_gfs025 a 00Z invece di
            # 06Z, ncep_gfs013 a 00Z invece di 12Z (dwd run 17: 131,7 min per 0
            # immagini).
            #
            # REGOLA: se per il run corrente i WebP attesi NON sono su
            # `fm2-rendered`, il NO-OP e' falso: si ri-renderizza e si
            # ripubblica. Se ci sono, il NO-OP resta (nessun riprocessamento a
            # ogni run: niente loop).
            #
            # METODO (economico, misurato il 2026-10-25 su fm2-rendered: 118.587
            # path, 1.445 oggetti): `git fetch --depth=1 --filter=blob:none`
            # scarica SOLO gli alberi (pack 2,55 MiB, ~3,6 s) e `git ls-tree -r`
            # (76 ms) elenca i path del run. Nessun blob WebP viene scaricato.
            # Alternativa scartata: HEAD su URL raw del manifest - verifica solo
            # l'esistenza di UNA variabile, non la copertura dei frame.
            #
            # RUN PARZIALE (`--allow-partial-run`): i frame "attesi" sono quelli
            # EFFETTIVAMENTE pubblicati (`latest.json:frames[]`), MAI
            # `valid_times` ne' `partial.n_expected`: un run parziale pubblica
            # meno frame per costruzione e un confronto sull'orizzonte completo
            # riprocesserebbe per sempre.
            # ------------------------------------------------------------------
            HEAL_DIR="$RUNNER_TEMP/fm2-heal-${{ matrix.domain }}"
            rm -rf "$HEAL_DIR"
            mkdir -p "$HEAL_DIR"
            HEAL_FETCH="ok"
            if ! git fetch --no-tags --depth=1 --filter=blob:none origin fm2-rendered 2> "$HEAL_DIR/fetch.log"; then
              if git ls-remote --heads origin fm2-rendered 2>/dev/null | grep -q "refs/heads/fm2-rendered"; then
                HEAL_FETCH="error"
              else
                HEAL_FETCH="missing-branch"
              fi
              sed 's/^/[heal][fetch]   /' "$HEAL_DIR/fetch.log" 2>/dev/null | tail -n 5 || true
            fi
            echo "[heal] fm2-rendered: fetch=$HEAL_FETCH tip=$(git rev-parse --short FETCH_HEAD 2>/dev/null || echo -)"
            HEAL_STATUS=0
            python - "${{ matrix.domain }}" "$HEAL_DIR" "$HEAL_FETCH" <<'PY' || HEAL_STATUS=$?
          import json
          import os
          import subprocess
          import sys

          DOMAIN, HEAL_DIR, FETCH_STATUS = sys.argv[1], sys.argv[2], sys.argv[3]
          sys.path.insert(0, os.path.join("scripts", "forecast_v2"))


          def put(name, value):
              with open(os.path.join(HEAL_DIR, name), "w", encoding="utf-8") as fh:
                  fh.write(str(value) + "\n")


          def finish(code, run_id, kind, detail):
              put("run_id", run_id or "")
              put("kind", kind)
              put("detail", detail)
              label = {0: "OK", 10: "HEAL", 20: "UNVERIFIABLE"}.get(code, "?")
              print("[heal] %s run=%s %s" % (label, run_id or "-", detail))
              raise SystemExit(code)


          if FETCH_STATUS == "error":
              finish(20, "", "unverifiable", "fetch di fm2-rendered fallito (rete/credenziali)")

          try:
              with open(os.path.join("data", "fm2", DOMAIN, "latest.json"), "r",
                        encoding="utf-8-sig") as fh:
                  manifest = json.load(fh)
          except Exception as exc:
              finish(20, "", "unverifiable", "latest.json illeggibile (%s)" % exc)

          try:
              import render_fm_webp as R
          except Exception as exc:
              finish(20, "", "unverifiable", "import di render_fm_webp fallito (%s)" % exc)

          run_id = R._run_id(manifest.get("reference_time"))
          frames = [f for f in (manifest.get("frames") or []) if f.get("valid_time")]
          partial_info = manifest.get("partial") or {}
          if not frames:
              finish(20, run_id, "unverifiable", "manifest senza frame pubblicati")
          bbox, grid = manifest.get("bbox"), manifest.get("grid")
          if not isinstance(bbox, dict) or not isinstance(grid, dict):
              finish(20, run_id, "unverifiable", "manifest senza bbox/grid")

          is_global = R._is_global_bbox(bbox)
          regions = {}
          for name, region_bbox in R.REGIONS.items():
              if name == R.DOMAIN_REGION and R.DOMAIN_REGION_SKIP_GLOBAL and is_global:
                  continue
              if name == R.NORTH_REGION and R.NORTH_REGION_SKIP_NON_GLOBAL and not is_global:
                  continue
              resolved = R.resolve_region_bbox(region_bbox, bbox)
              if R.region_crop(bbox, grid, resolved) is None:
                  continue
              regions[name] = resolved
          if not regions:
              finish(20, run_id, "unverifiable", "nessuna regione interseca il dominio")

          print("[heal] run=%s frame_pubblicati=%d regioni_attese=%s partial=%s"
                % (run_id, len(frames), ",".join(sorted(regions)),
                   "on(%d/%s)" % (len(frames), partial_info.get("n_expected"))
                   if partial_info.get("enabled") else "off"))

          if FETCH_STATUS == "missing-branch":
              finish(10, run_id, "absent", "branch fm2-rendered assente: nessun WebP pubblicato")

          # NB: `git ls-tree` NON espande il glob in MEZZO al pathspec (verificato:
          # "data/fm2-rendered/*/<dominio>/runs/<run_id>" restituisce 0 righe,
          # mentre il path esplicito ne restituisce 1). Si passano quindi le
          # regioni ATTESE come pathspec distinti, tutti in UNA sola invocazione.
          specs = ["data/fm2-rendered/%s/%s/runs/%s" % (name, DOMAIN, run_id)
                   for name in sorted(regions)]
          try:
              proc = subprocess.run(["git", "ls-tree", "-r", "--name-only",
                                     "FETCH_HEAD", "--"] + specs,
                                    stdout=subprocess.PIPE,
                                    stderr=subprocess.PIPE, text=True)
          except OSError as exc:
              finish(20, run_id, "unverifiable", "git non eseguibile (%s)" % exc)
          if proc.returncode != 0:
              finish(20, run_id, "unverifiable",
                     "git ls-tree fallito (%s)" % proc.stderr.strip()[:200])

          published = {}
          for path in proc.stdout.splitlines():
              parts = path.split("/")
              if len(parts) != 8 or parts[4] != "runs" or parts[5] != run_id:
                  continue
              if not parts[7].endswith(".webp"):
                  continue
              published.setdefault(parts[2], set()).add(parts[7][:-5])

          expected = {R.valid_time_to_filename(f["valid_time"]) for f in frames}
          absent = [r for r in sorted(regions) if not published.get(r)]
          incomplete = {}
          for name in sorted(regions):
              if name in absent:
                  continue
              missing = expected - published[name]
              if missing:
                  incomplete[name] = missing

          for name in sorted(regions):
              have = len(published.get(name, ()))
              print("[heal]   regione=%-7s frame_visti=%d attesi=%d %s"
                    % (name, have, len(expected),
                       "ASSENTE" if name in absent else
                       ("INCOMPLETO (-%d frame)" % len(incomplete[name])
                        if name in incomplete else "ok")))

          if absent or incomplete:
              detail = []
              if absent:
                  detail.append("regioni senza WebP: %s" % ",".join(absent))
              for name in sorted(incomplete):
                  detail.append("frame mancanti in %s: %d/%d (es. %s)"
                                % (name, len(incomplete[name]), len(expected),
                                   min(incomplete[name])))
              finish(10, run_id, "incomplete" if not absent else "absent", "; ".join(detail))

          finish(0, run_id, "ok", "tutte le %d regioni attese hanno i %d frame pubblicati"
                 % (len(regions), len(expected)))
          PY
            HEAL_RUN_ID="$(cat "$HEAL_DIR/run_id" 2>/dev/null || true)"
            HEAL_KIND="$(cat "$HEAL_DIR/kind" 2>/dev/null || echo unknown)"
            if [ "$HEAL_STATUS" -eq 10 ]; then
              case "$HEAL_KIND" in
                absent)  echo "::notice::[HEAL] WebP del run $HEAL_RUN_ID assenti su fm2-rendered: riprocesso invece del NO-OP." ;;
                *)       echo "::notice::[HEAL] WebP del run $HEAL_RUN_ID incompleti su fm2-rendered: riprocesso invece del NO-OP." ;;
              esac
              # Ri-render dallo shard .om GIA' presente (restaurato da fm2-dwd):
              # senza `--watch-manifest`, che in NO-OP esce subito senza scrivere
              # nulla e lascerebbe l'artifact vuoto.
              python scripts/forecast_v2/render_fm_webp.py \
                --in data/fm2 \
                --out data/fm2-rendered \
                --domains ${{ matrix.domain }} \
                --limit-frames 0 \
                --method 4
              HEAL_RENDER_STATUS=$?
              if [ "$HEAL_RENDER_STATUS" -ne 0 ]; then
                echo "::error::[HEAL] Render di recupero fallito (codice $HEAL_RENDER_STATUS): lo shard del run $HEAL_RUN_ID resta non pubblicato."
                exit "$HEAL_RENDER_STATUS"
              fi
              HEAL_WEBP="$(find data/fm2-rendered -path "*/${{ matrix.domain }}/runs/$HEAL_RUN_ID/*" -name '*.webp' 2>/dev/null | wc -l)"
              echo "[heal] WebP rigenerati per il run $HEAL_RUN_ID: $HEAL_WEBP file."
              if [ "$HEAL_WEBP" -eq 0 ]; then
                echo "::error::[HEAL] Nessun WebP rigenerato per il run $HEAL_RUN_ID: shard non pubblicabile."
                exit 1
              fi
              echo "changed=true" >> "$GITHUB_OUTPUT"
            elif [ "$HEAL_STATUS" -eq 0 ]; then
              echo "[INFO] WebP del run $HEAL_RUN_ID gia' su fm2-rendered: NO-OP confermato."
            else
              echo "::warning::[HEAL] Stato dei WebP del run non verificabile (fetch=$HEAL_FETCH): NO-OP mantenuto, nessun riprocessamento."
            fi
          else
            if [ "$WEBP_SHARD" -gt 0 ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Render up-to-date (${{ matrix.domain }}): 0 WebP nuovi, artefatto non caricato e merge saltato."
            fi
          fi
      - name: Summary
        if: always()
        run: |
          {
            echo "## MeteoRisk - Forecast Maps V2 (dwdicon / engine)"
            echo ""
            echo "Dominio: \`${{ matrix.domain }}\`"
            echo ""
            if [ -f data/fm2/${{ matrix.domain }}/latest.json ]; then
              python -c "import json; d=json.load(open('data/fm2/${{ matrix.domain }}/latest.json')); f=d.get('frames',[]); print('reference_time:', d.get('reference_time')); print('frame:', len(f), '- valid_times:', len(d.get('valid_times', []))); print('byte totali:', sum(x.get('bytes',0) for x in f)); print('dominio:', d.get('domain')); print('warning:', len(d.get('warnings', []))); print('pruned:', d.get('pruned'))"
            else
              echo "latest.json non disponibile per il dominio '${{ matrix.domain }}' (run fallita prima del motore?)."
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload render shard fm2r-${{ matrix.domain }}
        if: success() && steps.run_engine.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fm2r-${{ matrix.domain }}
          path: |
            data/fm2-rendered/italia/${{ matrix.domain }}
            data/fm2-rendered/europa/${{ matrix.domain }}
            data/fm2-rendered/north/${{ matrix.domain }}
            data/fm2-rendered/domain/${{ matrix.domain }}
          if-no-files-found: warn
          retention-days: 1
      - name: Commit cache aggiornata su fm2-dwdicon (only if changed)
        if: success()
        run: |
          git config user.name "meteorisk-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ ! -d "data/fm2/${{ matrix.domain }}" ]; then
            echo "[INFO] Nessun output per il dominio '${{ matrix.domain }}': niente da committare."
            exit 0
          fi
          MSG="chore(fm2): aggiornamento cache dominio ${{ matrix.domain }} (.om per-domain crop)"
          for i in 1 2 3 4 5; do
            git fetch --no-tags --depth=1 origin fm2-dwdicon || true
            if git rev-parse --verify --quiet FETCH_HEAD >/dev/null 2>&1; then
              BASE="$(git rev-parse FETCH_HEAD^{tree})"
              PARENT="$(git rev-parse FETCH_HEAD)"
            else
              echo "[INFO] fm2-dwdicon non esiste ancora: questo e' il primo commit del branch."
              BASE="$(git hash-object -t tree /dev/null)"
              PARENT=""
            fi
            IDX="$(mktemp -u)"
            rm -f "$IDX"
            # (1) base = tree del branch dati (NON l'indice di `main`)
            GIT_INDEX_FILE="$IDX" git read-tree "$BASE"
            # (2) METODO MINIMALE (verificato su git reale): NON si usa l'allowlist
            #     per complemento `:(exclude)data/fm2/**`, che butterebbe via
            #     dall'indice i path che il working tree non ha ripristinato e li
            #     registrerebbe come CANCELLAZIONI. Si rimuove dall'indice SOLO il
            #     path del dominio corrente, che il working tree e' autorevole a
            #     ri-aggiungere.
            if [ -d data/fm2 ]; then
              GIT_INDEX_FILE="$IDX" git ls-files -- "data/fm2/${{ matrix.domain }}" \
                | while IFS= read -r p; do
                    GIT_INDEX_FILE="$IDX" git update-index --force-remove -- "$p"
                  done
            fi
            # (3) aggiorna SOLO il dominio corrente dal working tree
            GIT_INDEX_FILE="$IDX" git add -A -- "data/fm2/${{ matrix.domain }}"
            TREE="$(GIT_INDEX_FILE="$IDX" git write-tree --missing-ok)"
            rm -f "$IDX"
            # (3-bis) GUARDIA DI SCOPE: il commit engine deve toccare SOLO
            #     data/fm2/${{ matrix.domain }}/**. Un path fuori allowlist => ABORTISCI.
            git diff-tree -r --no-commit-id --name-only "$BASE" "$TREE" > /tmp/fm2_eng_scope.txt
            BAD_SCOPE="$(grep -E -v '^data/fm2/${{ matrix.domain }}/' /tmp/fm2_eng_scope.txt || true)"
            if [ -n "$BAD_SCOPE" ]; then
              echo "::error::GUARDIA DI SCOPE VIOLATA (engine dwdicon): path fuori allowlist:"
              printf '%s\n' "$BAD_SCOPE"
              exit 1
            fi
            # NO-OP: albero identico al tip => nessun churn.
            if [ "$TREE" = "$BASE" ]; then
              echo "[INFO] Nessuna modifica a data/fm2/${{ matrix.domain }} (NO-OP)."
              exit 0
            fi
            # COMMIT ORPHAN (nessun parent) + LEASE: la storia del branch dati
            # resta profonda UN commit, e il push riesce SOLO se il tip remoto e'
            # ancora $PARENT. Se il branch non esiste ($PARENT vuoto) il lease
            # pretende che il ref NON esista (forma "refs/heads/<branch>:" senza
            # valore). Mai `--force` nudo: una sovrascrittura concorrente DEVE
            # fallire invece di cancellare in silenzio.
            NEW="$(git commit-tree "$TREE" -m "$MSG")"
            if git push --force-with-lease="refs/heads/fm2-dwdicon:$PARENT" origin "$NEW:refs/heads/fm2-dwdicon"; then
              echo "[INFO] Push su fm2-dwdicon riuscito (tentativo $i/5)."
              exit 0
            fi
            echo "[WARN] Push su fm2-dwdicon rifiutato (race sul branch) - tentativo $i/5"
            sleep $((i*3))
          done
          echo "[ERROR] Push su fm2-dwdicon non riuscito dopo 5 tentativi."
          exit 1

  render-merge:
    # MERGE PER-FORNITORE: pubblica i WebP di DWD ICON Global su `fm2-rendered` nelle
    # directory `data/fm2-rendered/<regione>/<dominio>/**` (path DISGIUNTI dagli
    # altri fornitori). NON scrive MAI gli `index.json`.
    #
    # !!! PERCHE' NON SCRIVE GLI index.json (LOST-UPDATE): il client legge UN SOLO
    #   `data/fm2-rendered/<regione>/index.json` per regione (HTML riga 12088) e da
    #   quell'indice scopre TUTTI i domini. Se questo job eseguisse
    #   `--index-only --domains dwd_icon`, l'indice aggregato verrebbe riscritto con i
    #   SOLI domini del fornitore e gli altri SPARIREBBERO dal client. Cinque
    #   workflow = cinque scrittori concorrenti sullo stesso file = lost-update.
    #   SOLUZIONE: l'indice aggregato resta di proprieta' del solo
    #   `forecast-maps-index.yml` (scrittore unico). Questo job pubblica SOLO i
    #   WebP di DWD ICON Global: l'inclusione nell'indice avviene automaticamente al
    #   successivo `--index-only` dell'index-builder, che legge dal FILESYSTEM
    #   LOCALE dopo aver materializzato i WebP da `fm2-rendered`.
    name: render-merge dwdicon (webp su fm2-rendered, nessun index)
    needs: engine
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # 1.2.4.23 - NIENTE `concurrency` SU QUESTO JOB: era il lock GLOBALE
    # `fm2-rendered-writer`, condiviso da tutti e 5 i merge, ed era il COLLO DI
    # BOTTIGLIA MISURATO della pipeline (non il trigger).
    #
    # MISURA (3 ore di produzione, 2026-10-24 23:25Z -> 2026-10-25 02:29Z):
    #   - occupazione del lock: 183 min su 220 = 83%;
    #   - attesa in coda fino a 42 minuti (run DWD 22:10: engine finito
    #     23:06:45, merge PARTITO 23:48:34);
    #   - costo di `Commit WebP`: 12-46 min per fornitore.
    #   - NON era scarsita' di runner: la run DWD delle 22:10 era `pending`
    #     alle 23:33 ma i suoi job `engine` erano gia' partiti alle 22:10:37;
    #     in coda c'era SOLO il `render-merge`.
    # Effetto: il raddoppio degli slot (2 per run) ha raddoppiato la domanda su
    # una risorsa gia' satura, e il tempo totale DWD e' rimasto 108-129 min
    # contro una baseline di 61-132: il guadagno del run parziale era assorbito
    # dall'attesa.
    #
    # PERCHE' IL LOCK ORA E' SUPERFLUO: dal 2026-10-24 i push usano
    # `git commit-tree` ORPHAN + `--force-with-lease="refs/heads/fm2-rendered:$PARENT"`
    # e il merge RITENTA DAVVERO (fix P5, verificato in produzione: "! [rejected]
    # ... (stale info)" -> rifiuto gruppo 1/2 -> rifetch -> riuscito al
    # tentativo 2/5, 2/2 gruppi, albero finale == target). Due scrittori
    # concorrenti NON si sovrascrivono: il secondo perde il lease, rifetcha e
    # ripubblica solo i gruppi mancanti. Il lock non proteggeva piu' nulla che il
    # lease non protegga gia': aggiungeva solo attesa.
    #
    # La contesa che il lock assorbiva e' ora assorbita dal retry 8x CON JITTER
    # del passo `Commit WebP` (vedi li'). Toglierlo e' REVERSIBILE: basta
    # rimettere qui
    #   concurrency:
    #     group: fm2-rendered-writer
    #     cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
          filter: blob:none
          sparse-checkout: |
            scripts/forecast_v2
            data/fm2-rendered
          sparse-checkout-cone-mode: true

      - name: Recupera lo stato di fm2-rendered (SENZA materializzare i WebP)
        run: |
          set -e
          git fetch --no-tags --depth=1 origin fm2-rendered || { echo "fm2-rendered non esiste ancora: prima esecuzione"; exit 0; }
          git sparse-checkout disable >/dev/null 2>&1 || true
          # 1.2.4.13: il checkout integrale di `data/fm2-rendered` scaricava
          # TUTTI i blob WebP del branch (240+ MiB e crescenti: 4.700+ oggetti)
          # e il job render-merge ci metteva 10-20 minuti PRIMA di iniziare a
          # lavorare. Ma il commit-step usa gia' un indice TEMPORANEO popolato
          # da `git read-tree "$BASE"` (il tree DEL BRANCH): i WebP degli altri
          # fornitori non servono nel working tree, non vengono mai staged e
          # non possono essere rimossi come cancellazioni.
          # Il working tree deve contenere SOLO lo shard autorevole del
          # provider (rm -rf + cp -a piu' avanti).
          # La sicurezza e' stata PROVATA con git reale: senza il checkout il
          # tree finale contiene i WebP nuovi del provider, rimuove i vecchi /
          # il subtree dark / le variabili droppate, lascia INTATTI i WebP degli
          # altri domini e gli index.json aggregati, e la guardia di scope
          # (ALLOW_RE) non rileva alcuna violazione.
          if git rev-parse --verify --quiet FETCH_HEAD >/dev/null 2>&1; then
            echo "[fetch] fm2-rendered: tip=$(git rev-parse --short FETCH_HEAD) (alberi solo, blob NON scaricati)"
            git ls-tree --name-only FETCH_HEAD -- "data/fm2-rendered" 2>/dev/null | head -n 5 | sed 's/^/[fetch]   /' || true
            echo "[fetch] nessun checkout: il working tree conterra' SOLO lo shard del provider."
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/forecast_v2/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r scripts/forecast_v2/requirements.txt

      - name: Download render shard artifact (fm2r-*)
        uses: actions/download-artifact@v4
        with:
          pattern: 'fm2r-*'
          path: /tmp/fm2r

      - name: Assemble shard DWD ICON Global (overlay delle directory dominio)
        id: shards
        run: |
          # OVERLAY, non sostituzione: lo shard di un render incrementale contiene
          # SOLO il delta del run e i WebP gia' pubblicati NON sono su questo
          # runner. `rm -rf` + `cp -a` lascerebbe il solo delta, cioe' i frame
          # gia' pubblicati sparirebbero. Si sovrascrivono i file presenti e non
          # si cancella nulla: la potatura delle run vecchie resta al prune
          # (`prune_fm2_run_index.py --keep 3`) nel passo `Commit WebP`.
          # Costo dichiarato: una variabile DROPPATA dall'elenco del motore non
          # viene piu' rimossa da qui; sparisce quando la run esce dalla
          # retention (3 run).
          # !!! SOLO i domini dwd_icon: nessun'altra directory dominio viene toccata,
          # e NESSUN index.json viene scritto ne' rimosso (sono fuori dalle path
          # <regione>/<dominio> e restano di proprieta' dell'index-builder).
          got=0
          for region in italia europa north domain; do
            src=""
            # download-artifact con pattern fm2r-* estrae in /tmp/fm2r/<artifact-name>/:
            # prova i layout noti e, in fallback, cerca il dominio sotto /tmp/fm2r.
            for cand in "/tmp/fm2r/$region/dwd_icon" \
                        "/tmp/fm2r/fm2r-dwd_icon/$region/dwd_icon" \
                        "/tmp/fm2r/fm2r-dwd_icon-$region/dwd_icon" \
                        "/tmp/fm2r/dwd_icon/$region/dwd_icon"; do
              [ -d "$cand" ] && { src="$cand"; break; }
            done
            if [ -z "$src" ]; then
              found=$(find /tmp/fm2r -type d -name "dwd_icon" 2>/dev/null | grep "/$region/dwd_icon$" | head -n1 || true)
              [ -n "$found" ] && src="$found"
            fi
            if [ -n "$src" ] && [ -d "$src" ]; then
              mkdir -p "data/fm2-rendered/$region/dwd_icon"
              cp -a "$src/." "data/fm2-rendered/$region/dwd_icon/"
              got=1
            fi
          done
          if [ "$got" -eq 1 ]; then
            echo "domains=dwd_icon" >> "$GITHUB_OUTPUT"
            echo "[shard] domini renderizzati: dwd_icon"
          else
            echo "[WARN] shard dwdicon: nessuna regione presente, merge escluso"
            echo "domains=" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## MeteoRisk - Forecast Maps V2 (dwdicon / render-merge)"
            echo ""
            echo "Domini pubblicati: \`dwd_icon\` (solo WebP; index aggregato NON toccato)"
            echo ""
            echo "WebP dwdicon in cache: $(find data/fm2-rendered -path '*dwd_icon*' -name '*.webp' 2>/dev/null | wc -l)"
            echo ""
            echo "NOTA: \`data/fm2-rendered/<regione>/index.json\` resta scritto dal solo"
            echo "index-builder (\`forecast-maps-index.yml\`): nessun lost-update fra scrittori."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit WebP dwdicon su fm2-rendered (push incrementale, only if changed)
        id: commit_webp
        if: success() && steps.shards.outputs.domains != ''
        run: |
          git config user.name "meteorisk-bot"
          git config user.email "actions@users.noreply.github.com"
          git sparse-checkout disable >/dev/null 2>&1 || true
          if [ ! -d "data/fm2-rendered" ]; then
            echo "[INFO] Nessun output renderizzato: niente da committare."
            exit 0
          fi
          # !!! PREPARAZIONE UNA VOLTA + PUSH INCREMENTALE (1.2.4.24).
          # MISURA CHE HA PORTATO QUI (run 40156639694, step 109,4 min): il
          # trasferimento reale dei 2 GiB dura 81 s; il resto era lavoro LOCALE
          # RIPETUTO per ogni tentativo perso (4 tentativi x 6 directory):
          #   - blocco add+prune: 4.261 s (64,9%)
          #   - `git write-tree` senza --missing-ok: 1.899 s (28,9%)
          #     (su un partial clone `blob:none` write-tree verifica che OGNI
          #      oggetto dell'indice esista in locale e innesca un promisor fetch
          #      che il filtro non puo' soddisfare; `--missing-ok` salta il check)
          #   - trasferimento: 81,1 s (1,2%)
          # Quindi: (a) add+prune+write-tree dello shard girano UNA volta sola,
          # fuori dal ciclo; (b) a ogni tentativo si ricostruisce l'albero dal
          # solo OWN_TREE (sottoalbero dei path del fornitore) innestato sul BASE
          # fresco: nessun add, nessun prune; (c) guardia temporale PRIMA della
          # preparazione; (d) una riga `[diag]` per tentativo con i tempi.
          # INVARIANTI INVARIATI: commit ORPHAN, lease
          # --force-with-lease=refs/heads/fm2-rendered:<parent> (mai --force nudo),
          # guardia di scope sui soli WebP del fornitore, partizione a 1,4 GiB,
          # self-healing P6 (i gruppi gia' pubblicati restano validi).
          MSG="chore(fm2): aggiornamento WebP dwdicon (regioni italia/europa/north/domain, light+dark)"
          THRESHOLD=$((1400 * 1024 * 1024))
          GQ="-c core.quotePath=false"
          # ALLOWLIST di scope del merge: SOLO i path WebP dei PROPRI domini.
          ALLOW_RE='^data/fm2-rendered/[^/]+/(dwd_icon)/'
          REGIONS="italia europa north domain"
          OWNDOMS="dwd_icon"
          RENDERED_REF="refs/remotes/origin/fm2-rendered"
          now_ms() { date +%s%3N; }
          ms_s() { printf '%d.%03d' "$(( $1 / 1000 ))" "$(( $1 % 1000 ))"; }
          ls_remote_tip() { git ls-remote origin refs/heads/fm2-rendered 2>/dev/null | awk 'NR==1 { print $1 }'; }
          local_tip() { git rev-parse --verify --quiet "$RENDERED_REF" 2>/dev/null || true; }
          # `+` OBBLIGATORIO: fm2-rendered e' riscritto (commit orphan + force),
          # quindi l'aggiornamento di refs/remotes/origin/fm2-rendered e'
          # NON-fast-forward. Senza `+` git rifiuta il fetch e il ref locale resta
          # FERMO al primo tip: ogni tentativo rifarebbe la stessa lease e
          # fallirebbe per sempre (bug trovato dal test funzionale, non in teoria).
          fetch_rendered() {
            if ! git fetch --no-tags --depth=1 origin "+refs/heads/fm2-rendered:$RENDERED_REF" >/dev/null 2>/tmp/fm2_fetch.err; then
              if grep -q "couldn't find remote ref" /tmp/fm2_fetch.err 2>/dev/null; then
                : # branch non ancora esistente: prima pubblicazione
              else
                echo "[WARN] fetch fm2-rendered fallito: $(tr '\n' ' ' < /tmp/fm2_fetch.err | cut -c1-240)"
              fi
            fi
            return 0
          }

          # ================================================================
          # (0) GUARDIA TEMPORALE (costo < 1 s): se il tip remoto e' gia'
          #     cambiato rispetto a quello con cui e' iniziato il job, si
          #     rifetcha ADESSO, prima di spendere la preparazione.
          # ================================================================
          T_STEP0="$(now_ms)"
          # Tip con cui il JOB e' partito (fetch dello step "Recupera lo stato").
          START_TIP="$(git rev-parse --verify --quiet FETCH_HEAD 2>/dev/null || true)"
          fetch_rendered
          guard_round=0
          while [ "$guard_round" -lt 5 ]; do
            guard_round=$(( guard_round + 1 ))
            REMOTE_TIP="$(ls_remote_tip)"
            LOCAL_TIP="$(local_tip)"
            if [ -z "$REMOTE_TIP" ]; then
              echo "[guardia-t] fm2-rendered assente sul remoto: prima pubblicazione (giro $guard_round)"
              break
            fi
            if [ "$REMOTE_TIP" = "$LOCAL_TIP" ]; then
              if [ -n "$START_TIP" ] && [ "$START_TIP" != "$LOCAL_TIP" ]; then
                echo "[guardia-t] il ref e' avanzato DOPO l'inizio del job: ${START_TIP:0:12} -> ${LOCAL_TIP:0:12}"
                echo "[guardia-t] la preparazione parte dal tip FRESCO (non da una base gia' persa)"
              else
                echo "[guardia-t] tip allineato PRIMA della preparazione: ${REMOTE_TIP:0:12} (giro $guard_round)"
              fi
              break
            fi
            echo "[guardia-t] tip remoto ${REMOTE_TIP:0:12} != base locale ${LOCAL_TIP:0:12}: rifetch PRIMA di preparare (giro $guard_round)"
            fetch_rendered
            if [ "$guard_round" -lt 5 ]; then
              sleep "$guard_round"
            fi
          done
          BASE0="$(local_tip)"
          if [ -n "$BASE0" ]; then
            BASE0_TREE="$(git rev-parse "$BASE0^{tree}")"
          else
            BASE0_TREE="$(git hash-object -t tree /dev/null)"
          fi

          # ================================================================
          # (1) PREPARAZIONE (UNA SOLA VOLTA, FUORI DAL RETRY)
          #     Indice "shadow" con i SOLI path dei propri domini: il prune
          #     (un processo per path rimosso) lavora su ~1/5 delle entry e il
          #     risultato per questi path e' IDENTICO a quello sull'indice
          #     completo. `write-tree --missing-ok` non va a cercare i blob
          #     delle run conservate (non presenti in un partial clone).
          # ================================================================
          T_PREP0="$(now_ms)"
          PREP_IDX="$(mktemp -u)"
          rm -f "$PREP_IDX"
          GIT_INDEX_FILE="$PREP_IDX" git read-tree --empty
          OWN_DIRS=""
          for region in $REGIONS; do
            for dom in $OWNDOMS; do
              d="data/fm2-rendered/$region/$dom"
              # Regione NON riprodotta da questo run: la directory resta quella
              # di BASE (nessun add, nessuna cancellazione registrata).
              if [ ! -d "$d/runs" ]; then
                continue
              fi
              sub="$(git rev-parse --verify --quiet "$BASE0_TREE:$d" 2>/dev/null || true)"
              if [ -n "$sub" ]; then
                GIT_INDEX_FILE="$PREP_IDX" git read-tree --prefix="$d/" "$sub"
              fi
              for rd in "$d"/runs/*; do
                if [ -d "$rd" ]; then
                  # OVERLAY, NON SOSTITUZIONE: l'indice qui contiene GIA' tutti i
                  # path pubblicati del branch (`read-tree --prefix` sopra) e lo
                  # shard ne contiene solo il delta. `git add -A` registrerebbe
                  # come CANCELLAZIONI i WebP presenti nell'indice e assenti
                  # dallo shard: i frame gia' pubblicati sparirebbero.
                  # `--ignore-removal` aggiunge e aggiorna soltanto.
                  GIT_INDEX_FILE="$PREP_IDX" git add --ignore-removal -- "$rd"
                fi
              done
              GIT_INDEX_FILE="$PREP_IDX" python scripts/forecast_v2/prune_fm2_run_index.py --index "$PREP_IDX" --path "$d" --keep 3
              OWN_DIRS="$OWN_DIRS $d"
            done
          done
          if [ -z "$OWN_DIRS" ]; then
            echo "[INFO] Shard dwdicon: nessuna directory <regione>/<dominio>/runs nello shard, niente da committare."
            rm -f "$PREP_IDX"
            exit 0
          fi
          OWN_TREE="$(GIT_INDEX_FILE="$PREP_IDX" git write-tree --missing-ok)"
          rm -f "$PREP_IDX"
          T_PREP_MS=$(( $(now_ms) - T_PREP0 ))
          echo "[prep] preparazione unica (fuori dal retry): OWN_TREE=${OWN_TREE:0:12} durata=$(ms_s "$T_PREP_MS")s"
          echo "[prep] directory di proprieta:$OWN_DIRS"
          echo "[prep] path nello shard: $(git ls-tree -r --name-only "$OWN_TREE" | wc -l)"

          # ================================================================
          # (2) CICLO DEI TENTATIVI: qui NON si rifa' nulla di locale pesante.
          #     Per tentativo: fetch del tip fresco -> read-tree BASE ->
          #     sostituzione dei SOLI path di proprieta' con OWN_TREE ->
          #     write-tree --missing-ok -> guardia -> partizione -> push.
          # ================================================================
          for i in 1 2 3 4 5 6 7 8; do
            T_ATT0="$(now_ms)"
            PUSH_FAILED=0
            PUSH_FAILED_GROUP=""
            RIFIUTO_MS=0
            # ---- (2a) fetch del tip fresco (costo: 1 rete, nessun blob) ----
            T_FETCH0="$(now_ms)"
            fetch_rendered
            NEW_TIP="$(local_tip)"
            T_FETCH_MS=$(( $(now_ms) - T_FETCH0 ))
            if [ -n "$NEW_TIP" ]; then
              PARENT="$NEW_TIP"
              BASE="$(git rev-parse "$PARENT^{tree}")"
            else
              echo "[INFO] fm2-rendered non esiste ancora: questo e' il primo commit del branch."
              BASE="$(git hash-object -t tree /dev/null)"
              PARENT=""
            fi
            T_LOCAL0="$(now_ms)"
            IDXT="$(mktemp -u)"
            rm -f "$IDXT"
            GIT_INDEX_FILE="$IDXT" git read-tree "$BASE"
            # ---- (2b) innesto di OWN_TREE: rimozione in UN processo, innesto in
            #      UN processo (index-info). Nessun `git add`, nessun prune.
            #      Le cancellazioni da retention sono implicite: i path di
            #      proprieta' sono INTERAMENTE rimpiazzati da OWN_TREE.
            GIT_INDEX_FILE="$IDXT" git ls-files -z -- $OWN_DIRS | GIT_INDEX_FILE="$IDXT" git update-index -z --force-remove --stdin
            git ls-tree -r "$OWN_TREE" -- $OWN_DIRS \
              | awk -F'\t' '{ split($1, a, " "); printf "%s %s 0\t%s\n", a[1], a[3], $2 }' \
              | GIT_INDEX_FILE="$IDXT" git update-index --index-info
            TREE="$(GIT_INDEX_FILE="$IDXT" git write-tree --missing-ok)"
            rm -f "$IDXT"
            # NO-OP: albero identico al tip => nessun churn.
            if [ "$TREE" = "$BASE" ]; then
              echo "[INFO] Nessuna modifica ai WebP dwdicon (NO-OP)."
              exit 0
            fi
            # ---- (2c) GUARDIA DI SCOPE (fail-fast, PRIMA di ogni push) ----
            git diff-tree -r --no-commit-id --name-only "$BASE" "$TREE" > /tmp/fm2_scope.txt
            BAD_SCOPE="$(grep -E -v "$ALLOW_RE" /tmp/fm2_scope.txt || true)"
            if [ -n "$BAD_SCOPE" ]; then
              echo "::error::GUARDIA DI SCOPE VIOLATA (merge dwdicon): path fuori allowlist:"
              printf '%s\n' "$BAD_SCOPE"
              exit 1
            fi
            echo "[guardia] scope OK: $(wc -l < /tmp/fm2_scope.txt) path toccati (solo WebP dwd_icon)"
            # ---- (2d) lista dei path CAMBIATI con dimensione (per la soglia) ----
            # Le dimensioni si leggono UNA volta dall'albero di lavoro con un solo
            # `find` e si accoppiano ai path con UN solo `awk`. Prima c'era uno
            # `stat` per path: su 21.648 path sono 21.648 processi (~60 s per
            # tentativo su runner Linux, misurato 74 ms/path in locale su MSYS).
            git $GQ diff-tree -r --no-commit-id --name-status "$BASE" "$TREE" > /tmp/fm2_changed.txt
            find . -path ./.git -prune -o -type f -printf '%s\t%P\n' > /tmp/fm2_wsizes.txt
            : > /tmp/fm2_sizes.txt
            : > /tmp/fm2_dels.txt
            awk -F"$(printf '\t')" '
              NR == FNR { sz[$2] = $1; next }
              $1 == "D" { print $2 > "/tmp/fm2_dels.txt"; next }
              { printf "%s\t%s\n", (($2 in sz) ? sz[$2] : 0), $2 > "/tmp/fm2_sizes.txt" }
            ' /tmp/fm2_wsizes.txt /tmp/fm2_changed.txt
            # ---- (2e) partizione a soglia (first-fit-decreasing) ----
            sort -t"$(printf '\t')" -k1,1nr /tmp/fm2_sizes.txt > /tmp/fm2_sizes_sorted.txt
            rm -rf /tmp/fm2_groups
            mkdir -p /tmp/fm2_groups
            gidx=1
            gbytes=0
            : > "/tmp/fm2_groups/g_${gidx}.txt"
            while IFS="$(printf '\t')" read -r sz path; do
              [ -z "$path" ] && continue
              if [ "$gbytes" -gt 0 ] && [ $((gbytes + sz)) -gt "$THRESHOLD" ]; then
                gidx=$((gidx + 1))
                gbytes=0
                : > "/tmp/fm2_groups/g_${gidx}.txt"
              fi
              printf '%s\n' "$path" >> "/tmp/fm2_groups/g_${gidx}.txt"
              gbytes=$((gbytes + sz))
              if [ "$sz" -gt "$THRESHOLD" ]; then
                echo "[WARN] path singolo oltre soglia (resta da solo nel suo gruppo): $path ($sz B)"
              fi
            done < /tmp/fm2_sizes_sorted.txt
            if [ -s /tmp/fm2_dels.txt ]; then
              cat /tmp/fm2_dels.txt >> "/tmp/fm2_groups/g_${gidx}.txt"
            fi
            NGROUPS="$gidx"
            echo "[push] path cambiati: $(wc -l < /tmp/fm2_sizes.txt) A/M + $(wc -l < /tmp/fm2_dels.txt) D = $NGROUPS gruppi (soglia $THRESHOLD B)"
            T_PREP_ATT_MS=$(( $(now_ms) - T_LOCAL0 ))
            # ---- (2f) push gruppo per gruppo ----
            IDXG="$(mktemp -u)"
            rm -f "$IDXG"
            GIT_INDEX_FILE="$IDXG" git read-tree "$BASE"
            RUN_PARENT="$PARENT"
            pushed_groups=0
            gi=1
            T_PUSH0="$(now_ms)"
            while [ "$gi" -le "$NGROUPS" ]; do
              GFILE="/tmp/fm2_groups/g_${gi}.txt"
              if [ ! -s "$GFILE" ]; then
                gi=$((gi + 1))
                continue
              fi
              GIT_INDEX_FILE="$IDXG" git add -A --pathspec-from-file="$GFILE"
              GTREE="$(GIT_INDEX_FILE="$IDXG" git write-tree --missing-ok)"
              echo "[push] gruppo $gi/$NGROUPS: $(wc -l < "$GFILE") path -> tree $GTREE"
              # COMMIT ORPHAN + LEASE: storia = 1 commit; il lease pretende che il
              # tip remoto sia ancora RUN_PARENT (vuoto alla prima pubblicazione).
              GNEW="$(git commit-tree "$GTREE" -m "$MSG [$gi/$NGROUPS]")"
              T_GROUP0="$(now_ms)"
              if git push --force-with-lease="refs/heads/fm2-rendered:$RUN_PARENT" origin "$GNEW:refs/heads/fm2-rendered"; then
                echo "[push] gruppo $gi/$NGROUPS pubblicato: $GNEW ($(ms_s $(( $(now_ms) - T_GROUP0 )))s)"
                RUN_PARENT="$GNEW"
                pushed_groups=$((pushed_groups + 1))
              else
                # RIFIUTO = CONCORRENZA, non errore fatale: si esce dal ciclo dei
                # GRUPPI, non da quello dei TENTATIVI. Il tip remoto e' cambiato
                # sotto di noi: serve un fetch nuovo prima di riprovare.
                PUSH_FAILED=1
                PUSH_FAILED_GROUP="$gi"
                RIFIUTO_MS=$(( $(now_ms) - T_GROUP0 ))
                echo "[WARN] Push del gruppo $gi/$NGROUPS RIFIUTATO (tentativo $i/8):"
                echo "       scrittura concorrente su fm2-rendered (lease scaduto)."
                echo "       Serie parziale: i gruppi 1..$((gi-1)) sono pubblicati, dal"
                echo "       gruppo $gi in poi NO. Si ritenta dal fetch del tip fresco"
                echo "       (la preparazione NON si rifa': OWN_TREE e' gia' pronto)."
                rm -f "$IDXG"
                break
              fi
              gi=$((gi + 1))
            done
            rm -f "$IDXG"
            T_PUSH_MS=$(( $(now_ms) - T_PUSH0 ))
            PUSH_OK_MS=$(( T_PUSH_MS - RIFIUTO_MS ))
            # ---- (3) DIAGNOSI: una riga per tentativo ----
            if [ "$PUSH_FAILED" -ne 0 ]; then
              echo "[diag] tentativo $i/8: prep=$(ms_s "$T_PREP_ATT_MS")s push=$(ms_s "$PUSH_OK_MS")s rifiuto=$(ms_s "$RIFIUTO_MS")s tip=${RUN_PARENT:0:12} fetch=$(ms_s "$T_FETCH_MS")s gruppo=$PUSH_FAILED_GROUP/$NGROUPS"
              # `sleep` crescente CON JITTER: due merge possono perdere il lease
              # nello stesso istante e ritentare IN SINCRONO; il jitter
              # `RANDOM % 5` (0..4 s) li disallinea. Nessuno sleep a i=8.
              if [ "$i" -lt 8 ]; then
                SLEEP_S=$(( i * 4 + RANDOM % 5 ))
                echo "       Backoff ${SLEEP_S}s prima del tentativo $((i + 1))/8."
                sleep "$SLEEP_S"
              fi
              continue
            fi
            # ---- (4) VERIFICA: i gruppi DEVONO ricostruire esattamente TARGET ----
            if [ "$GTREE" != "$TREE" ]; then
              echo "[ERROR] Incoerenza: il tree finale dei gruppi ($GTREE) != TARGET ($TREE)."
              echo "        Nessun ulteriore push; il branch ha l'ultimo gruppo pubblicato."
              exit 1
            fi
            echo "[diag] tentativo $i/8: prep=$(ms_s "$T_PREP_ATT_MS")s push=$(ms_s "$PUSH_OK_MS")s rifiuto=$(ms_s "$RIFIUTO_MS")s tip=${RUN_PARENT:0:12} fetch=$(ms_s "$T_FETCH_MS")s"
            echo "[diag] totale: prep_unica=$(ms_s "$T_PREP_MS")s tentativi=$i step=$(ms_s $(( $(now_ms) - T_STEP0 )))s"
            echo "[INFO] Push incrementale completato: $pushed_groups/$NGROUPS gruppi, tree finale == TARGET ($TREE), tentativo $i/8."
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "[ERROR] Push su fm2-rendered non riuscito dopo 8 tentativi (ultimo rifiuto al gruppo ${PUSH_FAILED_GROUP:-?}/${NGROUPS:-?})."
          echo "        I GRUPPI GIA' PUBBLICATI RESTANO VALIDI: ogni gruppo e' un"
          echo "        commit orphan gia' pushato con lease verificato, quindi il"
          echo "        branch non e' rotto ne' corrotto. Mancano solo i gruppi dal"
          echo "        ${PUSH_FAILED_GROUP:-1} in poi: i path dei cinque fornitori"
          echo "        sono DISGIUNTI, quindi il parziale non sovrascrive nulla."
          echo "        IL RUN SUCCESSIVO COMPLETA: al prossimo giro il diff"
          echo "        BASE->TARGET contiene solo i path ancora assenti e li"
          echo "        ripubblica con lo stesso meccanismo. Nessun intervento manuale."
          echo "[diag] totale: prep_unica=$(ms_s "$T_PREP_MS")s tentativi=8 step=$(ms_s $(( $(now_ms) - T_STEP0 )))s"
          exit 1

      - name: Aggiorna subito l'indice aggregato
        if: success() && steps.commit_webp.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
            -d '{"event_type":"forecast-maps-published"}'
