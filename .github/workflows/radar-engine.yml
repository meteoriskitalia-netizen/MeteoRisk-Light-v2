name: Radar Engine (Fase 1 — Storm Detection & Tracking)

# Meteorisk Radar Engine — Fase 1 (MVP + descrittore di struttura convettiva).
# Cattura VMI Radar-DPC (GeoTIFF Float32 quantitativo, licenza CC-BY-SA 4.0),
# rileva celle convettive, le traccia multi-frame e pubblica SOLO output derivati
# (data/radar/{latest.json, storms.geojson, tracks.json, convective_structures.json}).
#   - Fonte: REST API ufficiale DPC (findLastProductByType + downloadProduct).
#   - MAI pubblicato/committato il GeoTIFF raw (cache temporanea solo runtime).
#   - Failure policy: rc 0 ok | rc 3 degraded (fetch parziale) | rc 4 error
#     (nessun frame valido / GeoTIFF corrotto / CRS non interpretabile).
#   - In caso di errore il motore scrive SOLO latest.json (status=error):
#     storms.geojson/tracks.json/convective_structures.json dell'ultimo dataset
#     valido restano intatti.
#   - Commit SOLO se data/radar (o data/state) cambia (nessuna commit su no-op).
#   - Descrittore di struttura convettiva: convective_structures.json (SOI,
#     EXPERIMENTAL, rotazione NON misurabile) viene committato insieme ai
#     derivati cella/track (alimenta il pannello "Struttura convettiva"
#     dell'app); data/state/severe_predictions.jsonl e' il registro append-only
#     delle predizioni (rotazione 30 giorni) per la futura validazione.
#     2026-11-18 — ARCHIVIO ADDITIVO: le stesse righe vengono accumulate in blob
#     GIORNALIERI su un branch cache orphan `predictions-archive`
#     (data/state/predictions/YYYY/MM/DD.jsonl, retention 365 giorni), mai su
#     main. I consumatori attuali del registro a 30 giorni NON cambiano.

on:
  # 2026-11-12: rimosso l'input `run_unit_tests`. Serviva a ACCENDERE i test
  # su dispatch manuale, ma il trigger di produzione (cron-job.org) manda solo
  # {"ref":"main"}: i test non giravano mai. Ora la suite radar_engine gira
  # SEMPRE (step "Unit tests"), quindi l'interruttore non ha piu' ragione di
  # esistere. Un dispatch che passasse ancora quell'input riceverebbe 422.
  workflow_dispatch:
  repository_dispatch:
    types: [ci-run]

permissions:
  contents: write
  pages: write
  id-token: write

# CONCURRENCY: restano SOLO i due gruppi a livello di JOB.
# Il blocco `concurrency` di WORKFLOW (`group: radar-engine-${{ github.ref }}`,
# introdotto il 2026-11-12) e' stato RIMOSSO: l'audit misura 98/100 run verdi
# e zero failure transitorie, quindi la coda NON proteggeva nulla e faceva
# slittare i dispatch successivi (cadenza 10 minuti, run da ~1-2 minuti).
# Restano: (a) il gruppo di JOB `radar-history`, che serializza le run del
# motore sul fetch+push dell'archivio rolling (niente race sullo stesso
# ref); (b) il gruppo di JOB `pages-deploy-2`, che serializza i soli deploy
# di Pages insieme a update-weather-data senza bloccare il job dati/motore.
# satellite-engine NON usa `pages-deploy-2`: il suo gruppo e'
# `satellite-cache` (omonimo del branch dati), quindi non entra in coda qui.

jobs:
  radar-engine:
    runs-on: ubuntu-latest
    # 2026-11-12: 20 -> 15 minuti. Durata MISURATA dei run reali: 41-135 s
    # (job completo). 15 minuti e' ~7x il massimo misurato: un tetto che non
    # taglia un run sano ma ferma un blocco (fetch che non risponde).
    timeout-minutes: 15
    # Serializza le 2 cron del motore tra loro (archivio radar-history:
    # niente fetch/push concorrenti sulla stessa finestra rolling).
    # cancel-in-progress: false -> la run in coda prosegue, non viene
    # cancellata. Gruppo PROPRIO: non entra in coda con i deploy del meteo.
    # 2026-11-12: la serializzazione PRIMARIA e' ora quella a livello di
    # workflow (group "radar-engine-${{ github.ref }}", sopra): questa a
    # livello di job resta come seconda difesa, invariata.
    concurrency:
      group: radar-history
      cancel-in-progress: false
    steps:
      # ── MISURA DEI TEMPI (2026-11-12) ────────────────────────────────────
      # Ogni step con blocco `run:` scrive due righe (begin/end) in
      # $RUNNER_TEMP/timings/marks.tsv con `date +%s%3N` (epoch ms).
      # t0 = inizio del primo step del job (NON `github.run_started_at`, che
      # non esiste nel contesto `github`: si espande a stringa vuota).
      # La coda dovuta alla concurrency (run creato -> job avviato) NON e'
      # misurabile da dentro il workflow: si legge dall'API.
      # LIMITE DICHIARATO: gli stadi INTERNI al motore (fetch DPC, preprocess,
      # detect, tracking, storm object, structure, phase2, write) NON sono
      # separabili da fuori — main.py li esegue in un solo processo e non
      # stampa tempi per stadio, e questa task vieta di toccare il codice
      # Python. Lo step "Timings -> latest.json" li pubblica come null con il
      # motivo (null_reason), non come stime.
      - name: "Timings: init"
        run: |
          mkdir -p "$RUNNER_TEMP/timings"
          # t0 = inizio del primo step del job. NON si usa
          # `github.run_started_at`: NON esiste nel contesto `github` e si
          # espande a stringa vuota (MISURATO il 2026-11-12 sul primo run:
          # `run_started_at=` vuoto nel log). La coda fra creazione del run e
          # avvio del job si legge dall'API (run_started_at -> job.started_at),
          # non da qui.
          printf 't0\t%s\n' "$(date +%s%3N)" > "$RUNNER_TEMP/timings/marks.tsv"
          date -u +%FT%TZ > "$RUNNER_TEMP/timings/t0_iso.txt"
          echo "[INFO] timings: $RUNNER_TEMP/timings/marks.tsv (t0=$(cat "$RUNNER_TEMP/timings/t0_iso.txt"))"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 1.2.4.26 — uv al posto di pip. MISURA della baseline: step 12,7 s, di
      # cui 8,45 s di install e 1,5 s di download -> una cache pip da sola non
      # basta (risparmia il download, non l'install). La cache di setup-uv
      # copre i wheel e `uv pip install` e' ~1 ordine di grandezza piu' veloce
      # di pip. Misura sul runner: 2 run reali dopo il push; se lo step non
      # scende, si torna a `python -m pip install` (rollback di 3 righe).
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "scripts/radar_engine/requirements*.txt"

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          tmark() { printf '%s\t%s\n' "$1" "$(date +%s%3N)" >> "$RUNNER_TEMP/timings/marks.tsv"; }
          tmark begin:install_deps
          uv pip install --system -r scripts/radar_engine/requirements-dev.txt
          tmark end:install_deps

      - name: Unit tests — suite radar_engine (SEMPRE, anche sulle run schedate)
        # 2026-11-12 — DIFETTO RIPARATO: prima questo step aveva
        #   if: github.event_name != 'workflow_dispatch' || inputs.run_unit_tests
        # ma il trigger di PRODUZIONE e' la workflow_dispatch di cron-job.org,
        # che manda solo {"ref":"main"} senza input: quindi in produzione i
        # test non giravano MAI (610 test mai eseguiti). Ora la suite
        # radar_engine gira SEMPRE e un rosso fa fallire il run PRIMA del
        # motore (nessun output derivato pubblicato da codice non testato).
        # Misura (main @ 5742a0f7, 2026-11-12, host locale): 446 test in 34 s.
        # COSA RESTA FUORI: `scripts/tests` (l'intera suite del repository,
        # oltre radar_engine) — non veniva eseguita nemmeno prima, e contiene
        # test legati ai dataset che richiedono `data/` popolata.
        timeout-minutes: 8
        run: |
          tmark() { printf '%s\t%s\n' "$1" "$(date +%s%3N)" >> "$RUNNER_TEMP/timings/marks.tsv"; }
          tmark begin:unit_tests
          python -m pytest scripts/tests/radar_engine -q
          tmark end:unit_tests

      # L'ARCHIVIO ROLLING 2h (celle+tracks+strutture) vive nel branch
      # radar-history (mai su main): ogni run lo ripristina PRIMA del motore,
      # cosi' history.build_history() mergea lo slot corrente nei 24 slot
      # precedenti (clone dello step satellite-engine). Branch assente ->
      # finestra vuota (primo run), nessun errore.
      - name: Ripristina archivio rolling (branch radar-history)
        timeout-minutes: 3
        run: |
          tmark() { printf '%s\t%s\n' "$1" "$(date +%s%3N)" >> "$RUNNER_TEMP/timings/marks.tsv"; }
          tmark begin:restore_history
          if git fetch --depth 1 origin "+radar-history:refs/heads/radar-history-base" 2>/dev/null; then
            if git restore --source radar-history-base --worktree -- data/radar/history 2>/dev/null; then
              echo "[INFO] Archivio rolling ripristinato da radar-history."
            else
              echo "[WARN] radar-history esistente senza data/radar/history."
            fi
          else
            echo "[INFO] Branch radar-history assente (primo run): finestra vuota."
          fi
          tmark end:restore_history

      # CACHE 3D (2026-11-17): l'UNICO blob vivo del branch orphan radar-3d
      # viene ripristinato PRIMA del motore perche' main.py lo usi come
      # `prev` (volume_growth). Branch assente -> file assente -> growth null
      # con "no_previous_volume": nessun valore inventato, nessuna inferenza.
      - name: Ripristina blob volume 3D (branch radar-3d)
        timeout-minutes: 3
        run: |
          tmark() { printf '%s\t%s\n' "$1" "$(date +%s%3N)" >> "$RUNNER_TEMP/timings/marks.tsv"; }
          tmark begin:restore_3d
          if git fetch --depth 1 origin "+radar-3d:refs/heads/radar-3d-base" 2>/dev/null; then
            if git restore --source radar-3d-base --worktree -- data/radar/3d 2>/dev/null; then
              echo "[INFO] Blob 3D ripristinato da radar-3d."
            else
              echo "[WARN] radar-3d esistente senza data/radar/3d (primo run)."
            fi
          else
            echo "[INFO] Branch radar-3d assente (primo run): growth senza precedente."
          fi
          tmark end:restore_3d

      - name: Run radar engine (Fase 1)
        id: run
        timeout-minutes: 8
        run: |
          tmark() { printf '%s\t%s\n' "$1" "$(date +%s%3N)" >> "$RUNNER_TEMP/timings/marks.tsv"; }
          tmark begin:engine
          # rc 0 ok / rc 3 degraded (fetch parziale, comunque atteso) -> success;
          # rc 4 error (nessun frame valido) -> failure visibile.
          rc=0
          python scripts/radar_engine/main.py --out-dir data/radar \
            --max-frames 6 --history-dir data/radar/history || rc=$?
          echo "engine_rc=$rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            exit "$rc"
          fi
          tmark end:engine

      # ── ACCUMULO SRT1 + TRIANGOLAZIONE (2026-11-13) ─────────────────────
      # Additivo: pubblica data/radar/accumulation.json (mm per macro-area) e
      # data/radar/accumulation_validation.json (confronto con le centraline).
      # Un SRT1 non disponibile NON ferma il run radar: il modulo scrive
      # status=unavailable con il motivo ed esce 0; un guasto imprevisto e'
      # un [WARN] e il run prosegue (i derivati radar restano validi).
      - name: Accumulo SRT1 (mm, 1 h) + triangolazione centraline
        if: success()
        timeout-minutes: 5
        run: |
          tmark() { printf '%s\t%s\n' "$1" "$(date +%s%3N)" >> "$RUNNER_TEMP/timings/marks.tsv"; }
          tmark begin:accumulation
          # L'ARCHIVIO PER PROVINCIA (2026-11-23) va in $RUNNER_TEMP, NON in
          # data/radar: lo step "Build sito statico Pages" fa
          # `cp -R data/radar _site/data/radar`, quindi 400 giorni di archivio
          # finirebbero nell'artefatto Pages (~96,6 MB/anno). Il branch dati lo
          # pubblica lo step dedicato piu' sotto.
          python scripts/radar_engine/accumulation.py --out-dir data/radar \
            --stations data/stations/latest.json --max-stations 200 \
            --province-dir "$RUNNER_TEMP/srt1_provinces_new" \
            || echo "[WARN] accumulo SRT1 non disponibile: run radar invariato"
          tmark end:accumulation

      # ── TIMINGS -> latest.json (2026-11-12) ──────────────────────────────
      # PRIMA del commit: un campo scritto dopo il commit non verrebbe
      # committato (e quindi non sarebbe ne' su main ne' su Pages).
      # Additivo: aggiunge la chiave `timings_ms` al latest.json scritto dal
      # motore, senza toccare il codice Python. Se il file non c'e' o la
      # scrittura fallisce, il run PROSEGUE con un [WARN] esplicito (un guasto
      # della misura non deve fermare la pubblicazione dei dati radar).
      - name: "Timings: pubblica timings_ms in data/radar/latest.json"
        if: always()
        run: |
          tmark() { printf '%s\t%s\n' "$1" "$(date +%s%3N)" >> "$RUNNER_TEMP/timings/marks.tsv"; }
          tmark begin:write_timings
          python - <<'PY'
          import json
          import os
          import sys

          tmp = os.environ.get("RUNNER_TEMP") or "/tmp"
          marks_path = os.path.join(tmp, "timings", "marks.tsv")
          marks = {}
          try:
              with open(marks_path, encoding="utf-8") as fh:
                  for line in fh:
                      line = line.rstrip("\n")
                      if not line or "\t" not in line:
                          continue
                      key, value = line.split("\t", 1)
                      marks[key] = int(value)
          except (OSError, ValueError) as exc:
              print("[WARN] marks non leggibili (%s): timings_ms non pubblicato" % exc)
              sys.exit(0)

          ORDER = ["install_deps", "unit_tests", "restore_history", "engine",
                   "accumulation"]

          def span(name):
              b = marks.get("begin:" + name)
              e = marks.get("end:" + name)
              if b is None or e is None:
                  return None
              return e - b

          steps = {}
          started = marks.get("t0")
          # checkout + setup-python + setup-uv + init sono step senza un blocco
          # run misurabile (o gia' trascorsi quando si scrive): il loro costo e'
          # il delta fra t0 e il primo mark.
          steps["checkout_and_toolchain"] = (
              None if (started is None or "begin:install_deps" not in marks)
              else marks["begin:install_deps"] - started)
          for name in ORDER:
              steps[name] = span(name)
          t0_iso = None
          try:
              with open(os.path.join(tmp, "timings", "t0_iso.txt"), encoding="utf-8") as fh:
                  t0_iso = fh.read().strip() or None
          except OSError:
              t0_iso = None

          latest_path = os.path.join("data", "radar", "latest.json")
          try:
              with open(latest_path, encoding="utf-8") as fh:
                  payload = json.load(fh)
          except (OSError, ValueError) as exc:
              print("[WARN] %s non leggibile (%s): timings_ms non pubblicato"
                    % (latest_path, exc))
              sys.exit(0)

          def sub(dotted):
              cur = payload
              for part in dotted.split("."):
                  if not isinstance(cur, dict):
                      return None
                  cur = cur.get(part)
              return cur

          payload["timings_ms"] = {
              "unit": "ms",
              "partial": True,
              "started_at": t0_iso,
              "steps": steps,
              "engine_internal": {
                  "fetch_dpc": None,
                  "preprocess": None,
                  "detect": None,
                  "tracking": None,
                  "storm_object": None,
                  "structure": None,
                  "phase2": None,
                  "write": None,
                  "null_reason": "engine_non_espone_tempi_per_stadio",
                  "note": ("scripts/radar_engine/main.py esegue tutti gli stadi "
                           "in un solo processo e non stampa tempi per stadio; il "
                           "workflow non modifica il codice Python, quindi questi "
                           "valori sono DICHIARATI null, non stimati."),
                  "measured_subparts": {
                      "cappi_fetch_s": sub("cappi_fetch.seconds"),
                      "opera_s": sub("opera.seconds"),
                      "mosaic_s": sub("mosaic.seconds"),
                  },
              },
              "not_included": {
                  "commit_and_push_main": None,
                  "push_history_branch": None,
                  "build_site": None,
                  "upload_pages": None,
                  "null_reason": ("misurati DOPO la scrittura di questo file: "
                                  "un valore scritto dopo il commit non verrebbe "
                                  "committato"),
                  "published_in": "GITHUB_STEP_SUMMARY (step finale, sempre)",
              },
          }
          out_tmp = latest_path + ".timings.tmp"
          try:
              with open(out_tmp, "w", encoding="utf-8") as fh:
                  json.dump(payload, fh, ensure_ascii=True)
                  fh.flush()
                  os.fsync(fh.fileno())
              os.replace(out_tmp, latest_path)
          except OSError as exc:
              print("[WARN] scrittura %s fallita (%s): timings_ms non pubblicato"
                    % (latest_path, exc))
              sys.exit(0)

          print("[INFO] timings_ms scritto in %s" % latest_path)
          for key, value in steps.items():
              print("  %-26s %s" % (key, "n/a" if value is None else "%d ms" % value))
          PY
          tmark end:write_timings

      - name: Summary
        if: always()
        run: |
          {
            echo "## Meteorisk Radar Engine — Fase 1 (+ struttura convettiva)"
            echo ""
            echo "status: \`${{ steps.run.outputs.status || 'n/a' }}\` — frames: \`${{ steps.run.outputs.frames || 'n/a' }}\` — celle: \`${{ steps.run.outputs.cells || 'n/a' }}\` — track: \`${{ steps.run.outputs.tracks || 'n/a' }}\` — strutture convettive: \`${{ steps.run.outputs.structure_candidates || 'n/a' }}\`"
            echo "radar timestamp: \`${{ steps.run.outputs.radar_timestamp || 'n/a' }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Health check — freschezza radar (soglia 20 min)
        if: always()
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import json, os, sys
          path = "data/radar/latest.json"
          try:
              with open(path, encoding="utf-8") as fh:
                  data = json.load(fh)
              raw = data.get("data_latency_minutes")
              # Il campo puo' essere "11,1" (virgola decimale): senza il
              # replace il confronto con la soglia 20 e' sbagliato.
              age = float(str(raw).replace(",", ".")) if raw is not None else None
          except Exception as exc:
              print("::warning::health check radar: impossibile leggere %s (%s)" % (path, exc))
              sys.exit(0)
          if age is None:
              msg = "health check radar: data_latency_minutes assente, freschezza non verificabile"
              print("::warning::" + msg)
          elif age > 20:
              msg = "health check radar: dati vecchi di %.1f minuti (soglia 20)" % age
              print("::warning::" + msg)
          else:
              msg = "health check radar: freschezza OK (%.1f minuti, soglia 20)" % age
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("- " + msg + "\n")
          PY

      # ======================================================================
      # 1.3.0.48 - GATE SUI PAYLOAD RADAR (igiene CI).
      # MISURATO prima di questo step: `scripts/radar_engine/output.py::
      # validate_outputs(out_dir)` esisteva ed era coperto da 8 test, ma NESSUN
      # workflow lo invocava: un payload derivato malformato poteva essere
      # committato e servito. Qui valida i file che stanno per essere committati
      # (dopo timings_ms, che riscrive latest.json) e FALLISCE il run.
      # Firma reale: validate_outputs(out_dir) -> list[str] di errori (vuota = ok).
      # ======================================================================
      - name: Valida payload radar (validate_outputs, pre-commit)
        if: success()
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, os.path.join(os.getcwd(), "scripts"))
          from radar_engine.output import validate_outputs

          errors = validate_outputs("data/radar")
          if errors:
              for err in errors:
                  print("::error::payload radar invalido: %s" % err)
              sys.exit(1)
          print("[INFO] payload radar valido (latest/storms/tracks/structures)")
          PY

      - name: Commit output derivato (only if changed)
        if: success()
        timeout-minutes: 5
        run: |
          tmark() { printf '%s\t%s\n' "$1" "$(date +%s%3N)" >> "$RUNNER_TEMP/timings/marks.tsv"; }
          tmark begin:commit_push_main
          git config user.name "meteorisk-bot"
          git config user.email "actions@users.noreply.github.com"
          # Derivati scritti da output.write_outputs(): lista ESPLICITA (mai
          # data/radar/history, che vive sul branch radar-history) e guardia di
          # esistenza per il ramo status-only (rc 4: solo latest.json).
          for f in latest.json storms.geojson tracks.json storm_objects.geojson \
                   storm_tracks.json convective_structures.json \
                   doppler_coverage.geojson accumulation.json \
                   accumulation_validation.json \
                   doppler_analysis.json \
                   mesocyclone_tracks.json; do
            if [ -f "data/radar/$f" ]; then git add "data/radar/$f"; fi
          done
          # Registro append-only delle predizioni (data/state, rotazione 30 gg).
          if [ -f data/state/severe_predictions.jsonl ]; then
            git add data/state/severe_predictions.jsonl
          fi
          # 1.2.4.17: l'artefatto si chiama convective_structures.json; il vecchio
          # supercells.json non e' piu' prodotto (rimozione dal repo, se tracciato).
          git rm -q --cached --ignore-unmatch data/radar/supercells.json || true
          # Cache 3D: il volume NON va su main. Rimuove l'eventuale copia
          # storica data/radar/volume.json (migrazione una tantum al branch
          # orphan radar-3d, che ha l'unico blob vivo data/radar/3d/volume.json).
          git rm -q --cached --ignore-unmatch data/radar/volume.json || true
          if git diff --cached --quiet; then
            echo "[INFO] Nessuna modifica ai dati radar derivati."
          else
            git commit -m "chore(radar): celle convettive + strutture convettive (SOI, rotazione non misurabile) da Radar-DPC VMI"
            # RIALLINEAMENTO + RETRY (2026-11-12). Due difetti distinti:
            # 1) `actions/checkout` parte dallo SHA del DISPATCH, non dal tip di
            #    main al momento del commit: un run accodato (concurrency) trova
            #    su main i derivati di un run partito dopo il suo checkout e va
            #    in conflitto su TUTTI i 7 file dati. MISURATO il 2026-11-12
            #    (run #3303): 5 tentativi, tutti "CONFLICT (content)" su
            #    latest.json/convective_structures.json/storms.geojson/
            #    tracks.json/storm_objects.geojson/storm_tracks.json/
            #    severe_predictions.jsonl, job fallito. Il retry da solo non
            #    risolve un conflitto deterministico.
            #    `-X theirs` in un REBASE tiene il commit che stiamo applicando,
            #    cioe' i NOSTRI derivati: corretto perche' questo run ha letto i
            #    frame radar DOPO il run che ha scritto main (i run sono
            #    serializzati dalla concurrency).
            # 2) il registro `severe_predictions.jsonl` e' append-only: -X theirs
            #    terrebbe solo le nostre righe. Sotto si fa l'UNIONE (righe di
            #    main prima, poi le nostre, dedup preservando l'ordine).
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -X theirs origin main; then
                if [ -f data/state/severe_predictions.jsonl ] \
                   && git cat-file -e "HEAD^:data/state/severe_predictions.jsonl" 2>/dev/null; then
                  git show "HEAD^:data/state/severe_predictions.jsonl" > "$RUNNER_TEMP/pred_up.jsonl"
                  cat data/state/severe_predictions.jsonl >> "$RUNNER_TEMP/pred_up.jsonl"
                  awk '!seen[$0]++' "$RUNNER_TEMP/pred_up.jsonl" > "$RUNNER_TEMP/pred_union.jsonl"
                  if ! cmp -s "$RUNNER_TEMP/pred_union.jsonl" data/state/severe_predictions.jsonl; then
                    cp "$RUNNER_TEMP/pred_union.jsonl" data/state/severe_predictions.jsonl
                    git add data/state/severe_predictions.jsonl
                    git commit --amend --no-edit -q
                    echo "[INFO] registro predizioni: unione con le righe di main (nessuna riga persa)"
                  fi
                fi
                if git push origin main; then
                  ok=1
                  break
                fi
              fi
              echo "[retry] push main $i/5 fallito (non-fast-forward, conflitto o rete): rifaccio pull --rebase -X theirs"
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            if [ "$ok" != "1" ]; then
              echo "[ERRORE] push radar fallito dopo 5 tentativi"
              exit 1
            fi
          fi
          tmark end:commit_push_main

      # Il blob 3D appena prodotto passa al job `radar-3d` tramite artifact:
      # NON viene committato su main (un solo blob vivo, sul branch orphan).
      # Nei run degradati senza file l'artifact e' vuota e il job 3d esce 0.
      - name: Upload blob volume 3D (per job radar-3d)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: volume-3d
          path: data/radar/3d/volume.json
          if-no-files-found: ignore
          retention-days: 1

      # ARCHIVIO ROLLING 2h su branch ORPHAN radar-history (clone dello step
      # satellite-cache): commit singola senza parent -> history resettata ad
      # OGNI push, crescita zero, mai su main. La directory NON committata su
      # main (step precedente tocca solo i 4 file derivati); se non esiste
      # (run senza archivio / errore motore) esce con successo (niente fail
      # spurio). Il push e' protetto dalla concurrency del job (group
      # "radar-history"): le 2 cron non gareggiano sullo stesso fetch/push.
      - name: Pubblica archivio rolling radar (branch radar-history)
        if: success()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          tmark() { printf '%s\t%s\n' "$1" "$(date +%s%3N)" >> "$RUNNER_TEMP/timings/marks.tsv"; }
          tmark begin:push_history
          if [ ! -d data/radar/history ]; then
            echo "[INFO] Nessuna directory data/radar/history: archivio non aggiornato."
            tmark end:push_history
            exit 0
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/radar-history.index"
          git read-tree --empty
          git add -f data/radar/history/
          TREE=$(git write-tree)
          unset GIT_INDEX_FILE
          OLD=""
          if git rev-parse -q --verify radar-history-base >/dev/null; then
            OLD=$(git rev-parse radar-history-base^{tree})
          fi
          if [ "$OLD" = "$TREE" ]; then
            echo "[INFO] Nessuna modifica all'archivio rolling: push saltato."
            tmark end:push_history
            exit 0
          fi
          COMMIT=$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$TREE" -m "[skip ci] radar: archivio storico (finestra rolling 2h)")
          # 2026-11-12 — DIFETTO RIPARATO: era `git push --force` NUDO. Con un
          # push concorrente (o un run che parte mentre questo pusha) il force
          # nudo sovrascrive il ref remoto e cancella la storia scritta
          # dall'altro run. Ora il push usa --force-with-lease contro lo SHA
          # letto SUBITO PRIMA del push: se il ref remoto e' cambiato, git
          # RIFIUTA il push (non sovrascrive) e il ciclo rilegge lo SHA e
          # riprova. Se il branch non esiste il lease e' vuoto (= "deve non
          # esistere"), quindi la creazione non puo' cancellare nulla.
          read_remote_sha() {
            git ls-remote origin refs/heads/radar-history 2>/dev/null | awk 'NR==1 {print $1}'
          }
          for attempt in 1 2 3; do
            PARENT="$(read_remote_sha || true)"
            if [ -z "$PARENT" ]; then
              LEASE="--force-with-lease=refs/heads/radar-history:"
              EXPECT="<ref assente>"
            else
              LEASE="--force-with-lease=refs/heads/radar-history:$PARENT"
              EXPECT="$PARENT"
            fi
            echo "[INFO] push radar-history tentativo $attempt/3 (lease su $EXPECT)"
            if git push "$LEASE" origin "$COMMIT:refs/heads/radar-history"; then
              echo "[INFO] radar-history aggiornata (commit ${COMMIT:0:7})."
              tmark end:push_history
              exit 0
            fi
            echo "[WARN] push radar-history rifiutato (tentativo $attempt/3): ref remoto cambiato o rete; rileggo lo SHA e riprovo."
            sleep $((attempt * 5))
          done
          echo "[ERRORE] push radar-history fallito dopo 3 tentativi (nessuna sovrascrittura: --force-with-lease)."
          exit 1

      # ARCHIVIO DELLE PREDIZIONI (2026-11-18, ADDITIVO): il registro su main
      # resta a 30 giorni per i consumatori attuali; qui le STESSE righe vengono
      # accumulate in un blob PER GIORNO su un branch cache ORPHAN, con retention
      # 365 giorni. Un blob per giorno, MAI un unico file crescente su main.
      # Leggibile via raw per i backtest:
      #   https://raw.githubusercontent.com/meteoriskitalia-netizen/MeteoRisk-Light-v2/predictions-archive/data/state/predictions/YYYY/MM/DD.jsonl
      # Pubblicazione clone dello step radar-history: commit senza parent e push
      # con --force-with-lease (nessun --force nudo), 3 tentativi. Concurrency
      # del job/workflow gia' serializza le run, il lease protegge il ref.
      - name: Pubblica archivio predizioni (branch predictions-archive)
        if: success()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          tmark() { printf '%s\t%s\n' "$1" "$(date +%s%3N)" >> "$RUNNER_TEMP/timings/marks.tsv"; }
          tmark begin:push_predictions_archive
          # 1) righe del giorno scritte dal motore in data/state/predictions/
          NEW="$RUNNER_TEMP/predictions-new"
          rm -rf "$NEW"; mkdir -p "$NEW"
          if [ -d data/state/predictions ]; then cp -R data/state/predictions/. "$NEW"/; fi
          if [ -z "$(find "$NEW" -type f -name '*.jsonl' -print -quit)" ]; then
            echo "[INFO] Nessuna predizione prodotta: archivio non aggiornato."
            tmark end:push_predictions_archive
            exit 0
          fi
          # 2) ripristina i blob gia' pubblicati dal branch cache
          rm -rf data/state/predictions
          if git fetch --depth 1 origin "+predictions-archive:refs/heads/predictions-archive-base" 2>/dev/null; then
            git restore --source predictions-archive-base --worktree -- data/state/predictions 2>/dev/null || true
          else
            echo "[INFO] Branch predictions-archive assente (primo run): archivio vuoto."
          fi
          # 3) unione (old + new, dedup, corrotte contate, retention 365 gg)
          python scripts/radar_engine/predictions_archive.py \
            --archive-dir data/state/predictions \
            --new-dir "$NEW" \
            --retention-days 365 \
            --report "$RUNNER_TEMP/predictions-archive-report.json"
          cat "$RUNNER_TEMP/predictions-archive-report.json"
          # 4) commit ORPHAN (senza parent) + push protetto
          export GIT_INDEX_FILE="$RUNNER_TEMP/predictions-archive.index"
          git read-tree --empty
          git add -f data/state/predictions/
          NEW_TREE=$(git write-tree)
          unset GIT_INDEX_FILE
          OLD_TREE=""
          if git rev-parse -q --verify predictions-archive-base >/dev/null; then
            OLD_TREE=$(git rev-parse predictions-archive-base^{tree})
          fi
          if [ "$OLD_TREE" = "$NEW_TREE" ]; then
            echo "[INFO] Archivio predizioni invariato: push saltato."
            tmark end:push_predictions_archive
            exit 0
          fi
          COMMIT=$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$NEW_TREE" -m "[skip ci] radar: archivio predizioni (blob giornalieri, branch orphan)")
          read_remote_sha() {
            git ls-remote origin refs/heads/predictions-archive 2>/dev/null | awk 'NR==1 {print $1}'
          }
          for attempt in 1 2 3; do
            PARENT="$(read_remote_sha || true)"
            if [ -z "$PARENT" ]; then
              LEASE="--force-with-lease=refs/heads/predictions-archive:"
              EXPECT="<ref assente>"
            else
              LEASE="--force-with-lease=refs/heads/predictions-archive:$PARENT"
              EXPECT="$PARENT"
            fi
            echo "[INFO] push predictions-archive tentativo $attempt/3 (lease su $EXPECT)"
            if git push "$LEASE" origin "$COMMIT:refs/heads/predictions-archive"; then
              echo "[INFO] predictions-archive aggiornata (commit ${COMMIT:0:7})."
              tmark end:push_predictions_archive
              exit 0
            fi
            echo "[WARN] push rifiutato (tentativo $attempt/3): rileggo lo SHA e riprovo."
            sleep $((attempt * 5))
          done
          echo "[ERRORE] push predictions-archive fallito dopo 3 tentativi (nessuna sovrascrittura)."
          exit 1

      # ARCHIVIO SRT1 PER PROVINCIA (2026-11-23, ADDITIVO): statistiche orarie
      # per provincia (max/mean/p90 mm, copertura, frazione bagnata) scritte da
      # `scripts/radar_engine/srt1_province_archive.py`. Serve al verificatore
      # (`scripts/verification/risk_verification.py --radar-province-dir`), che
      # con il solo accumulation.json dichiara `radar_grid_not_embedded`.
      # MISURATO: 11.032 B/ora per 107 province contro 418.712-669.077 B di un
      # GeoTIFF SRT1 deflate -> 45,5x meno (38-61x a seconda dello slot).
      # La griglia NON viene archiviata.
      # Branch ORPHAN pubblico: e' un'opera derivata Radar-DPC e resta CC BY-SA
      # 4.0 (share-alike); README.md e LICENCE.md sono scritti dal modulo.
      # Commit senza parent + push con --force-with-lease (mai --force nudo),
      # 3 tentativi, come radar-history e predictions-archive.
      - name: Pubblica archivio SRT1 per provincia (branch srt1-province-archive)
        if: success()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          tmark() { printf '%s\t%s\n' "$1" "$(date +%s%3N)" >> "$RUNNER_TEMP/timings/marks.tsv"; }
          tmark begin:push_srt1_provinces
          NEW="$RUNNER_TEMP/srt1_provinces_new"
          if [ -z "$(find "$NEW" -type f -name '*.json' -print -quit 2>/dev/null)" ]; then
            echo "[INFO] Nessuna ora SRT1 per provincia prodotta: archivio non aggiornato."
            tmark end:push_srt1_provinces
            exit 0
          fi
          WORK="$RUNNER_TEMP/srt1_provinces"
          rm -rf "$WORK"; mkdir -p "$WORK"
          # 1) ripristina le ore gia' pubblicate dal branch (se esiste)
          if git fetch --depth 1 origin "+srt1-province-archive:refs/heads/srt1-province-archive-base" 2>/dev/null; then
            git archive srt1-province-archive-base | tar -x -C "$WORK"
          else
            echo "[INFO] Branch srt1-province-archive assente (primo run): archivio vuoto."
          fi
          # 2) aggiunge le ore di questo run (idempotente: stesso nome = stessa ora)
          cp -R "$NEW"/. "$WORK"/
          # 3) retention 400 giorni + README/LICENSE con attribuzione
          python - "$WORK" <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from radar_engine import srt1_province_archive as prov
          root = sys.argv[1]
          removed, kept = prov.prune_archive(root, keep_days=400)
          prov.ensure_branch_docs(root)
          print(f"[INFO] archivio SRT1 province: rimossi {removed}, tenuti {kept}")
          PY
          # 4) commit ORPHAN (senza parent) + push protetto
          # GIT_DIR esplicito: dopo `cd "$WORK"` la cwd e' fuori dal repo e git
          # non troverebbe il repository da solo.
          export GIT_DIR="$GITHUB_WORKSPACE/.git"
          export GIT_INDEX_FILE="$RUNNER_TEMP/srt1-province-archive.index"
          export GIT_WORK_TREE="$WORK"
          cd "$WORK"
          git read-tree --empty
          git add -f -A .
          NEW_TREE=$(git write-tree)
          cd "$GITHUB_WORKSPACE"
          unset GIT_INDEX_FILE GIT_WORK_TREE GIT_DIR
          OLD_TREE=""
          if git rev-parse -q --verify srt1-province-archive-base >/dev/null; then
            OLD_TREE=$(git rev-parse srt1-province-archive-base^{tree})
          fi
          if [ "$OLD_TREE" = "$NEW_TREE" ]; then
            echo "[INFO] Archivio SRT1 per provincia invariato: push saltato."
            tmark end:push_srt1_provinces
            exit 0
          fi
          COMMIT=$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$NEW_TREE" -m "[skip ci] radar: archivio SRT1 per provincia (statistiche orarie, branch orphan)")
          read_remote_sha() {
            git ls-remote origin refs/heads/srt1-province-archive 2>/dev/null | awk 'NR==1 {print $1}'
          }
          for attempt in 1 2 3; do
            PARENT="$(read_remote_sha || true)"
            if [ -z "$PARENT" ]; then
              LEASE="--force-with-lease=refs/heads/srt1-province-archive:"
              EXPECT="<ref assente>"
            else
              LEASE="--force-with-lease=refs/heads/srt1-province-archive:$PARENT"
              EXPECT="$PARENT"
            fi
            echo "[INFO] push srt1-province-archive tentativo $attempt/3 (lease su $EXPECT)"
            if git push "$LEASE" origin "$COMMIT:refs/heads/srt1-province-archive"; then
              echo "[INFO] srt1-province-archive aggiornata (commit ${COMMIT:0:7})."
              tmark end:push_srt1_provinces
              exit 0
            fi
            echo "[WARN] push rifiutato (tentativo $attempt/3): rileggo lo SHA e riprovo."
            sleep $((attempt * 5))
          done
          echo "[ERRORE] push srt1-province-archive fallito dopo 3 tentativi (nessuna sovrascrittura)."
          exit 1

      # L'ARTEFATTO di deploy contiene: app, dataset derivati, geografie richieste,
      # derivati radar (data/radar: latest.json/storms.geojson/tracks.json/
      # convective_structures.json),
      # gli eventi phenomena (data/phenomena: events.json/badges.json, prodotti dal
      # workflow phenomena-verify e qui SOLO copiati in _site) e la finestra rolling
      # satellite/ (branch satellite-cache, ripristinata qui
      # NOTA: NON copiamo data/fm2 ne' data/fm2-rendered: il client li legge da
      # raw.githubusercontent.com (FM_CACHE_BASE / FM_RENDERED_BASE); copiarli
      # gonfiava l'artefatto a ~8,6 GB e faceva fallire/cancellare il deploy
      # (limite Pages).
      # perché viva solo su quel branch: senza i frame il deploy seguirebbe quello
      # di satellite-engine e li cancellerebbe da Pages) — MAI _raw / _staging /
      # _workdir / payload esterni. Senza questa build il pannello "Struttura
      # convettiva" non troverebbe convective_structures.json su Pages (Pages
      # serve _site, non il repo root).
      # Serializzazione SOLO sul deploy (job deploy-pages, group "pages-deploy-2",
      # condiviso con update-weather-data e satellite-engine, cancel-in-progress:
      # false). Questo job (dati/motore) ha concurrency SOLO sul group PROPRIO
      # "radar-history" (le 2 cron del motore si serializzano tra loro per
      # l'archivio rolling): non entra in coda dietro i run lunghi del meteo.
      - name: Build sito statico Pages (app + data/latest + data/geography + data/radar + data/phenomena + satellite)
        if: success()
        timeout-minutes: 5
        run: |
          tmark() { printf '%s\t%s\n' "$1" "$(date +%s%3N)" >> "$RUNNER_TEMP/timings/marks.tsv"; }
          tmark begin:build_site
          mkdir -p _site/data
          # 1.2.4.87 - niente nome scritto a mano: il run puo' aver fatto checkout
          # di un main in cui la release ha gia' rimosso quel nome (race). La fonte
          # e' APP_FILE in VERSION; se manca o il file non esiste, fail esplicito.
          APP_FILE="$(grep -m1 '^APP_FILE=' VERSION | cut -d= -f2)"
          if [ -z "$APP_FILE" ] || [ ! -f "$APP_FILE" ]; then echo "::error::APP_FILE non trovato in VERSION"; exit 1; fi
          cp "$APP_FILE" _site/index.html
          cp sw.js _site/sw.js                                      # 1.2.4.15: Service Worker (cache applicativa)
          cp manifest.webmanifest _site/manifest.webmanifest        # 1.2.4.77: PWA installabile
          cp offline.html _site/offline.html                        # 1.2.4.77: fallback offline
          # 1.3.0.59 - VISTA SIMPLE servita su /simple/ (unico file).
          mkdir -p _site/simple
          if [ -f simple/index.html ]; then cp simple/index.html _site/simple/index.html; fi
          mkdir -p _site/icons
          cp icons/icon-192.png _site/icons/icon-192.png            # 1.2.4.77: icone PWA
          cp icons/icon-512.png _site/icons/icon-512.png
          if [ -d data/latest ]; then cp -R data/latest _site/data/latest; fi
          if [ -d data/geography ]; then cp -R data/geography _site/data/geography; fi
          if [ -d data/climate ]; then cp -R data/climate _site/data/climate; fi
          if [ -d data/stations ]; then cp -R data/stations _site/data/stations; fi
          # 1.3.0.59 - criticita' DPC per il layer della Simple.
          if [ -d data/hydro ]; then cp -R data/hydro _site/data/hydro; fi
          if [ -d data/radar ]; then cp -R data/radar _site/data/radar; fi
          if [ -d data/phenomena ]; then cp -R data/phenomena _site/data/phenomena; fi
          if git fetch --depth 1 origin "+satellite-cache:refs/heads/satellite-cache-base" 2>/dev/null && git restore --source satellite-cache-base --worktree -- satellite 2>/dev/null; then
            echo "[INFO] Finestra satellite/ ripristinata da satellite-cache per l'artifact."
          fi
          if [ -d satellite ]; then cp -R satellite _site/satellite; fi
          tmark end:build_site

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # ── RIEPILOGO TEMPI (sempre, anche se un passo precedente e' fallito) ──
      # `latest.json` contiene solo i tempi fino alla sua scrittura (che deve
      # avvenire PRIMA del commit, altrimenti il campo non verrebbe
      # committato). QUI c'e' la tabella COMPLETA del job — commit, push su
      # main, push su radar-history, build del sito compresi: e' l'evidenza
      # pubblicata a ogni run (pagina del run, sezione Summary).
      - name: "Timings: riepilogo completo (sempre)"
        if: always()
        run: |
          python - <<'PY'
          import os

          tmp = os.environ.get("RUNNER_TEMP") or "/tmp"
          path = os.path.join(tmp, "timings", "marks.tsv")
          marks = {}
          try:
              with open(path, encoding="utf-8") as fh:
                  for line in fh:
                      line = line.rstrip("\n")
                      if line and "\t" in line:
                          k, v = line.split("\t", 1)
                          marks[k] = int(v)
          except (OSError, ValueError):
              marks = {}

          ORDER = ["install_deps", "unit_tests", "restore_history",
                   "engine", "write_timings", "commit_push_main",
                   "push_history", "push_predictions_archive", "build_site"]
          LABEL = {
              "checkout_and_toolchain": "init + checkout + setup-python + setup-uv (+cache)",
              "install_deps": "install dipendenze (uv)",
              "unit_tests": "unit test radar_engine",
              "restore_history": "restore archivio rolling",
              "engine": "motore radar (fetch+preprocess+detect+tracking+storm+structure+phase2+write)",
              "write_timings": "scrittura timings_ms in latest.json",
              "commit_push_main": "commit + push su main",
              "push_history": "push branch radar-history",
              "push_predictions_archive": "push archivio predizioni (365 gg)",
              "build_site": "build _site",
          }

          def span(name):
              b = marks.get("begin:" + name)
              e = marks.get("end:" + name)
              return None if (b is None or e is None) else e - b

          rows = []
          started = marks.get("t0")
          if started is not None and "begin:install_deps" in marks:
              rows.append(("checkout_and_toolchain",
                           marks["begin:install_deps"] - started))
          else:
              rows.append(("checkout_and_toolchain", None))
          for name in ORDER:
              rows.append((name, span(name)))

          total = None
          ints = [v for v in marks.values() if isinstance(v, int)]
          if started is not None and ints:
              total = max(ints) - started

          lines = ["## Radar engine — tempi per stadio (ms)", "",
                   "| stadio | ms |", "| :--- | ---: |"]
          for name, value in rows:
              lines.append("| %s | %s |" % (LABEL.get(name, name),
                                            "n/a" if value is None else value))
          lines.append("| **TOTALE (fino all'ultimo step misurato)** | **%s** |"
                       % ("n/a" if total is None else total))
          lines.append("")
          lines.append("Stadi INTERNI al motore (fetch DPC, preprocess, detect, "
                       "tracking, storm object, structure, phase2, write): "
                       "**non misurati** — `main.py` non espone tempi per stadio "
                       "e il workflow non modifica il codice Python. Sono "
                       "pubblicati come `null` con motivo in "
                       "`data/radar/latest.json` -> `timings_ms.engine_internal`.")
          text = "\n".join(lines) + "\n"
          print(text)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(text)
          PY

  # CACHE 3D A DIMENSIONE COSTANTE — branch ORPHAN `radar-3d`.
  # Un solo blob vivo (`data/radar/3d/volume.json`), un commit SENZA parent,
  # push con --force-with-lease e 3 tentativi. Concurrency PROPRIA: non e'
  # condivisa con `radar-history`. La logica di pubblicazione e' RIPRESA
  # LETTERALMENTE dallo step "Pubblica archivio rolling radar" piu' sopra
  # (cambiati solo i nomi: radar-history -> radar-3d, history -> 3d).
  # OLD_TREE == NEW_TREE -> exit 0: nessun commit nei run che non producono
  # un volume nuovo (tipico con il gate grandine a 2 CAPPI).
  radar-3d:
    needs: radar-engine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: radar-3d
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Leggi SHA corrente del branch radar-3d
        run: |
          git fetch --depth 1 origin "+radar-3d:refs/heads/radar-3d-base" 2>/dev/null || true

      - name: Scarica blob volume 3D
        uses: actions/download-artifact@v4
        with:
          name: volume-3d
          path: data/radar/3d
          if-no-files-found: ignore

      - name: Pubblica volume 3D (branch orphan radar-3d)
        if: success()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # 2026-11-18 — CAUSA dei 12 failure consecutivi del solo job radar-3d:
          # tmark scrive in $RUNNER_TEMP/timings/marks.tsv, ma la dir timings/
          # viene creata UNA VOLTA SOLTANTO nel job radar-engine (step iniziale
          # "Prepara timings", ~riga 104). radar-3d e' un JOB SEPARATO su un
          # runner fresco: $RUNNER_TEMP/timings NON esiste, il redirect `>>`
          # fallisce con "No such file or directory", tmark ritorna != 0 e
          # `set -e` abortisce lo step in < 1s, PRIMA del guard su volume.json e
          # di QUALSIASI comando git (read-tree/rev-parse/push). Il branch
          # radar-3d assente NON c'entra: il guard -q --verify e il lease
          # vuoto sono gia' corretti e verificati (test locale su remote git).
          # Creare la dir qui rende lo step autonomo, senza toccare il push.
          mkdir -p "$RUNNER_TEMP/timings"
          tmark() { printf '%s\t%s\n' "$1" "$(date +%s%3N)" >> "$RUNNER_TEMP/timings/marks.tsv"; }
          tmark begin:push_3d
          if [ ! -f data/radar/3d/volume.json ]; then
            echo "[INFO] Nessun blob 3D prodotto: pubblicazione saltata."
            tmark end:push_3d
            exit 0
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/radar-3d.index"
          git read-tree --empty
          git add -f data/radar/3d/volume.json
          NEW_TREE=$(git write-tree)
          unset GIT_INDEX_FILE
          OLD_TREE=""
          if git rev-parse -q --verify radar-3d-base >/dev/null; then
            OLD_TREE=$(git rev-parse radar-3d-base^{tree})
          fi
          if [ "$OLD_TREE" = "$NEW_TREE" ]; then
            echo "[INFO] Blob 3D invariato: nessun commit (OLD_TREE == NEW_TREE)."
            tmark end:push_3d
            exit 0
          fi
          COMMIT=$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$NEW_TREE" -m "[skip ci] radar: volume 3D (blob unico, branch orphan)")
          # 2026-11-12 — DIFETTO RIPARATO (clone dello step radar-history): era
          # `git push --force` NUDO. Con un push concorrente (o un run che
          # parte mentre questo pusha) il force nudo sovrascrive il ref remoto
          # e cancella il blob scritto dall'altro run. Ora il push usa
          # --force-with-lease contro lo SHA letto SUBITO PRIMA del push: se
          # il ref remoto e' cambiato, git RIFIUTA il push (non sovrascrive) e
          # il ciclo rilegge lo SHA e riprova. Se il branch non esiste il lease
          # e' vuoto (= "deve non esistere"), quindi la creazione non puo'
          # cancellare nulla.
          read_remote_sha() {
            git ls-remote origin refs/heads/radar-3d 2>/dev/null | awk 'NR==1 {print $1}'
          }
          for attempt in 1 2 3; do
            PARENT="$(read_remote_sha || true)"
            if [ -z "$PARENT" ]; then
              LEASE="--force-with-lease=refs/heads/radar-3d:"
              EXPECT="<ref assente>"
            else
              LEASE="--force-with-lease=refs/heads/radar-3d:$PARENT"
              EXPECT="$PARENT"
            fi
            echo "[INFO] push radar-3d tentativo $attempt/3 (lease su $EXPECT)"
            if git push "$LEASE" origin "$COMMIT:refs/heads/radar-3d"; then
              echo "[INFO] radar-3d aggiornata (commit ${COMMIT:0:7})."
              tmark end:push_3d
              exit 0
            fi
            echo "[WARN] push radar-3d rifiutato (tentativo $attempt/3): ref remoto cambiato o rete; rileggo lo SHA e riprovo."
            sleep $((attempt * 5))
          done
          echo "[ERRORE] push radar-3d fallito dopo 3 tentativi (nessuna sovrascrittura: --force-with-lease)."
          exit 1

  # JOB DI DEPLOY PAGES — unico punto serializzato del workflow.
  # group "pages-deploy-2" condiviso con update-weather-data e deploy-pages:
  # i deploy si serializzano tra loro (cancel-in-progress: false) SENZA bloccare
  # i job dati/motore. satellite-engine NON e' in questo gruppo: usa
  # "satellite-cache" (gruppo e branch omonimi) e non entra in coda qui.
  # L'artifact "github-pages" (upload-pages-artifact) viene prodotto nel job
  # radar-engine e consumato qui da deploy-pages (stessa workflow run).
  deploy-pages:
    needs: radar-engine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-deploy-2
      cancel-in-progress: false
    steps:
      - name: Deploy su GitHub Pages
        if: success()
        id: deployment
        timeout-minutes: 5
        uses: actions/deploy-pages@v4