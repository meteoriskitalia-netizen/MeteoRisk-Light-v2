name: Forecast Maps V2 (mappe .om su cache GitHub)

# MeteoRisk forecast-maps-v2 — MOTORE server-side delle "Mappe previsionali V2".
#   - Fonti: file spaziali Open-Meteo su S3 anonimo
#     (data_spatial/<dominio>/.../<valid_time>.om + latest.json come indice).
#   - Motore: scripts/forecast_v2/forecast_v2_engine.py -> data/fm2/<dominio>/*.om
#     + data/fm2/<dominio>/latest.json (per-domain crop multi-variabile, NO-OP GUARD,
#     orizzonte INTERO del manifest del dominio: --valid-frames 0, nessun cap sul
#     prune). Attribuzione Open-Meteo (CC BY 4.0); omfiles solo a runtime.
#   - MULTI-DOMINIO = MATRIX (strategia scelta): UN JOB PER DOMINIO
#     (matrix.domain, 7 domini GEOGCRS). Motivo: i domini globali pubblicano
#     ~200 frame ciascuno (es. ncep_gfs025 209): un unico job seriale sforerebbe.
#     Il matrix isola i fallimenti (un dominio KO non uccide gli altri,
#     fail-fast:false), parallelizza i download e riduce la pressione su S3.
#     Il rischio e' la collisione di push concorrenti sullo stesso branch:
#     mitigato con concurrency PER-DOMINIO (forecast-maps-v2-<dominio>,
#     cancel-in-progress:false), commit selettivo sul path data/fm2/<dominio> e push
#     con retry (fetch + rilettura del tip fresco a ogni tentativo: i path sono
#     disgiunti per dominio, nessun conflitto di contenuto). Il FIX 1.2.4.13
#     (indice isolato, vedi sotto) fa si' che un push concorrente respinto non possa
#     piu' perdere i domini scritti nel frattempo: il commit viene ricostruito dal
#     tip fresco, non riallineato via rebase.
#   - BRANCH DATI `fm2-cache` (NON piu' `main`): i frame .om e i WebP vivono in un
#     branch "usa e getta" dedicato, la cui storia e' SEMPRE di UN SOLO COMMIT
#     (stesso pattern gia' usato per il satellite con `satellite-cache`).
#     PERCHE': il repo su `main` e' arrivato a ~96 GB, ~90 dei quali sono storia
#     git. Il workflow committava i frame .om + i WebP su `main` ogni ~10 min,
#     quindi ogni versione superata restava nei packfile per sempre. Su un branch
#     riscritto (force-push) i commit vecchi diventano irraggiungibili: la storia
#     non cresce. Schema:
#       1) i job che leggono dati preesistenti (engine e render-merge) partono dal
#          CODICE di `main` e portano i SOLI path dati da `origin/fm2-cache`
#          (`git fetch --depth=1 origin fm2-cache` + `git checkout FETCH_HEAD --
#          <path>`). Il checkout usa `filter: blob:none` + sparse-checkout: i blob
#          vengono scaricati solo per i path effettivamente materializzati;
#       2) il commit dei dati nasce IN CIMA al tip di `fm2-cache` (mai in cima a
#          `main`) e viene pushato con `git push origin <new>:refs/heads/fm2-cache`.
#          FIX 1.2.4.13 — il tree del commit e' costruito su un INDICE ISOLATO
#          (`GIT_INDEX_FILE` + `git read-tree <tip-tree>` + `git add -A <path dati>`
#          + `git write-tree`): il commit contiene SOLO path dati e NON i 165 file
#          di codice presenti nell'indice di `main`. Il retry e' per-rifetch (il
#          nuovo commit riparte dal tip fresco), non piu' un `git rebase`: non
#          esiste piu' un commit costruito su `main` da riallineare, quindi nessun
#          conflitto e nessun codice nel branch;
#       2-bis) FIX 1.2.4.14 — PUSH INCREMENTALE A SOGLIA in `render-merge`: gli
#          shard WebP sommano ~5,35 GiB su 48.464 file e UN SOLO push generava un
#          pack oltre il limite hard di GitHub (2,00 GiB: "remote: fatal: pack
#          exceeds maximum allowed size", provato nei log). Il dominio piu'
#          pesante da solo (fm2r-dwd_icon_eu, 2,08 GiB) e' gia' sopra il limite,
#          quindi la granularita' per-dominio NON basta. I path CAMBIATI (dimensione
#          reale via `stat -c %s`) vengono partizionati accumulando i byte sotto
#          THRESHOLD=1,4 GiB: ogni gruppo e' un push separato e resta ben sotto i
#          2,00 GiB. L'indice isolato e' EVOLUTIVO (parte da BASE, ogni gruppo vi
#          fa `git add -A`), cosi' dopo l'ultimo gruppo il tree coincide con
#          TARGET (verificato con un assert). Nessun file di codice entra mai nel
#          branch (allowlist invariata);
#       3) ULTIMO step di `render-merge`: SQUASH del branch a UN commit SENZA
#          genitori con lo STESSO albero (`git commit-tree` su HEAD^{tree} +
#          `git push --force-with-lease`). COMPATIBILE con il push incrementale:
#          dopo i gruppi il server ha GIA' tutti i blob e tutti i tree, quindi lo
#          squash pusha SOLO il commit (~poche centinaia di byte) — nessun byte
#          nuovo, i commit precedenti diventano irraggiungibili e non entrano
#          nella storia permanente.
#     NOTA CLIENT: data/fm2 e data/fm2-rendered NON sono piu' su `main`; il client
#     deve leggere il branch `fm2-cache` (FM_CACHE_BASE / FM_RENDERED_BASE).
#   - chmi_aladin_central_europe_2km NON e' nella matrice: il suo CRS e' PROJCRS
#     (Lambert), il motore lo salterebbe con `SKIP dominio ... (PROJCRS/Lambert)`
#     e un job con SOLO domini skip uscirebbe 1 (nessun dominio ok). Restano i 7
#     domini GEOGCRS.
#   - EGRESS: i frame full-size S3 sono tenuti in cache GitHub
#     (.cache_fm2_frames/<dominio>/<VALID>.om, actions/cache) e riusati tra run via
#     --frames-cache: si scaricano solo i frame nuovi. Cache PER-DOMINIO
#     (key fm2-frames-<dominio>-<run_number> + restore-keys fm2-frames-<dominio>-).
#   - Commit SOLO se data/fm2/<dominio> cambia (nessun churn a manifest invariato).
#   - RENDERER (fast-path raster) — HOTFIX 1.2.4.8.1: SHARD PER-DOMINIO + MERGE
#     SINGLE-WRITER, aggiornato nella 1.2.4.9 alla regione `domain` + upsampling.
#     Il vecchio job `render` monolitico (tutti i domini x 2 regioni x 2 temi ~55k
#     encode WebP, Pillow method=6) moriva SEMPRE a timeout-minutes:90 (4/4 run
#     uccise) e data/fm2-rendered non veniva mai pubblicato: la fast-path WebP del
#     client non si attivava mai. Architettura attuale (entrambi i temi light/dark
#     conservati, nessun cap sugli frame; TRE regioni per dominio: `italia`,
#     `europa` e `domain` = l'intero dominio, resa solo per i domini non globali):
#     1) `render` = MATRICE per-dominio (stessa lista dei 7 domini dell'engine,
#        fail-fast:false, concurrency forecast-maps-v2-render-<dominio>,
#        timeout-minutes:240): ogni shard scarica l'artifact engine ESATTO del
#        proprio dominio (fm2-<dominio>), renderizza SOLO quel dominio
#        (`--domains <dominio> --limit-frames 0 --method 4`, method=4 =
#        bilanciamento velocita'/size approvato, upsampling `--upsample auto`:
#        default del renderer 1.2.4.9) in un albero vuoto e carica l'artifact
#        `fm2r-<dominio>` (prefisso fm2r-: il download engine `fm2-*` del merge
#        non aggancia gli shard; le path caricate sono solo le directory
#        regione/dominio italia/<dominio>, europa/<dominio> e domain/<dominio>,
#        quindi gli shard NON pubblicano mai index.json ne' color_scales.json, che
#        vivono fuori dalle directory dominio). Un dominio engine fallito (o un
#        engine CANCELLATO dal proprio timeout) fa fallire il solo shard
#        corrispondente (download artifact per nome ESATTO): quel dominio
#        manchera' dal merge, ma NON blocca gli altri (vedi FIX B al punto 2).
#        FIX A — il timeout del job `engine` e' alzato a 180' (da 60') proprio
#        perche' i domini GLOBALI venivano cancellati a 60' esatti senza finire.
#        PERCHE' 240' — e' HEADROOM, non un fix alla cieca. Il picco misurato PRIMA
#        della 1.2.4.9 e' 227 s/shard, cioe' senza upsampling, col thinning ancora
#        attivo e senza la regione `domain`. I tre fattori si SOMMANO sul lavoro
#        dello shard: (a) il motore NON decima piu' i frame (thinning RIMOSSO: il
#        totale pubblicato passa da 630 a 844 valid_times, +34,0%; +23,4% a parita'
#        di run — rilevazione 2026-10-17); (b) l'UPSAMPLING `--upsample auto`
#        (lato corto del crop portato a ~512 px, fattore intero capato da
#        `--upsample-max`=8) moltiplica i pixel del WebP per (regione, frame): la
#        stima di riferimento e' ~9x pixel sul crop piu' piccolo, con cap teorico
#        del renderer a 8x per lato (~64x pixel nel caso limite); (c) una regione
#        in piu' (`domain`). 240' copre i tre fattori insieme con margine
#        conservativo e va RIVERIFICATO alla prima run reale: se uno shard si
#        avvicina al limite si riduce `--upsample-max` o si ripristina un cap
#        frame, NON si alza di nuovo il timeout.
#     2) `render-merge` = UNO scrittore (concurrency forecast-maps-v2-render,
#        timeout-minutes:90): riscarica gli artifact engine (fm2-*) + tutti gli
#        shard (fm2r-*), sostituisce ogni data/fm2-rendered/<regione>/<dominio>
#        con la versione autorevole dello shard (rm -rf + cp -a: le variabili
#        droppate vengono pulite), ricostruisce gli index.json per regione con
#        `render_fm_webp.py --index-only --domains <shard riusciti>` (i domini
#        senza latest.json engine o senza manifest variabili validi vengono
#        esclusi dalla gate) e fa UN SOLO commit di webp + index.json insieme
#        (nessuna finestra in cui l'indice punta a file non ancora pubblicati).
#        FIX B — RESILIENZA AGLI SHARD FALLITI: `render-merge` ha
#        `needs: render` + `if: ${{ !cancelled() }}`. La funzione di stato
#        `!cancelled()` SOSTITUISCE il controllo implicito `success()` che
#        GitHub applica di default ai job con `needs`: quindi il merge PARTE
#        anche se uno o piu' shard render FALLISCONO (o un leg della matrix
#        viene cancellato dal timeout), pubblicando i WebP dei domini riusciti.
#        NON parte solo se l'INTERO run viene cancellato dall'utente. Gli shard
#        `render` hanno gia' `strategy.fail-fast:false` (un dominio KO non
#        cancella gli altri 6). NB: un timeout di un job della matrix marca
#        QUEL leg `cancelled` (non `failure`), ma a livello RUN/SHARD il merge
#        resta avviato perche' `cancelled()` e' vero solo su cancellazione
#        esplicita del workflow; verificato sui run reali 39420286697 e
#        39347659566, dove `render-merge` e' partito con 3-4 shard render
#        falliti (conclusion `failure`, non `skipped`).
#        - Se almeno un dominio e' riuscito, la lista `--domains` NON e' vuota
#          e il merge pubblica i domini disponibili; il Summary dichiara
#          esplicitamente QUANTI e QUALI domini mancano.
#        Zero shard validi => `--index-only` esce con errore ("requires a
#        non-empty --domains"): l'indice non viene scritto, il passo fallisce e
#        nulla viene committato (nessuna pubblicazione parziale fuorviante).
#        ATTENZIONE — il limite noto NON e' il flusso (`needs`/`if`): e' la
#        PUBBLICAZIONE. Se il repo supera la quota di dimensione, il `git push`
#        verso il branch dati viene rifiutato dal pre-receive hook di GitHub
#        ("Repository is above its size quota") e NESSUN dominio viene
#        pubblicato, indipendentemente dagli shard riusciti.
#   - Il deploy Pages NON e' toccato qui: i WebP vengono pubblicati su GitHub raw
#     (raw.githubusercontent.com/.../fm2-cache/...), NON su Pages; i workflow Pages
#     non li copiano piu' (data/fm2 e data/fm2-rendered sono letti dal client via
#     FM_CACHE_BASE / FM_RENDERED_BASE, che devono puntare al branch `fm2-cache`).

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: "Ignora il NO-OP guard e riscrive i frame anche se il manifest e' invariato"
        type: boolean
        default: false
  repository_dispatch:
    types: [ci-run]

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    # Un job per dominio (7 domini GEOGCRS). Ogni job e' autonomo e parallelo:
    # il fallimento/timeout di un dominio non ferma gli altri (fail-fast:false).
    # timeout per-job alzato (20' -> 60' -> 180'): il limite e' PER-JOB (uno per
    # dominio della matrix), quindi alzarlo NON tocca gli altri job del workflow.
    # PERCHE' 180' — i due domini GLOBALI (dwd_icon, ncep_gfs025, ~209 frame
    # ciascuno) venivano CANCELLATI a 60' esatti senza aver finito (start 17:00:2x
    # -> killed 18:00:37), quindi non caricavano l'artifact fm2-<dominio> e gli
    # shard render corrispondenti fallivano ("Artifact not found"). Riferimenti
    # misurati: meteofrance_arpege_world025 (dominio globale, ~84 frame) impiega
    # ~52' solo per l'engine a cache fredda; i globali da ~209 frame hanno ~2,5x
    # i frame, quindi ~130' di solo download/encode a cache fredda. 180' copre i
    # ~209 frame con margine reale (120' sarebbe al limite). A cache calda
    # (restore-keys fm2-frames-<dominio>-) il run resta molto piu' corto: il
    # valore e' una rete di sicurezza, non il tempo atteso.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        domain:
          - dwd_icon_eu
          - dwd_icon_d2
          - ecmwf_ifs025
          - ncep_gfs025
          - ncep_gfs013
          - dwd_icon
          - meteofrance_arpege_world025
    concurrency:
      queue: max
      # Group PER-DOMINIO: le run dello stesso dominio si serializzano tra loro,
      # ma domini diversi procedono in parallelo senza degradare i deploy Pages.
      group: forecast-maps-v2-${{ matrix.domain }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Codice da `main`; i DATI arrivano dal branch `fm2-cache` nello step dopo.
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/forecast_v2
            data/fm2/${{ matrix.domain }}
          sparse-checkout-cone-mode: true

      # I dati preesistenti del dominio NON stanno piu' su `main` (la cache vive
      # sul branch `fm2-cache`, storia a un solo commit). Fetch superficiale del
      # branch + checkout del SOLO path del dominio: con `filter: blob:none` e
      # sparse-checkout i blob scaricati sono quelli di data/fm2/<dominio>.
      # Se il branch non esiste ancora (primissima esecuzione) si prosegue: il
      # motore ricostruisce la cache da S3.
      - name: Recupera i dati da fm2-cache
        run: |
          set -e
          git fetch --no-tags --depth=1 origin fm2-cache || { echo "fm2-cache non esiste ancora: prima esecuzione"; exit 0; }
          git checkout FETCH_HEAD -- "data/fm2/${{ matrix.domain }}" || echo "nessun dato precedente per data/fm2/${{ matrix.domain }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/forecast_v2/requirements.txt

      # Cache PERSISTENTE PER-DOMINIO dei frame Open-Meteo full-size scaricati
      # dall'S3 (.cache_fm2_frames/<dominio>/<VALID>.om). Chiave nuova ad ogni run
      # (github.run_number) + restore-keys col prefisso "fm2-frames-<dominio>-":
      # il job ripristina l'ultima cache disponibile per QUEL dominio (politica LRU
      # di GitHub, 10 GB per repo) e la risalva aggiornata a fine run. Il motore
      # riusa i frame gia' presenti (verifica Content-Length via HEAD) e scarica
      # SOLO i nuovi, riducendo l'egress S3.
      - name: Cache frame Open-Meteo (.om)
        uses: actions/cache@v4
        with:
          path: .cache_fm2_frames
          key: fm2-frames-${{ matrix.domain }}-${{ github.run_number }}
          restore-keys: |
            fm2-frames-${{ matrix.domain }}-

      - name: Build cache mappe previsionali V2
        id: engine
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_update }}" = "true" ]; then
            FORCE="--force"
          fi
          python scripts/forecast_v2/forecast_v2_engine.py \
            --domains ${{ matrix.domain }} \
            --valid-frames 0 \
            --out data/fm2 \
            --frames-cache .cache_fm2_frames \
            $FORCE

      - name: Summary
        if: always()
        run: |
          {
            echo "## MeteoRisk — Forecast Maps V2"
            echo ""
            echo "Dominio: \`${{ matrix.domain }}\`"
            echo ""
            if [ -f data/fm2/${{ matrix.domain }}/latest.json ]; then
              python -c "import json; d=json.load(open('data/fm2/${{ matrix.domain }}/latest.json')); f=d.get('frames',[]); print('reference_time:', d.get('reference_time')); print('frame:', len(f), '— valid_times:', len(d.get('valid_times', []))); print('byte totali:', sum(x.get('bytes',0) for x in f)); print('dominio:', d.get('domain')); print('warning:', len(d.get('warnings', []))); print('pruned:', d.get('pruned'))"
            else
              echo "latest.json non disponibile per il dominio '${{ matrix.domain }}' (run fallita prima del motore?)."
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact fm2-${{ matrix.domain }}
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fm2-${{ matrix.domain }}
          path: data/fm2/${{ matrix.domain }}
          if-no-files-found: warn
          retention-days: 1

      - name: Commit cache aggiornata su fm2-cache (only if changed)
        if: success()
        run: |
          # I DATI non vanno piu' su `main`: il commit nasce IN CIMA al tip di
          # `fm2-cache` (branch usa-e-getta, la cui storia viene poi ridotta a UN
          # solo commit dallo squash finale di render-merge).
          #
          # FIX 1.2.4.13 — ISOLAMENTO DEL TREE: il commit NON deve MAI nascere
          # dall'indice di `main` (che contiene i 165 file di codice del checkout).
          # Il nuovo albero e' costruito su un INDICE ISOLATO (GIT_INDEX_FILE) che
          # parte dal TREE del tip di `fm2-cache` e poi contiene SOLO i path
          # `data/fm2*/`: l'allowlist butta via dall'indice isolato tutto il resto,
          # quindi anche un branch gia' inquinato da run precedenti viene ripulito.
          # Il dominio corrente viene aggiunto con `git add -A -- data/fm2/<dominio>`
          # (stesso indice isolato), gli altri domini restano quelli del branch.
          git config user.name "meteorisk-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ ! -d "data/fm2/${{ matrix.domain }}" ]; then
            echo "[INFO] Nessun output per il dominio '${{ matrix.domain }}': niente da committare."
            exit 0
          fi
          MSG="chore(fm2): aggiornamento cache dominio ${{ matrix.domain }} (.om per-domain crop)"
          for i in 1 2 3 4 5; do
            git fetch --no-tags --depth=1 origin fm2-cache || true
            if git rev-parse --verify --quiet FETCH_HEAD >/dev/null 2>&1; then
              BASE="$(git rev-parse FETCH_HEAD^{tree})"
              PARENT="$(git rev-parse FETCH_HEAD)"
            else
              echo "[INFO] fm2-cache non esiste ancora: questo e' il primo commit del branch."
              BASE="$(git hash-object -t tree /dev/null)"
              PARENT=""
            fi
            IDX="$(mktemp -u)"
            rm -f "$IDX"
            # (1) base = tree del branch dati (NON l'indice di `main`)
            GIT_INDEX_FILE="$IDX" git read-tree "$BASE"
            # (2) ALLOWLIST: esce dall'indice isolato tutto cio' che non e'
            #     `data/fm2/...` (inclusi i path di codice di un branch inquinato)
            GIT_INDEX_FILE="$IDX" git ls-files -s -- . \
              ':(exclude)data/fm2/**' | cut -f2 > /tmp/fm2_drop_paths.txt
            while IFS= read -r p; do
              [ -n "$p" ] && GIT_INDEX_FILE="$IDX" git update-index --force-remove -- "$p"
            done < /tmp/fm2_drop_paths.txt
            # (3) aggiorna SOLO il dominio corrente dal working tree
            GIT_INDEX_FILE="$IDX" git add -A -- "data/fm2/${{ matrix.domain }}"
            TREE="$(GIT_INDEX_FILE="$IDX" git write-tree)"
            rm -f "$IDX"
            # NO-OP: albero identico al tip => nessun churn.
            if [ "$TREE" = "$BASE" ]; then
              echo "[INFO] Nessuna modifica a data/fm2/${{ matrix.domain }} (NO-OP)."
              exit 0
            fi
            if [ -n "$PARENT" ]; then
              NEW="$(git commit-tree "$TREE" -p "$PARENT" -m "$MSG")"
            else
              NEW="$(git commit-tree "$TREE" -m "$MSG")"
            fi
            if git push origin "$NEW:refs/heads/fm2-cache"; then
              echo "[INFO] Push su fm2-cache riuscito (tentativo $i/5)."
              exit 0
            fi
            echo "[WARN] Push su fm2-cache rifiutato (race sul branch) - tentativo $i/5"
            sleep $((i*3))
          done
          echo "[ERROR] Push su fm2-cache non riuscito dopo 5 tentativi."
          exit 1

  render:
    # SHARD PER-DOMINIO (hotfix 1.2.4.8.1): un job per dominio, ciascuno renderizza
    # SOLO il proprio dominio (--domains ${{ matrix.domain }}, le TRE regioni
    # italia/europa/domain, entrambi i temi) in un albero vuoto e carica
    # l'artifact fm2r-<dominio>.
    # Gli shard NON possono scrivere gli index.json (ognuno vedrebbe solo se stesso):
    # li ricostruisce il single-writer render-merge.
    name: render (${{ matrix.domain }})
    needs: engine
    # !cancelled(): un dominio engine fallito non blocca gli altri 6 shard — quel
    # dominio manchera' dal --in del merge e verra' escluso dalla gate.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Timeout del shard 150' -> 240': i 227 s/shard misurati PRIMA della 1.2.4.9
    # non coprono thinning rimosso (+34,0% frame; +23,4% a parita' di run),
    # upsampling (~9x pixel sul crop piu' piccolo) e regione `domain` (vedi
    # l'header di questo file). E' MARGINE conservativo, non un fix alla cieca:
    # va riverificato alla prima run reale. Il vecchio render monolitico
    # (method=6, tutti i domini) moriva sempre a 90'.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        domain:
          - dwd_icon_eu
          - dwd_icon_d2
          - ecmwf_ifs025
          - ncep_gfs025
          - ncep_gfs013
          - dwd_icon
          - meteofrance_arpege_world025
    concurrency:
      queue: max
      # Group PER-DOMINIO: gli shard si serializzano solo tra run dello stesso
      # dominio; i 7 domini procedono in parallelo tra loro e rispetto all'engine.
      group: forecast-maps-v2-render-${{ matrix.domain }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          # Shard senza credenziali persistite: non pushano (nessun commit qui).
          persist-credentials: false
          filter: blob:none
          # Solo il renderer: lo shard deve renderizzare in un albero VUOTO
          # (data/fm2-rendered esistente non serve: il merge fa il continuity).
          sparse-checkout: |
            scripts/forecast_v2
          sparse-checkout-cone-mode: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/forecast_v2/requirements.txt

      - name: Download artifact engine fm2-${{ matrix.domain }}
        uses: actions/download-artifact@v4
        with:
          # Nome ESATTO (non pattern): se l'engine del dominio e' fallito questo
          # step fallisce e lo shard viene escluso (intenzionale).
          name: fm2-${{ matrix.domain }}
          path: /tmp/fm2art

      - name: Assemble dominio engine
        run: |
          mkdir -p "data/fm2/${{ matrix.domain }}"
          cp -a /tmp/fm2art/. "data/fm2/${{ matrix.domain }}/"

      - name: Build WebP shard ${{ matrix.domain }} (italia/europa/domain, light+dark)
        run: |
          # --method 4 = bilanciamento velocita'/size approvato (6 = massima
          # compressione ma troppo lento: il render monolitico a method=6 moriva
          # sempre a 90'). --limit-frames 0 = orizzonte INTERO del manifest.
          python scripts/forecast_v2/render_fm_webp.py \
            --in data/fm2 \
            --out data/fm2-rendered \
            --domains ${{ matrix.domain }} \
            --limit-frames 0 \
            --method 4

      - name: Summary
        if: always()
        run: |
          {
            echo "## MeteoRisk — Forecast Maps V2 (shard render ${{ matrix.domain }})"
            echo ""
            echo "WebP prodotti: $(find data/fm2-rendered -name '*.webp' 2>/dev/null | wc -l)"
            if [ -d data/fm2-rendered ]; then
              echo "Byte totali: $(du -sb data/fm2-rendered | cut -f1)"
            else
              echo "Byte totali: 0 (nessun output)"
            fi
            echo ""
            echo "Manifest per-var (latest.json -> generated_at / variable / theme):"
            find data/fm2-rendered -name latest.json 2>/dev/null | sort | while read -r m; do
              python -c "import json,sys; d=json.load(open(sys.argv[1])); print(sys.argv[1], '->', d.get('generated_at'), d.get('variable'), d.get('theme'))" "$m"
            done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact fm2r-${{ matrix.domain }}
        if: success()
        uses: actions/upload-artifact@v4
        with:
          # Prefisso fm2r- (NON fm2-): il download engine `fm2-*` del merge non
          # deve agganciare gli artifact degli shard. Solo le directory dominio:
          # index.json e color_scales.json vivono fuori da queste path e NON
          # vengono caricati dagli shard (single-writer li riscrive).
          name: fm2r-${{ matrix.domain }}
          path: |
            data/fm2-rendered/italia/${{ matrix.domain }}
            data/fm2-rendered/europa/${{ matrix.domain }}
            data/fm2-rendered/domain/${{ matrix.domain }}
          if-no-files-found: warn
          retention-days: 1

  render-merge:
    # SINGLE-WRITER (hotfix 1.2.4.8.1): riscarica gli artifact engine + tutti gli
    # shard fm2r-*, sostituisce le directory dominio con la versione autorevole
    # dello shard, ricostruisce gli index.json per regione (--index-only) escludendo
    # i domini senza shard riuscito o senza manifest validi, e fa UN solo commit di
    # webp + index.json (nessuna finestra in cui l'indice punta a file mancanti).
    name: render-merge (indice + commit)
    needs: render
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Timeout 30' -> 90' -> 120'. Il passaggio a 90' copriva (a) il download di
    # TUTTI gli shard, (b) la copia delle directory dominio per TRE regioni
    # (italia/europa/domain) invece di due e (c) la riscrittura degli index.json
    # su un albero cresciuto per frame non piu' decimati (thinning rimosso,
    # +34,0% valid_times). Il passaggio a 120' (FIX 1.2.4.14) aggiunge il costo
    # del PUSH INCREMENTALE: N push separati (stima 5-8, soglia 1,4 GiB) invece
    # di uno solo. Per ogni push git deve costruire il pack degli oggetti nuovi
    # (walk dell'albero + hashing di ~15k file/gruppo) e uploadare ~1,4 GiB; a
    # ~20 MiB/s di upload verso GitHub sono ~75 s/push, quindi ~10-25' in piu'
    # sull'intero merge. 120' e' margine conservativo su un totale che gia' oggi
    # non e' mai stato misurato a pieno regime: da riverificare alla prima run
    # reale. Se anche 120' non bastasse si ALZA IL NUMERO DI GRUPPI (soglia piu'
    # bassa) per ridurre il picco per-push, oppure si riduce il lavoro di render
    # (--upsample-max / cap frame), NON si alza di nuovo il timeout a caso.
    timeout-minutes: 120
    concurrency:
      queue: max
      # Lock del single-writer: serializza SOLO il merge (disgiunto dal matrix
      # engine forecast-maps-v2-<dominio> e dagli shard forecast-maps-v2-render-<dominio>).
      group: forecast-maps-v2-render
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Il codice vive su `main`; i dati WebP/indice sono presi da `fm2-cache` (NON da main).
          ref: main
          fetch-depth: 1
          persist-credentials: true
          filter: blob:none
          # Solo il renderer: il merge ha bisogno del codice renderer e puo' integrare
          # dati preesistenti da fm2-cache (pullati nello step successivo).
          sparse-checkout: |
            scripts/forecast_v2
            data/fm2-rendered
          sparse-checkout-cone-mode: true

      # Porta da `fm2-cache` i dati preesistenti che servono per l'indice/continuita'
      # (data/fm2-rendered intero). Con `filter: blob:none` i blob vengono scaricati
      # solo per il path richiesto.
      #
      # FIX 1.2.4.15 — TOLLERANZA DEL CHECKOUT. `git checkout FETCH_HEAD -- <path>`
      # esce 1 sia quando il path NON esiste sul branch sia quando esiste nell'albero
      # ma sta FUORI dal cone dello sparse-checkout del job. Qui servono DUE path
      # (`data/fm2` e `data/fm2-rendered`) con esiti INDIPENDENTI: sul branch reale
      # `data/fm2` esiste (0 webp, quindi `data/fm2-rendered` no), quindi il vecchio
      # `|| echo` su un solo path copriva il caso sbagliato. La guardia `git ls-tree`
      # verifica l'esistenza NELL'ALBERO prima di tentare, e ogni checkout e' reso
      # non fatale (`2>/dev/null || echo`): con `set -e` (il job gira con
      # `/usr/bin/bash -e`, vedi log) un fallimento dentro un `if` NON e' coperto da
      # `||`, quindi la tolleranza va messa sul singolo comando.
      - name: Recupera i dati da fm2-cache
        run: |
          set -e
          git fetch --no-tags --depth=1 origin fm2-cache || { echo "fm2-cache non esiste ancora: prima esecuzione"; exit 0; }
          # I path NEL TREE ma FUORI dal cone fanno fallire il checkout (avviso
          # "matched paths that exist outside of your sparse-checkout definition"):
          # disabilito lo sparse-checkout, cosi' entrambi i path sono restorabili.
          git sparse-checkout disable >/dev/null 2>&1 || true
          if git rev-parse --verify --quiet FETCH_HEAD >/dev/null 2>&1; then
            for p in data/fm2 data/fm2-rendered; do
              if git ls-tree --name-only FETCH_HEAD -- "$p" 2>/dev/null | grep -q .; then
                echo "[fetch] $p presente sul branch: checkout."
                git checkout FETCH_HEAD -- "$p" 2>/dev/null || echo "[fetch] $p: checkout non riuscito (tollerato)."
              else
                echo "[fetch] $p assente sul branch (nessun dato precedente): salto il checkout."
              fi
            done
          fi

      - name: Download fm2 artifacts (engine)
        uses: actions/download-artifact@v4
        with:
          pattern: fm2-*
          path: /tmp/fm2arts

      - name: Assemble fm2 domains (engine)
        run: |
          for d in /tmp/fm2arts/fm2-*/; do dom="${d%/}"; dom="${dom##*fm2-}"; mkdir -p "data/fm2/$dom"; cp -a "$d." "data/fm2/$dom/"; done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/forecast_v2/requirements.txt

      - name: Download render shard artifacts (fm2r-*)
        uses: actions/download-artifact@v4
        with:
          pattern: fm2r-*
          path: /tmp/fm2r

      - name: Assemble shard + lista domini renderizzati
        id: shards
        run: |
          # Per ogni shard: sostituisci data/fm2-rendered/<regione>/<dominio> con la
          # versione dello shard (rm PRIMA: l'albero dello shard e' autorevole per quel
          # dominio, le variabili droppate vanno pulite). Raccogli i domini con almeno
          # una regione -> output `domains` (CSV) per il passo --index-only.
          domains=""
          for d in /tmp/fm2r/fm2r-*/; do
            [ -d "$d" ] || continue
            dom="${d%/}"; dom="${dom##*fm2r-}"
            got=0
            for region in italia europa domain; do
              src="$d$region/$dom"
              if [ -d "$src" ]; then
                rm -rf "data/fm2-rendered/$region/$dom"
                mkdir -p "data/fm2-rendered/$region"
                cp -a "$src" "data/fm2-rendered/$region/$dom"
                got=1
              fi
            done
            if [ "$got" -eq 1 ]; then
              if [ -z "$domains" ]; then domains="$dom"; else domains="$domains,$dom"; fi
            else
              echo "[WARN] shard $dom: nessuna regione presente, escluso dal merge"
            fi
          done
          echo "domains=$domains" >> "$GITHUB_OUTPUT"
          echo "[shard] domini renderizzati: ${domains:-NESSUNO}"

      - name: Rebuild index.json per regione (--index-only)
        id: index
        run: |
          # Se la lista e' vuota il renderer esce con errore (nessun dominio
          # valido: nessuna pubblicazione, step FAIL visibile) — zero shard validi
          # => nessun commit, nessun prune. Gli index.json e i webp vengono
          # committati INSIEME nel passo successivo (single-writer).
          python scripts/forecast_v2/render_fm_webp.py \
            --in data/fm2 \
            --out data/fm2-rendered \
            --index-only \
            --domains "${{ steps.shards.outputs.domains }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## MeteoRisk — Forecast Maps V2 (render-merge)"
            echo ""
            echo "Shard merge (steps.shards.outputs.domains): \`${{ steps.shards.outputs.domains }}\`"
            # Dichiarazione ESPLICITA dei domini MANCANTI (resilienza trasparente):
            # un dominio con engine cancellato/timeout o shard render fallito non
            # compare nel CSV degli shard riusciti. Il merge pubblica comunque i
            # domini disponibili; qui si dice quanti e quali mancano, invece di
            # lasciare un merge silenziosamente parziale.
            MERGED="${{ steps.shards.outputs.domains }}"
            EXPECTED="dwd_icon_eu,dwd_icon_d2,ecmwf_ifs025,ncep_gfs025,ncep_gfs013,dwd_icon,meteofrance_arpege_world025"
            missing=""
            n_missing=0
            IFS=',' read -ra exp <<< "$EXPECTED"
            for d in "${exp[@]}"; do
              case ",$MERGED," in
                *",$d,"*) : ;;
                *) missing="${missing:+$missing,}$d"; n_missing=$((n_missing+1)) ;;
              esac
            done
            echo "Domini attesi: $(printf '%s' "$EXPECTED" | tr ',' '\n' | wc -l) — merge: $(printf '%s' "$MERGED" | tr ',' '\n' | grep -c . ) — mancanti: $n_missing"
            if [ "$n_missing" -gt 0 ]; then
              echo "Domini MANCANTI (engine cancellato/timeout o shard render fallito): \`${missing}\`"
              echo ""
              echo "> Il merge ha pubblicato i domini riusciti. I domini mancanti restano"
              echo "> allo snapshot precedente su \`fm2-cache\` (nessun buco: non vengono"
              echo "> cancellati dall'indice)."
            fi
            echo ""
            if [ -f data/fm2-rendered/italia/index.json ]; then
              python -c "import json; d=json.load(open('data/fm2-rendered/italia/index.json')); doms=d.get('domains',{}); print('italia — themes:', ','.join(d.get('themes',[]))); print('italia — generated_at:', d.get('generated_at')); print('italia — domini:', len(doms), '->', ', '.join(sorted(doms)))"
            else
              echo "italia — index.json non disponibile."
            fi
            if [ -f data/fm2-rendered/europa/index.json ]; then
              python -c "import json; d=json.load(open('data/fm2-rendered/europa/index.json')); doms=d.get('domains',{}); print('europa — themes:', ','.join(d.get('themes',[]))); print('europa — generated_at:', d.get('generated_at')); print('europa — domini:', len(doms), '->', ', '.join(sorted(doms)))"
            else
              echo "europa — index.json non disponibile."
            fi
            if [ -f data/fm2-rendered/domain/index.json ]; then
              python -c "import json; d=json.load(open('data/fm2-rendered/domain/index.json')); doms=d.get('domains',{}); print('domain — themes:', ','.join(d.get('themes',[]))); print('domain — generated_at:', d.get('generated_at')); print('domain — domini:', len(doms), '->', ', '.join(sorted(doms)))"
            else
              echo "domain — index.json non disponibile."
            fi
            echo ""
            echo "WebP totali in cache: $(find data/fm2-rendered -name '*.webp' 2>/dev/null | wc -l)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit WebP pre-renderizzati su fm2-cache (push incrementale, only if changed)
        if: success()
        run: |
          git config user.name "meteorisk-bot"
          git config user.email "actions@users.noreply.github.com"
          # FIX 1.2.4.15 — SPARSE-CHECKOUT DISABILITATO PRIMA DI TOCCARE L'INDICE.
          # CAUSA RADICE PROVATA (log reale run 39472462756, job 118868577950):
          # il job parte con il cone del checkout (`scripts/forecast_v2` +
          # `data/fm2-rendered`, righe ~520-525) e poi fa `git fetch`/`git read-tree`
          # e `git add -A -- data/fm2 data/fm2-rendered`. Il fetch aggiorna l'indice
          # contro i path del branch dati, ma `data/fm2/**` esiste nell'albero e sta
          # FUORI dal cone: git emette
          #   "The following paths and/or pathspecs matched paths that exist
          #    outside of your sparse-checkout definition, so will not be updated
          #    in the index:" + l'elenco di ~400 `data/fm2/...`
          # e il passo MUORE con `##[error]Process completed with exit code 1.`
          # (log righe 498-915) PRIMA di pubblicare qualsiasi cosa: lo squash resta
          # `skipped`. `data/fm2-rendered` e' assente sul branch (0 webp), quindi
          # `git add -A -- ... data/fm2-rendered` sarebbe comunque un pathspec
          # inesistente. Disabilitare lo sparse-checkout rende l'intero working tree
          # visibile e l'indice isolato e' libero di contenere i path dati: dopo
          # questo punto il job NON dipende piu' dal cone del checkout.
          git sparse-checkout disable >/dev/null 2>&1 || true
          if [ ! -d "data/fm2-rendered" ]; then
            echo "[INFO] Nessun output renderizzato: niente da committare."
            exit 0
          fi
          # webp + index.json + color_scales.json (e data/fm2/<dominio> dei domini
          # assenti dallo snapshot, via `git add -A -- data/fm2`) vengono pubblicati
          # dal single-writer, ma NON con UN solo push: vedi il FIX 1.2.4.14 sotto.
          #
          # FIX 1.2.4.14 — PUSH INCREMENTALE A SOGLIA (il push singolo sfonda il
          # limite di pack di GitHub).
          # PROBLEMA PROVATO (log reali): il job moriva con
          #   remote: fatal: pack exceeds maximum allowed size (2.00 GiB)
          #   error: remote unpack failed: index-pack failed
          #   ! [remote rejected] HEAD -> fm2-cache (failed)
          # Il pack di UN SINGOLO push contiene TUTTI gli oggetti nuovi: git invia
          # "tutti gli oggetti che il server non ha ancora" (git-scm, Transfer
          # Protocols) e OGNI push genera ESATTAMENTE UN pack, di qualunque
          # dimensione (StackOverflow 15125862; doc GitHub "Troubleshooting the
          # 2 GiB push limit"). Gli shard WebP sommano ~5,35 GiB su 48.464 file
          # `.webp`: il pack era ~5,35 GiB, cioe' 2,7x il limite hard di 2,00 GiB.
          # Il dominio piu' pesante da solo (fm2r-dwd_icon_eu 2.228.733.378 B =
          # 2,08 GiB) e' GIA' sopra il limite: la granularita' PER-DOMINIO non
          # basta (e neanche per-dominio+regione, perche' quella regione da sola
          # resta > 2 GiB, e i pesi per-regione non sono noti a priori).
          # SOLUZIONE: granularita' a SOGLIA. Si partizionano i path CAMBIATI
          # accumulando i byte REALI (`stat -c %s`) finche' la somma resta sotto
          # THRESHOLD=1,4 GiB; ogni gruppo e' un push separato e indipendente.
          # E' il criterio piu' ROBUSTO: (a) misura i byte veri, non stime
          # (per-regione, per-dominio) che possono sbagliare; (b) si adatta a
          # QUALSIASI crescita futura (se un dominio raddoppia, spuntano piu'
          # gruppi automaticamente) invece di sfondare il limite; (c) copre in un
          # colpo webp, index.json, color_scales.json e i .om senza logica
          # separata. Perche' 1,4 GiB (1400*1024*1024 = 1.468.006.400 B =
          # 68,4% del limite): il
          # pack non e' solo la somma dei blob ma aggiunge gli oggetti tree di
          # ogni livello di directory e l'header del pack; i file `.webp` sono
          # gia' compressi (la delta-compression su di essi e' ~nulla), quindi la
          # somma dei byte e' una stima dall'alto del pack. Restano 0,60 GiB di
          # headroom per tree/overhead, ampiamente sufficienti per qualche
          # migliaio di tree object (decine di KB in totale).
          # Stima gruppi (pesi reali misurati, worst-case nessun dominio
          # spezzato): 5 push minimi per i 5 domini misurati (~4,98 GiB), ~7-8
          # push con i domini non misurati. Il caso "un singolo file supera la
          # soglia" e' impossibile per i WebP (max poche centinaia di KB) ma e'
          # gestito: il file resta solo nel suo gruppo e si logga un WARN.
          #
          # COMPATIBILITA' CON LO SQUASH: il push incrementale NON e' incompatibile
          # con lo squash finale. Dopo N push il server ha gia' TUTTI i blob e
          # TUTTI i tree (compreso il tree finale identico a `TREE`); lo squash crea
          # un commit SENZA genitori che punta allo STESSO tree (gia' presente lato
          # server) e lo pusha con --force-with-lease: l'unico oggetto nuovo e' il
          # commit stesso (poche centinaia di byte). Lo squash resta quindi
          # valido, sicuro e ISTANTANEO. La storia non cresce (commit precedenti
          # irraggiungibili) esattamente come prima.
          #
          # ISOLAMENTO DEL TREE (FIX 1.2.4.13, invariato): il commit parte dal TREE
          # del tip di `fm2-cache` (indice isolato GIT_INDEX_FILE + git read-tree),
          # non dall'indice di `main`: nessun file di codice entra mai nel branch
          # dati. L'ALLOWLIST (solo `data/fm2*/`) PULISCE anche un branch gia'
          # inquinato da run precedenti. Qui l'indice isolato e' EVOLUTIVO: parte
          # da BASE (ripulito), ogni gruppo vi aggiunge i suoi path con
          # `git add -A`, quindi dopo l'ultimo gruppo il tree coincide con TARGET
          # (verificato con un assert esplicito prima di considerare il push
          # completo).
          #
          # Resilienza ai shard falliti, dichiarazione domini mancanti e
          # tolleranza `!cancelled()` restano INVARIATI (vedi job e Summary).
          MSG="chore(fm2): aggiornamento WebP pre-renderizzati + snapshot .om (regioni italia/europa/domain, light+dark)"
          # Soglia di push: 1,4 GiB. Vedi motivazione sopra (68,4% del limite di
          # 2,00 GiB; headroom 0,60 GiB per tree + overhead di pack).
          THRESHOLD=$((1400 * 1024 * 1024))
          # core.quotePath=false: i path emessi da diff-tree restano grezzi (nessun
          # quoting C), cosi' --pathspec-from-file li rilegge senza ambiguita'.
          GQ="-c core.quotePath=false"
          for i in 1 2 3 4 5; do
            # ---- (0) risolvi BASE / PARENT dal tip FRESCO ----
            git fetch --no-tags --depth=1 origin fm2-cache || true
            if git rev-parse --verify --quiet FETCH_HEAD >/dev/null 2>&1; then
              BASE="$(git rev-parse FETCH_HEAD^{tree})"
              PARENT="$(git rev-parse FETCH_HEAD)"
            else
              echo "[INFO] fm2-cache non esiste ancora: questo e' il primo commit del branch."
              BASE="$(git hash-object -t tree /dev/null)"
              PARENT=""
            fi
            # ---- (1) costruisci il TREE TARGET su un indice isolato ----
            # Identico a prima del FIX 1.2.4.14: parte da BASE, applica
            # l'ALLOWLIST (`data/fm2*/`), poi porta lo stato del working tree.
            IDXT="$(mktemp -u)"; rm -f "$IDXT"
            GIT_INDEX_FILE="$IDXT" git read-tree "$BASE"
            GIT_INDEX_FILE="$IDXT" git ls-files -s -- . \
              ':(exclude)data/fm2/**' ':(exclude)data/fm2-rendered/**' \
              | cut -f2 > /tmp/fm2_drop_paths.txt
            while IFS= read -r p; do
              [ -n "$p" ] && GIT_INDEX_FILE="$IDXT" git update-index --force-remove -- "$p"
            done < /tmp/fm2_drop_paths.txt
            ROI_DOMAIN=""
            if [ -d data/fm2 ]; then
              for d in data/fm2/*/; do
                [ -d "$d" ] && ROI_DOMAIN="$ROI_DOMAIN ${d%/}"
              done
            fi
            if [ -n "$ROI_DOMAIN" ]; then
              GIT_INDEX_FILE="$IDXT" git ls-files -- $ROI_DOMAIN \
                | while IFS= read -r p; do
                    GIT_INDEX_FILE="$IDXT" git update-index --force-remove -- "$p"
                  done
            fi
            # `data/fm2-rendered` puo' NON esistere ancora nel working tree (prima
            # pubblicazione WebP): `git add -A -- data/fm2 data/fm2-rendered`
            # fallirebbe con "fatal: pathspec 'data/fm2-rendered' did not match any
            # files" (exit 128) — path spec inesistente, non gestito da `set -e`.
            # Si aggiungono percio' SOLO i path che esistono davvero.
            add_paths=""
            for p in data/fm2 data/fm2-rendered; do
              [ -e "$p" ] && add_paths="$add_paths $p"
            done
            if [ -n "$add_paths" ]; then
              # shellcheck disable=SC2086
              GIT_INDEX_FILE="$IDXT" git add -A -- $add_paths
            fi
            TREE="$(GIT_INDEX_FILE="$IDXT" git write-tree)"
            rm -f "$IDXT"
            # NO-OP: albero identico al tip => nessun churn.
            if [ "$TREE" = "$BASE" ]; then
              echo "[INFO] Nessuna modifica ai dati (NO-OP)."
              exit 0
            fi
            # ---- (2) lista dei path CAMBIATI con dimensione (per la soglia) ----
            # `git diff-tree --name-status BASE TREE` -> righe "<STATO>\t<path>".
            # I byte sono quelli del working tree (stat -c %s); le CANCELLAZIONI
            # (status D) valgono 0 byte e vengono raccolte a parte (finiscono
            # nell'ultimo gruppo: non spostano mai la soglia dello 0).
            git $GQ diff-tree -r --no-commit-id --name-status "$BASE" "$TREE" > /tmp/fm2_changed.txt
            : > /tmp/fm2_sizes.txt   # righe "<byte>\t<path>"  (solo A/M)
            : > /tmp/fm2_dels.txt    # righe "<path>"          (solo D)
            while IFS="$(printf '\t')" read -r st path; do
              [ -z "$path" ] && continue
              case "$st" in
                D) printf '%s\n' "$path" >> /tmp/fm2_dels.txt ;;
                *)
                  if [ -f "$path" ]; then
                    sz="$(stat -c %s -- "$path" 2>/dev/null || echo 0)"
                  else
                    sz=0
                  fi
                  printf '%s\t%s\n' "$sz" "$path" >> /tmp/fm2_sizes.txt
                  ;;
              esac
            done < /tmp/fm2_changed.txt
            # ---- (3) partizione a soglia: gruppi di path sotto THRESHOLD ----
            # Ordina per dimensione DECRESCENTE (first-fit-decreasing): i file
            # grandi si sistemano per primi e i gruppi risultano piu' pieni e
            # NUMERICAMENTE MENO numerosi (meno push) a parita' di soglia.
            sort -t"$(printf '\t')" -k1,1nr /tmp/fm2_sizes.txt > /tmp/fm2_sizes_sorted.txt
            rm -rf /tmp/fm2_groups; mkdir -p /tmp/fm2_groups
            gidx=1; gbytes=0
            : > "/tmp/fm2_groups/g_${gidx}.txt"
            while IFS="$(printf '\t')" read -r sz path; do
              [ -z "$path" ] && continue
              # il prossimo file sfonderebbe la soglia E il gruppo non e' vuoto
              # => chiudi il gruppo e aprine uno nuovo.
              if [ "$gbytes" -gt 0 ] && [ $((gbytes + sz)) -gt "$THRESHOLD" ]; then
                gidx=$((gidx + 1)); gbytes=0
                : > "/tmp/fm2_groups/g_${gidx}.txt"
              fi
              printf '%s\n' "$path" >> "/tmp/fm2_groups/g_${gidx}.txt"
              gbytes=$((gbytes + sz))
              if [ "$sz" -gt "$THRESHOLD" ]; then
                echo "[WARN] path singolo oltre soglia (resta da solo nel suo gruppo): $path ($sz B)"
              fi
            done < /tmp/fm2_sizes_sorted.txt
            # Le cancellazioni (0 byte) vanno nell'ULTIMO gruppo: non cambiano
            # la somma byte, quindi non possono sfondare la soglia.
            if [ -s /tmp/fm2_dels.txt ]; then
              cat /tmp/fm2_dels.txt >> "/tmp/fm2_groups/g_${gidx}.txt"
            fi
            NGROUPS="$gidx"
            echo "[push] path cambiati: $(wc -l < /tmp/fm2_sizes.txt) A/M + $(wc -l < /tmp/fm2_dels.txt) D = $NGROUPS gruppi (soglia $THRESHOLD B)"
            # ---- (4) indice evolutivo: parte da BASE RIPULITO (allowlist) ----
            IDX="$(mktemp -u)"; rm -f "$IDX"
            GIT_INDEX_FILE="$IDX" git read-tree "$BASE"
            GIT_INDEX_FILE="$IDX" git ls-files -s -- . \
              ':(exclude)data/fm2/**' ':(exclude)data/fm2-rendered/**' \
              | cut -f2 > /tmp/fm2_drop_all.txt
            while IFS= read -r p; do
              [ -n "$p" ] && GIT_INDEX_FILE="$IDX" git update-index --force-remove -- "$p"
            done < /tmp/fm2_drop_all.txt
            # ---- (5) push gruppo per gruppo (N push, ognuno < THRESHOLD) ----
            RUN_PARENT="$PARENT"
            pushed_groups=0
            gi=1
            while [ "$gi" -le "$NGROUPS" ]; do
              GFILE="/tmp/fm2_groups/g_${gi}.txt"
              if [ ! -s "$GFILE" ]; then gi=$((gi + 1)); continue; fi
              # aggiorna l'indice evolutivo con SOLO i path del gruppo corrente:
              # -A registra aggiunte/modifiche E rimozioni (deleted path) contro
              # il working tree; --pathspec-from-file evita di sfondare ARG_MAX
              # con ~20k path per gruppo.
              GIT_INDEX_FILE="$IDX" git add -A --pathspec-from-file="$GFILE"
              GTREE="$(GIT_INDEX_FILE="$IDX" git write-tree)"
              echo "[push] gruppo $gi/$NGROUPS: $(wc -l < "$GFILE") path -> tree $GTREE"
              if [ -n "$RUN_PARENT" ]; then
                GNEW="$(git commit-tree "$GTREE" -p "$RUN_PARENT" -m "$MSG [$gi/$NGROUPS]")"
              else
                GNEW="$(git commit-tree "$GTREE" -m "$MSG [$gi/$NGROUPS]")"
              fi
              if git push origin "$GNEW:refs/heads/fm2-cache"; then
                echo "[push] gruppo $gi/$NGROUPS pubblicato: $GNEW"
                RUN_PARENT="$GNEW"
                pushed_groups=$((pushed_groups + 1))
              else
                echo "[ERROR] Push del gruppo $gi/$NGROUPS RIFIUTATO (tentativo $i/5)."
                echo "        La serie e' parziale: i gruppi 1..$((gi-1)) sono pubblicati,"
                echo "        dal gruppo $gi in poi NO. Il branch resta coerente (ultimo"
                echo "        commit pubblicato = gruppi 1..$((gi-1))); il run successivo"
                echo "        riparte dal tip fresco e ricompleta. Vedi casi limite."
                rm -f "$IDX"
                exit 1
              fi
              gi=$((gi + 1))
            done
            rm -f "$IDX"
            # ---- (6) VERIFICA: i gruppi DEVONO ricostruire esattamente TARGET ----
            if [ "$GTREE" != "$TREE" ]; then
              echo "[ERROR] Incoerenza: il tree finale dei gruppi ($GTREE) != TARGET ($TREE)."
              echo "        Nessun ulteriore push; il branch ha l'ultimo gruppo pubblicato."
              exit 1
            fi
            echo "[INFO] Push incrementale completato: $pushed_groups/$NGROUPS gruppi, tree finale == TARGET ($TREE), tentativo $i/5."
            exit 0
          done
          echo "[ERROR] Push su fm2-cache non riuscito dopo 5 tentativi."
          exit 1

      # Compattazione: riduce `fm2-cache` a UN SOLO COMMIT senza genitori (stesso albero).
      # Nessun byte nuovo, i commit precedenti diventano irraggiungibili. Viene
      # eseguito DOPO il push dei dati (path disgiunti non devono mai dare conflitto,
      # se invece si verifica un conflitto e' un errore da segnalare).
      # NESSUN checkout: il tree e' letto DIRETTAMENTE dal commit del branch
      # (`git rev-parse FETCH_HEAD^{tree}`), quindi lo squash e' un'operazione PURA
      # sul tree. Un `git checkout` qui sarebbe errato due volte: (a) cambierebbe
      # HEAD spostando l'indice di `main`, (b) fallirebbe con "Your local changes
      # would be overwritten" perche' il render-merge ha appena riscritto i file.
      - name: Compatta fm2-cache a un solo commit (squash)
        if: success()
        run: |
          git config user.name "meteorisk-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch --no-tags --depth=1 origin fm2-cache
          tree="$(git rev-parse FETCH_HEAD^{tree})"
          new=$(git commit-tree "$tree" -m "chore(fm2): snapshot cache $(date -u +%Y-%m-%dT%H:%M:%SZ)")
          for i in 1 2 3 4 5; do
            if git push --force-with-lease origin "$new:refs/heads/fm2-cache"; then
              echo "[INFO] Squash su fm2-cache a commit unico riuscito (tentativo $i/5)."
              exit 0
            fi
            echo "[WARN] Squash push rifiutato - tentativo $i/5"
            sleep $((i*3))
          done
          echo "[ERROR] Squash push non riuscito dopo 5 tentativi."
          exit 1
